<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PracExam 관리자 — 고객·운영</title>
<link rel="icon" href="/favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ══ PracExam 관리자 콘솔 — 내부 전용 ══
   app.html 의 하버 디자인을 최소한만 옮겨 왔다. 공통 파일로 빼지 않은 이유는
   핸드오프 §5 참조(세 번째로 같은 코드를 복사하게 될 때 분리한다). */
:root{
  --bg:#f7f8fa; --card:#fff; --text-main:#0f172a; --text-mid:#475569; --text-muted:#94a3b8;
  --border-clr:#e2e8f0; --border-hover:#cbd5e1; --navy:#1e3a5f; --gold:#c8a04a;
  --danger:#dc2626; --success:#059669; --warn:#b45309; --warn-bg:#fffbeb;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --card:#121a2b; --text-main:#e8eef8; --text-mid:#a9b6cc; --text-muted:#6b7a92;
    --border-clr:#22304a; --border-hover:#334765; --navy:#8fb2e0; --gold:#d8b871;
  }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text-main);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  font-size:14px;line-height:1.6;}
.wrap{max-width:920px;margin:0 auto;padding:1.5rem 1rem 4rem;}
.section-title{font-size:19px;font-weight:700;color:var(--text-main);}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:1.25rem;}
.topbar .grow{flex:1;}
.card{background:var(--card);border:1px solid var(--border-clr);border-radius:12px;
  padding:16px 18px;margin-bottom:14px;}
.btn{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:8px;
  padding:9px 16px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;}
.btn:hover{opacity:.9;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-ghost{background:none;color:var(--text-mid);border:1px solid var(--border-clr);
  border-radius:8px;padding:7px 13px;font-family:inherit;font-size:12.5px;cursor:pointer;}
.btn-ghost:hover{border-color:var(--border-hover);}
.btn-ghost.danger{color:var(--danger);border-color:rgba(220,38,38,.35);}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed;}
input[type=text],input[type=email],input[type=password],select{
  width:100%;padding:9px 12px;border:1px solid var(--border-clr);border-radius:8px;
  background:var(--card);color:var(--text-main);font-family:inherit;font-size:14px;}
label{display:block;font-size:12.5px;font-weight:600;color:var(--text-mid);margin-bottom:5px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.row > div{flex:1;min-width:150px;}
.msg{font-size:13px;margin-top:8px;min-height:20px;}
.msg.ok{color:var(--success);} .msg.err{color:var(--danger);}
.sub{font-size:15px;font-weight:700;margin:0 0 10px;color:var(--text-main);}
.muted{color:var(--text-muted);}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;font-size:13.5px;}
.kv dt{color:var(--text-muted);font-weight:600;}
.kv dd{margin:0;color:var(--text-mid);word-break:break-all;}
.hit{display:flex;align-items:center;gap:10px;border:1px solid var(--border-clr);
  border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer;background:var(--card);}
.hit:hover{border-color:var(--border-hover);}
.hit .who{flex:1;min-width:0;}
.hit .em{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hit .nm{font-size:12px;color:var(--text-muted);}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;
  border:1px solid var(--border-clr);color:var(--text-mid);white-space:nowrap;}
.pill.paid{color:var(--success);border-color:rgba(5,150,105,.35);}
.pill.comp{color:var(--gold);border-color:rgba(200,160,74,.45);}
.pill.free{color:var(--text-muted);}
.banner{border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:12px;}
.banner.warn{background:var(--warn-bg);border:1px solid rgba(180,83,9,.3);color:var(--warn);}
.banner.info{border:1px dashed var(--border-clr);color:var(--text-mid);}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border-clr);}
th{color:var(--text-muted);font-weight:600;}
code{background:rgba(127,127,127,.12);padding:1px 5px;border-radius:4px;font-size:12px;}
.gate{max-width:380px;margin:12vh auto;}
.hide{display:none !important;}
</style>
</head>
<body>

<!-- ══════════════ 로그인 ══════════════ -->
<div id="gate" class="wrap gate">
  <div class="card">
    <div class="section-title" style="margin-bottom:4px;">PracExam 관리자</div>
    <div class="muted" style="font-size:12.5px;margin-bottom:16px;">고객·운영 콘솔 (내부 전용)</div>
    <div style="margin-bottom:10px;">
      <label for="g-email">이메일</label>
      <input type="email" id="g-email" autocomplete="username">
    </div>
    <div style="margin-bottom:14px;">
      <label for="g-pw">비밀번호</label>
      <input type="password" id="g-pw" autocomplete="current-password">
    </div>
    <button class="btn" style="width:100%;" onclick="doLogin()">로그인</button>
    <div id="g-msg" class="msg"></div>
  </div>
</div>

<!-- ══════════════ 본문 ══════════════ -->
<div id="main" class="wrap hide">

  <div class="topbar">
    <div class="section-title grow">고객 · 운영</div>
    <a class="btn-ghost" href="/app" style="text-decoration:none;">문항 관리 →</a>
    <button class="btn-ghost" onclick="doLogout()">로그아웃</button>
  </div>

  <!-- 관리자가 아니거나 SQL 미실행일 때 -->
  <div id="setup-note" class="banner info hide"></div>

  <!-- 검색 -->
  <div id="search-card" class="card hide">
    <div class="row">
      <div style="flex:3;">
        <label for="q">이메일 또는 이름으로 검색 (두 글자 이상)</label>
        <input type="text" id="q" placeholder="hong@ 또는 홍길동" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div style="flex:0 0 auto;min-width:0;">
        <button class="btn" onclick="doSearch()">검색</button>
      </div>
    </div>
    <div id="q-msg" class="msg"></div>
    <div id="hits" style="margin-top:6px;"></div>
  </div>

  <!-- 고객 카드 -->
  <div id="cust" class="hide"></div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   PracExam 관리자 콘솔 — /admin
   ───────────────────────────────────────────────────────────────────────
   ⚠️ 이 파일이 공개되어 있어도 보안에는 영향이 없다. 여기 담긴 것은 anon 키뿐이고,
      모든 조회·부여는 서버의 SECURITY DEFINER RPC 가 is_admin() 으로 막는다.
      화면에서 감추는 것은 표시일 뿐 방어가 아니다.

   필요한 SQL = supabase/sql/admin_console.sql (RPC 7개)
      admin_find_users · admin_get_customer · admin_list_comp_programs
      admin_grant_comp · admin_grant_days · admin_revoke_comp  (+ grant_days)
   아직 실행 전이면 화면이 깨지지 않고 안내만 뜬다.
   ═══════════════════════════════════════════════════════════════════════ */

const SUPABASE_URL  = 'https://ufrhvodruulpgnmudzwh.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmcmh2b2RydXVscGdubXVkendoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5OTgyOTYsImV4cCI6MjA5NzU3NDI5Nn0.evW9GggJ2saXHgZah1SRQvSdle7AC5esAnrmpbm5jb8';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let PROGRAMS = [];   // admin_list_comp_programs() 결과 ('demo' 제외)
let CUR = null;      // 지금 열어 둔 고객 { user_id, account, grants, study, billing }

/* ── 유틸 ─────────────────────────────────────────────────────────── */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function when(iso, withTime){
  if(!iso) return '—';
  try{
    return new Date(iso).toLocaleString('ko-KR',
      withTime ? { dateStyle:'medium', timeStyle:'short' } : { dateStyle:'medium' });
  }catch(e){ return String(iso); }
}
function msg(id, text, ok){
  const el = $(id); if(!el) return;
  el.textContent = text || '';
  el.className = 'msg' + (text ? (ok ? ' ok' : ' err') : '');
}

// RPC 오류를 사람이 읽을 말로. 미배포(PGRST202)는 따로 구분한다.
function rpcErr(e){
  const m = String((e && (e.message || e.msg || e)) || '');
  if(/PGRST202|Could not find the function|does not exist/i.test(m))
    return '아직 SQL이 실행되지 않았습니다 — supabase/sql/admin_console.sql';
  if(/NOT_AUTHORIZED/.test(m))  return '권한 없음 (관리자 전용)';
  if(/PAYING_CUSTOMER/.test(m)) return '결제 중인 고객입니다 — 증정을 주면 만료 시 잠깁니다. 부여하지 않았습니다.';
  if(/NO_SUCH_USER/.test(m))    return '그런 계정이 없습니다';
  if(/TOO_SHORT/.test(m))       return '두 글자 이상 입력하세요';
  return m || '알 수 없는 오류';
}
function isNotDeployed(e){
  return /PGRST202|Could not find the function|does not exist/i.test(
    String((e && (e.message || e)) || ''));
}

/* ── 부팅 · 로그인 ────────────────────────────────────────────────── */
(async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) enter(); else $('gate').classList.remove('hide');
})();

async function doLogin(){
  const email = ($('g-email').value || '').trim();
  const pw    = $('g-pw').value || '';
  if(!email || !pw){ msg('g-msg', '이메일과 비밀번호를 입력하세요', false); return; }
  msg('g-msg', '확인 중…', true);
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if(error){ msg('g-msg', '로그인 실패: ' + error.message, false); return; }
  msg('g-msg', '');
  enter();
}

async function doLogout(){
  await sb.auth.signOut();
  location.reload();
}

// 관리자인지는 서버에 물어본다(하드코딩한 UID 비교가 아니라).
async function enter(){
  $('gate').classList.add('hide');
  $('main').classList.remove('hide');

  const res = await sb.rpc('admin_list_comp_programs');
  if(res.error){
    const note = $('setup-note');
    note.classList.remove('hide');
    if(isNotDeployed(res.error)){
      note.className = 'banner warn';
      note.innerHTML = '⚙️ <strong>아직 SQL이 실행되지 않았습니다.</strong><br>' +
        'Supabase SQL Editor에서 <code>supabase/sql/admin_console.sql</code> 을 전체 실행한 뒤 ' +
        '이 페이지를 새로고침하세요.';
    }else{
      note.className = 'banner warn';
      note.innerHTML = '🔒 ' + esc(rpcErr(res.error)) +
        '<br><span class="muted">관리자 계정으로 로그인했는지 확인하세요.</span>';
    }
    return;
  }

  PROGRAMS = (res.data || []).filter(p => p.is_active && p.code !== 'demo');
  $('search-card').classList.remove('hide');
  $('q').focus();
}

/* ── 검색 ─────────────────────────────────────────────────────────── */
async function doSearch(){
  const q = ($('q').value || '').trim();
  $('cust').classList.add('hide');
  if(q.length < 2){ msg('q-msg', '두 글자 이상 입력하세요', false); return; }
  msg('q-msg', '찾는 중…', true);
  $('hits').innerHTML = '';

  const res = await sb.rpc('admin_find_users', { p_q: q });
  if(res.error){ msg('q-msg', rpcErr(res.error), false); return; }

  const rows = res.data || [];
  if(!rows.length){ msg('q-msg', '결과가 없습니다', false); return; }
  msg('q-msg', rows.length + '명' + (rows.length === 20 ? ' (상위 20명만 표시)' : ''), true);

  $('hits').innerHTML = rows.map(function(r){
    const name = [r.first_name, r.last_name].filter(Boolean).join(' ');
    return '<div class="hit" onclick="openCustomer(\'' + esc(r.user_id) + '\')">' +
      '<div class="who">' +
        '<div class="em">' + esc(r.email) + '</div>' +
        '<div class="nm">' + esc(name || '이름 없음') +
          ' · ' + esc(r.language || '?') + ' · 가입 ' + when(r.signed_up_at) + '</div>' +
      '</div>' + planPill(r) + '</div>';
  }).join('');
}

function planPill(r){
  const comp = String(r.plan_code || '').slice(0,5) === 'comp_';
  if(r.is_paid && comp)  return '<span class="pill comp">증정 ' + esc(r.plan_code) + '</span>';
  if(r.is_paid)          return '<span class="pill paid">유료 ' + esc(r.plan_code || '') + '</span>';
  return '<span class="pill free">무료</span>';
}

/* ── 고객 카드 ────────────────────────────────────────────────────── */
async function openCustomer(uid){
  const box = $('cust');
  box.classList.remove('hide');
  box.innerHTML = '<div class="card muted">불러오는 중…</div>';

  const res = await sb.rpc('admin_get_customer', { p_user_id: uid });
  if(res.error){
    box.innerHTML = '<div class="card banner warn">' + esc(rpcErr(res.error)) + '</div>';
    return;
  }
  const row = Array.isArray(res.data) ? res.data[0] : res.data;
  if(!row || !row.account){
    box.innerHTML = '<div class="card muted">계정을 찾을 수 없습니다.</div>';
    return;
  }
  CUR = {
    user_id: uid,
    account: row.account || {},
    grants:  row.grants  || [],
    study:   row.study   || {},
    billing: row.billing || []
  };
  renderCustomer();
  box.scrollIntoView({ behavior:'smooth', block:'start' });
}

// 결제 중인 고객인가 = 유료인데 plan_code 가 comp_ 로 시작하지 않는다
function isPayingCustomer(a){
  return !!a.is_paid && String(a.plan_code || '').slice(0,5) !== 'comp_';
}

function renderCustomer(){
  const a = CUR.account, s = CUR.study;
  const name = [a.first_name, a.last_name].filter(Boolean).join(' ');
  const paying = isPayingCustomer(a);
  const activeGrant = (CUR.grants || []).filter(function(g){ return g.status === 'active'; })[0];

  let h = '';

  /* ── 머리 ── */
  h += '<div class="card">' +
    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">' +
      '<div class="section-title">' + esc(name || '이름 없음') + '</div>' +
      planPill(a) +
      '<div class="grow" style="flex:1;"></div>' +
      '<button class="btn-ghost" onclick="openCustomer(\'' + esc(CUR.user_id) + '\')">새로고침</button>' +
    '</div>' +
    '<dl class="kv">' +
      '<dt>이메일</dt><dd>' + esc(a.email) + '</dd>' +
      '<dt>가입</dt><dd>' + when(a.signed_up_at, true) + ' · 언어 ' + esc(a.language || '?') + '</dd>' +
      '<dt>이메일확인</dt><dd>' + (a.auth_confirmed_at ? '✓ ' + when(a.auth_confirmed_at) : '✗ 미확인') + '</dd>' +
      '<dt>마지막 로그인</dt><dd>' + when(a.last_sign_in_at, true) + '</dd>' +
      '<dt>마케팅 수신</dt><dd>' + (a.marketing_consent ? '✓ 동의' : '✗ 미동의') + '</dd>' +
      '<dt>체험 종료</dt><dd>' + when(a.trial_ends_at, true) + '</dd>' +
    '</dl></div>';

  /* ── 결제 ── */
  h += '<div class="card"><div class="sub">결제</div>' +
    '<dl class="kv">' +
      '<dt>상태</dt><dd>' + (a.is_paid ? '유료 ✓' : '무료') +
        (a.plan_code ? ' · <code>' + esc(a.plan_code) + '</code>' : '') +
        (a.sub_canceled ? ' · <span style="color:var(--warn);">해지 예약됨</span>' : '') + '</dd>' +
      '<dt>이용 만료</dt><dd>' + when(a.paid_until, true) + '</dd>' +
      '<dt>Paddle 고객</dt><dd>' + (a.customer_ref
        ? '<code>' + esc(a.customer_ref) + '</code> ' + copyBtn(a.customer_ref) : '—') + '</dd>' +
      '<dt>Paddle 구독</dt><dd>' + (a.subscription_ref
        ? '<code>' + esc(a.subscription_ref) + '</code> ' + copyBtn(a.subscription_ref) : '—') + '</dd>' +
    '</dl>';

  if(a.customer_ref || a.subscription_ref){
    h += '<div class="banner info" style="margin-top:12px;">' +
      '💳 <strong>환불·해지는 Paddle에서 처리합니다.</strong> ' +
      'Paddle이 세금까지 대신 처리하는 구조라 여기서 하면 회계가 어긋납니다. ' +
      '환불하면 웹훅이 접근권을 자동으로 내립니다.<br>' +
      '<a href="https://vendors.paddle.com/" target="_blank" rel="noopener">Paddle 대시보드 열기 →</a> ' +
      '<span class="muted">(위 ID를 복사해 검색하세요)</span></div>';
  }

  // 결제 이벤트
  if((CUR.billing || []).length){
    h += '<div class="sub" style="margin-top:14px;">최근 결제 이벤트</div><table>' +
      '<tr><th>언제</th><th>종류</th></tr>' +
      CUR.billing.map(function(b){
        return '<tr><td>' + when(b.at, true) + '</td><td><code>' + esc(b.type) + '</code></td></tr>';
      }).join('') + '</table>';
  }
  h += '</div>';

  /* ── 증정 / 체험 부여 ── */
  h += '<div class="card"><div class="sub">무료 체험 · 증정</div>';

  if(activeGrant){
    h += '<div class="banner info">' +
      '🎁 현재 <strong>' + esc(activeGrant.program) + '</strong> ' +
      (activeGrant.days ? activeGrant.days + '일' : activeGrant.months + '개월') +
      ' 진행 중 · 종료 ' + when(activeGrant.expires_at, true) +
      (activeGrant.note ? '<br><span class="muted">메모: ' + esc(activeGrant.note) + '</span>' : '') +
      '</div>';
  }

  if(paying){
    h += '<div class="banner warn">⚠️ <strong>결제 중인 고객입니다 — 증정을 줄 수 없습니다.</strong><br>' +
      '증정을 주면 <code>plan_code</code>가 <code>comp_*</code>로 덮이고, 증정이 끝나는 순간 ' +
      '만료 크론이 이 고객을 잠급니다. 돈을 내는 고객이 못 들어오게 됩니다.</div>';
  }

  h += '<div class="row" style="margin-bottom:12px;">' +
    '<div><label for="gp">프로그램</label><select id="gp">' +
      PROGRAMS.map(function(p){
        return '<option value="' + esc(p.code) + '"' + (p.code === 'gift' ? ' selected' : '') + '>' +
          esc(p.name_ko) + ' (' + esc(p.code) + ')</option>';
      }).join('') +
    '</select></div>' +
    '<div style="flex:2;"><label for="gn">메모 (왜 주는지 — 이력에 남습니다)</label>' +
      '<input type="text" id="gn" placeholder="예: 문의 응대, 세미나 감사"></div>' +
  '</div>';

  const dis = paying ? ' disabled' : '';
  h += '<div class="row" style="gap:8px;">' +
    '<button class="btn" style="flex:0;" onclick="doGrant(\'days\',7)"'    + dis + '>1주</button>' +
    '<button class="btn" style="flex:0;" onclick="doGrant(\'comp\',3)"'    + dis + '>3개월</button>' +
    '<button class="btn" style="flex:0;" onclick="doGrant(\'comp\',6)"'    + dis + '>6개월</button>' +
    '<button class="btn" style="flex:0;" onclick="doGrant(\'comp\',12)"'   + dis + '>1년</button>' +
    '<div style="flex:1;"></div>' +
    '<button class="btn-ghost danger" style="flex:0;" onclick="doRevoke()"' +
      (activeGrant ? '' : ' disabled') + '>회수</button>' +
  '</div>' +
  '<div id="g2-msg" class="msg"></div>';

  // 증정 이력
  if((CUR.grants || []).length){
    h += '<div class="sub" style="margin-top:14px;">이력</div><table>' +
      '<tr><th>프로그램</th><th>기간</th><th>종료</th><th>상태</th><th>메모</th></tr>' +
      CUR.grants.map(function(g){
        return '<tr><td>' + esc(g.program) + '</td>' +
          '<td>' + (g.days ? g.days + '일' : g.months + '개월') + '</td>' +
          '<td>' + when(g.expires_at) + '</td>' +
          '<td>' + esc(g.status) + '</td>' +
          '<td class="muted">' + esc(g.note || '') + '</td></tr>';
      }).join('') + '</table>';
  }
  h += '</div>';

  /* ── 학습 ── */
  const att = Number(s.attempts || 0), cor = Number(s.correct || 0);
  const pct = att > 0 ? Math.round(cor / att * 100) : null;
  h += '<div class="card"><div class="sub">학습</div><dl class="kv">' +
    '<dt>푼 문제</dt><dd>' + (s.answered || 0) + '문항 · 총 ' + att + '회 시도' +
      (pct === null ? '' : ' · 정답률 ' + pct + '%') + '</dd>' +
    '<dt>플래그</dt><dd>' + (s.flagged || 0) + '문항</dd>' +
    '<dt>세션</dt><dd>' + (s.sessions || 0) + '회</dd>' +
    '<dt>모의고사</dt><dd>' + (s.mock_done || 0) + '회 완료' +
      (s.mock_last ? ' · 최근 Part ' + esc(s.mock_last.part) + ' ' +
        esc(s.mock_last.correct) + '/' + esc(s.mock_last.total) +
        ' (' + when(s.mock_last.at) + ')' : '') + '</dd>' +
    '<dt>마지막 학습</dt><dd>' + when(s.last_study, true) + '</dd>' +
  '</dl></div>';

  /* ── 메일 ── */
  h += '<div class="card"><div class="sub">메일</div><dl class="kv">' +
    '<dt>가입 환영</dt><dd>' + flag(a.signup_welcome_sent) + '</dd>' +
    '<dt>유료 환영</dt><dd>' + flag(a.welcome_email_sent) + '</dd>' +
    '<dt>프로모</dt><dd>'    + flag(a.promo_email_sent) + '</dd>' +
    '<dt>War Room</dt><dd>'  + flag(a.warroom_email_sent) + '</dd>' +
  '</dl>' +
  '<div class="banner info" style="margin-top:12px;">' +
    '📮 지금은 <strong>보냈다/안 보냈다</strong>만 남습니다 — 언제 보냈는지는 기록이 없습니다. ' +
    'Pop Quiz 메일은 회원별이 아니라 회차별(<code>daily_quiz.email_sent_at</code>)로 기록됩니다.' +
  '</div></div>';

  $('cust').innerHTML = h;
}

function flag(v){ return v ? '✓ 보냄' : '✗ 안 보냄'; }

// 값을 onclick 문자열에 끼워 넣지 않는다 — 따옴표가 든 값이 오면 코드가 깨진다.
// data 속성에 담고 읽어 쓴다.
function copyBtn(v){
  return '<button class="btn-ghost" style="padding:2px 8px;font-size:11px;" ' +
    'data-copy="' + esc(v) + '" onclick="copyFrom(this)">복사</button>';
}
function copyFrom(el){
  const v = el.getAttribute('data-copy') || '';
  navigator.clipboard.writeText(v).then(function(){
    const old = el.textContent;
    el.textContent = '복사됨';
    setTimeout(function(){ el.textContent = old; }, 1200);
  });
}

/* ── 부여 · 회수 ──────────────────────────────────────────────────── */
async function doGrant(kind, n){
  if(!CUR) return;
  const program = ($('gp') || {}).value;
  const note    = (($('gn') || {}).value || '').trim();
  if(!program){ msg('g2-msg', '프로그램을 고르세요', false); return; }

  const label = (kind === 'days') ? (n + '일') : (n + '개월');
  const ok = confirm(
    '이 계정에 무료 이용을 부여합니다.\n\n' +
    '  대상: ' + (CUR.account.email || '') + '\n' +
    '  프로그램: ' + program + '\n' +
    '  기간: ' + label + '\n' +
    '  메모: ' + (note || '(없음)') + '\n\n' +
    '기간이 끝나면 자동으로 무료 회원으로 돌아갑니다. 진행할까요?');
  if(!ok) return;

  msg('g2-msg', '부여 중…', true);
  const fn   = (kind === 'days') ? 'admin_grant_days' : 'admin_grant_comp';
  const args = (kind === 'days')
    ? { p_user_id: CUR.user_id, p_program: program, p_days:   n, p_note: note || null }
    : { p_user_id: CUR.user_id, p_program: program, p_months: n, p_note: note || null };

  const res = await sb.rpc(fn, args);
  if(res.error){ msg('g2-msg', rpcErr(res.error), false); return; }

  const r = Array.isArray(res.data) ? res.data[0] : res.data;
  msg('g2-msg', '✓ 부여 완료 — ' + label + ' · 종료 ' + when(r && r.expires_at, true), true);
  await openCustomer(CUR.user_id);
}

async function doRevoke(){
  if(!CUR) return;
  const reason = prompt('회수 사유를 적어 주세요 (이력에 남습니다)', '');
  if(reason === null) return;

  const ok = confirm('이 계정의 무료 이용을 지금 즉시 회수합니다.\n\n' +
    '  대상: ' + (CUR.account.email || '') + '\n\n' +
    '바로 무료 회원(하루 5문제)으로 내려갑니다. 진행할까요?');
  if(!ok) return;

  msg('g2-msg', '회수 중…', true);
  const res = await sb.rpc('admin_revoke_comp', {
    p_user_id: CUR.user_id, p_reason: reason || null });
  if(res.error){ msg('g2-msg', rpcErr(res.error), false); return; }

  const r = Array.isArray(res.data) ? res.data[0] : res.data;
  msg('g2-msg', '✓ 회수 완료 (' + ((r && r.revoked) || 0) + '건)', true);
  await openCustomer(CUR.user_id);
}
</script>
