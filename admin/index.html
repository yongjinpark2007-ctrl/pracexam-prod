<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PracExam 관리자 — 고객 관리</title>
<link rel="icon" href="/favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   PracExam 고객 관리 — Harbor 디자인
   app.html 의 팔레트(354649 / 6C7A89 / A3C6C4 / E0E7E9)와
   review_app.html 의 껍데기(네이비 헤더 + 흰 카드 + --fs 글자 배율)를 그대로 따른다.
   두 화면 모두 다크 모드가 없으므로 여기도 밝은 화면 하나로만 만든다.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --page-bg:      #E0E7E9;
  --card-bg:      #ffffff;
  --border-clr:   rgba(53,70,73,.14);
  --border-hover: rgba(53,70,73,.32);
  --sel-bg:       #d9ebe9;
  --sel-border:   #6FA39E;
  --card-shadow:  0 1px 4px rgba(53,70,73,.08);
  --text-main:    #232e30;
  --text-mid:     #4b5759;
  --text-muted:   #6C7A89;
  --navy:         #354649;
  --teal:         #354649;
  --success-color:#16a34a;
  --danger-color: #dc2626;
  --flag-color:   #d97706;
  --gold:         #6FA39E;
  --accent:       #DD8F75;
  --accent-tint:  #FBF1EC;
  --accent-border:#EFD0C1;

  /* 글자 크기 배율 — 헤더의 A− / A+ 로 조절, localStorage 에 저장 (review_app 과 동일) */
  --fs: 0.95;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%;
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--page-bg);color:var(--text-main);font-size:16px;
  -webkit-text-size-adjust:100%;
}
#app{display:flex;flex-direction:column;height:100%;overflow:hidden;}

/* ── 헤더 ───────────────────────────────────────────────────────────────── */
.header{
  background:var(--navy);display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:8px 1rem;min-height:60px;flex-shrink:0;flex-wrap:wrap;
  box-shadow:0 2px 12px rgba(0,0,0,.18);z-index:100;
}
.header-brand{display:flex;align-items:baseline;gap:10px;min-width:0;}
.header-title{font-size:calc(17.5px * var(--fs));font-weight:700;color:#E0E7E9;letter-spacing:-.01em;white-space:nowrap;}
.header-sub{font-size:calc(11.5px * var(--fs));color:rgba(255,255,255,.6);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.hdr-stat{font-size:calc(14px * var(--fs));color:rgba(255,255,255,.72);font-weight:600;white-space:nowrap;}
.hdr-stat b{color:#fff;}
.icon-btn{
  background:none;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.8);
  border-radius:8px;padding:7px 11px;font-family:inherit;font-size:calc(13.5px * var(--fs));
  font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;
}
.icon-btn:hover{background:rgba(255,255,255,.12);color:#fff;}
.fs-seg{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:8px;overflow:hidden;}
.fs-seg button{
  font-family:inherit;font-weight:700;font-size:calc(13px * var(--fs));padding:7px 10px;
  border:none;background:transparent;color:rgba(255,255,255,.72);cursor:pointer;
}
.fs-seg button:hover{background:rgba(255,255,255,.12);color:#fff;}

/* ── 알림 띠 ────────────────────────────────────────────────────────────── */
.notice{padding:11px 1rem;font-size:calc(14.5px * var(--fs));line-height:1.7;flex-shrink:0;}
.notice.warn{background:var(--accent-tint);border-bottom:1px solid var(--accent-border);color:#b85f3f;}
.notice.info{background:#fff;border-bottom:1px solid var(--border-clr);color:var(--text-mid);}

/* ── 위쪽 조작줄 ────────────────────────────────────────────────────────── */
.toolbar{
  background:var(--card-bg);border-bottom:1px solid var(--border-clr);
  padding:11px 1rem;flex-shrink:0;display:flex;flex-direction:column;gap:10px;
}
.tiles{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.tiles-label{font-size:calc(12.5px * var(--fs));font-weight:700;color:var(--text-muted);
  letter-spacing:.02em;margin-right:2px;white-space:nowrap;}
.tile{
  font-family:inherit;text-align:left;cursor:pointer;
  background:#fff;border:1px solid var(--border-clr);border-radius:10px;
  padding:7px 13px;min-width:92px;transition:all .12s;
}
.tile:hover{border-color:var(--border-hover);}
.tile.on{background:var(--sel-bg);border-color:var(--sel-border);box-shadow:inset 2px 0 0 var(--sel-border);}
.tile .n{font-size:calc(19px * var(--fs));font-weight:800;line-height:1.25;color:var(--text-main);}
.tile .l{font-size:calc(12.5px * var(--fs));color:var(--text-muted);font-weight:600;}

/* 알게 된 경로 집계 줄 — 위 타일과 달리 **누르는 것이 아니다**(거르개가 아님).
   그래서 모서리를 둥글게 하고 배경을 죽여 "읽는 것"으로 보이게 구분한다. */
.refstats{display:flex;gap:7px;flex-wrap:wrap;align-items:center;
  font-size:calc(12.5px * var(--fs));color:var(--text-muted);}
.refstats .rlab{font-weight:700;letter-spacing:.02em;white-space:nowrap;}
.rchip{background:var(--sel-bg);border:1px solid var(--border-clr);border-radius:999px;
  padding:3px 11px;white-space:nowrap;font-weight:600;color:var(--text-main);}
.rchip b{font-weight:800;}
.rchip.muted{background:transparent;color:var(--text-muted);}
.rchip.ad{background:transparent;border-style:dashed;}

.fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;}
.field label{font-size:calc(12.5px * var(--fs));font-weight:700;color:var(--text-muted);letter-spacing:.02em;}
input[type=text],input[type=email],input[type=password],select{
  font-family:inherit;font-size:calc(15px * var(--fs));padding:9px 11px;border-radius:8px;
  border:1px solid var(--border-clr);background:#fff;color:var(--text-main);min-width:0;
}
input::placeholder{color:#a8b3b6;}
input:focus,select:focus{outline:none;border-color:var(--sel-border);}
.hint{font-size:calc(13px * var(--fs));color:var(--text-muted);line-height:1.7;}

/* ── 버튼 (review_app 과 같은 문법) ─────────────────────────────────────── */
.btn{
  font-family:inherit;font-size:calc(14.5px * var(--fs));font-weight:700;padding:9px 15px;
  border-radius:9px;border:1px solid var(--border-clr);background:#fff;color:var(--text-mid);
  cursor:pointer;transition:all .15s;
}
.btn:hover{border-color:var(--border-hover);}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.primary:hover{background:#2a383a;}
.btn.danger{color:var(--danger-color);border-color:rgba(220,38,38,.35);}
.btn.small{font-size:calc(13px * var(--fs));padding:6px 11px;border-radius:8px;}
.btn:disabled{opacity:.42;cursor:not-allowed;}
.btn:disabled:hover{border-color:var(--border-clr);}

/* ── 표 ─────────────────────────────────────────────────────────────────── */
.main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card-bg);}
table{width:100%;border-collapse:separate;border-spacing:0;}
thead th{
  position:sticky;top:0;z-index:2;background:var(--card-bg);text-align:left;
  padding:9px 11px;border-bottom:1.5px solid var(--border-clr);white-space:nowrap;
  font-size:calc(12px * var(--fs));font-weight:700;color:var(--text-muted);
  letter-spacing:.06em;text-transform:uppercase;
}
thead th.sortable{cursor:pointer;user-select:none;}
thead th.sortable:hover{color:var(--text-main);}
thead th.sortable:hover .arrow.off{opacity:.85;}
thead th .arrow{color:var(--sel-border);font-size:calc(11px * var(--fs));}
/* 아직 안 고른 제목의 흐린 ↕ — 누를 수 있다는 표시 */
thead th .arrow.off{color:var(--text-muted);opacity:.4;}
tbody td{
  padding:9px 11px;border-bottom:1px solid var(--border-clr);vertical-align:middle;
  font-size:calc(14px * var(--fs));color:var(--text-main);
}
tbody tr.r{cursor:pointer;transition:background .12s;}
tbody tr.r:hover{background:rgba(53,70,73,.04);}
tbody tr.r.open td{background:var(--sel-bg);}
tbody tr.r.open td:first-child{box-shadow:inset 3px 0 0 var(--sel-border);}
td.who{max-width:250px;}
.who .em{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.who .nm{font-size:calc(12.5px * var(--fs));color:var(--text-muted);margin-top:1px;}
.nowrap{white-space:nowrap;}
.num{text-align:right;white-space:nowrap;}
.sub2{font-size:calc(12.5px * var(--fs));color:var(--text-muted);}
.empty{padding:40px 16px;text-align:center;color:var(--text-muted);font-size:calc(16px * var(--fs));}

/* 배지 — app.html 의 q-badge 문법 */
.badge{
  display:inline-flex;align-items:center;border-radius:6px;padding:2px 9px;white-space:nowrap;
  font-size:calc(12.5px * var(--fs));font-weight:700;
  background:rgba(0,0,0,.03);color:var(--text-muted);border:1px solid var(--border-clr);
}
.badge.paying {background:rgba(22,163,74,.10); color:var(--success-color); border-color:rgba(22,163,74,.35);}
.badge.comp   {background:var(--accent-tint);  color:#b85f3f;             border-color:var(--accent-border);}
.badge.trial  {background:var(--sel-bg);       color:var(--teal);         border-color:var(--sel-border);}
.badge.expired{background:rgba(0,0,0,.03);     color:var(--text-muted);}
.badge.flagb  {background:rgba(217,119,6,.10); color:var(--flag-color);   border-color:rgba(217,119,6,.35);}
code{background:rgba(53,70,73,.07);padding:1px 6px;border-radius:5px;font-size:calc(12.5px * var(--fs));}
.dday{font-size:calc(12.5px * var(--fs));color:var(--text-muted);}
.dday.soon{color:var(--flag-color);font-weight:700;}
.dday.over{color:var(--danger-color);font-weight:700;}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--sel-border);cursor:pointer;}
select.rowact{font-size:calc(13px * var(--fs));padding:6px 8px;}

/* ── 펼친 상세 ──────────────────────────────────────────────────────────── */
tr.detail > td{background:var(--page-bg);padding:0;border-bottom:1.5px solid var(--border-hover);}
.detail-in{padding:1.1rem 1.25rem 1.25rem;}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;}
.dcard{background:var(--card-bg);border:1px solid var(--border-clr);border-radius:12px;
  padding:1rem 1.1rem;box-shadow:var(--card-shadow);}
.dcard h3{font-size:calc(15px * var(--fs));color:var(--teal);font-weight:700;margin-bottom:9px;letter-spacing:-.01em;}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:calc(13.5px * var(--fs));}
.kv dt{color:var(--text-muted);font-weight:700;}
.kv dd{color:var(--text-mid);word-break:break-all;}
.tip-box{background:var(--accent-tint);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:11px 14px;margin-top:11px;font-size:calc(13.5px * var(--fs));line-height:1.7;color:var(--text-mid);}
.tip-box b{color:#b85f3f;}
.info-box{background:#fff;border:1px dashed var(--border-hover);border-radius:8px;
  padding:10px 13px;margin-top:11px;font-size:calc(13.5px * var(--fs));line-height:1.7;color:var(--text-mid);}
.actrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px;}
table.mini{margin-top:7px;}
table.mini th{padding:5px 8px;border-bottom:1px solid var(--border-clr);text-align:left;
  font-size:calc(11.5px * var(--fs));font-weight:700;color:var(--text-muted);
  letter-spacing:.05em;text-transform:uppercase;}
table.mini td{padding:5px 8px;border-bottom:1px solid var(--border-clr);font-size:calc(13px * var(--fs));color:var(--text-mid);}
.msg{font-size:calc(13.5px * var(--fs));font-weight:600;min-height:20px;margin-top:7px;color:var(--text-muted);}
.msg.ok{color:var(--success-color);} .msg.err{color:var(--danger-color);}

/* ── 여러 명 한꺼번에 (아래 고정 막대) ──────────────────────────────────── */
.bulk{
  flex-shrink:0;background:var(--card-bg);border-top:1.5px solid var(--sel-border);
  padding:10px 1rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  box-shadow:0 -3px 14px rgba(53,70,73,.10);
}
.bulk .cnt{font-size:calc(15px * var(--fs));font-weight:700;color:var(--teal);}

/* ── 로그인 ─────────────────────────────────────────────────────────────── */
.gate-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem;}
.gate{background:var(--card-bg);border:1px solid var(--border-clr);border-radius:16px;
  padding:1.75rem;box-shadow:0 1px 6px rgba(0,0,0,.08);width:100%;max-width:380px;}
.gate h2{font-size:calc(19px * var(--fs));font-weight:700;color:var(--text-main);margin-bottom:3px;}
.gate .sub{font-size:calc(13px * var(--fs));color:var(--text-muted);margin-bottom:1.1rem;}
.gate .field{margin-bottom:11px;}
.gate input{width:100%;}
.hide{display:none !important;}
</style>
</head>
<body>

<div id="app">

  <!-- ══════════════ 헤더 ══════════════ -->
  <header class="header">
    <div class="header-brand">
      <span class="header-title">PracExam</span>
      <span class="header-sub">고객 관리</span>
    </div>
    <div class="header-right">
      <span class="hdr-stat" id="hdr-count"></span>
      <div class="fs-seg">
        <button onclick="bumpFs(-1)" title="글자 작게">A−</button>
        <button onclick="bumpFs(1)"  title="글자 크게">A+</button>
      </div>
      <button class="icon-btn" onclick="loadAll()">새로고침</button>
      <button class="icon-btn" onclick="exportCsv()">CSV</button>
      <!-- Cloudflare Pages 가 .html 을 떼고 308 로 넘기므로 붙인 주소로 바로 건다 -->
      <a class="icon-btn" href="/admin/search" title="예전 검색 화면 (문제가 있을 때 대비용)">검색 화면</a>
      <a class="icon-btn" href="/app">문항 관리</a>
      <button class="icon-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </header>

  <div id="notice" class="notice hide"></div>

  <!-- ══════════════ 로그인 ══════════════ -->
  <div id="gate" class="gate-wrap hide">
    <div class="gate">
      <h2>고객 관리</h2>
      <div class="sub">내부 전용 화면입니다.</div>
      <div class="field">
        <label for="g-email">이메일</label>
        <input type="email" id="g-email" autocomplete="username">
      </div>
      <div class="field">
        <label for="g-pw">비밀번호</label>
        <input type="password" id="g-pw" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn primary" style="width:100%;margin-top:6px;" onclick="doLogin()">로그인</button>
      <div id="g-msg" class="msg"></div>
    </div>
  </div>

  <!-- ══════════════ 조작줄 ══════════════ -->
  <div id="toolbar" class="toolbar hide">
    <div id="tiles" class="tiles"></div>
    <div id="refstats" class="refstats"></div>
    <div class="fields">
      <div class="field" style="flex:2;min-width:230px;">
        <label for="q">검색 — 이메일 · 이름 (치는 대로 걸러집니다)</label>
        <input type="text" id="q" placeholder="hong@ 또는 홍길동" oninput="render()">
      </div>
      <div class="field" style="flex:1;min-width:170px;">
        <label for="gp">부여 프로그램</label>
        <select id="gp"></select>
      </div>
      <div class="field" style="flex:2;min-width:210px;">
        <label for="gn">메모 — 왜 주는지 (이력에 남습니다)</label>
        <input type="text" id="gn" placeholder="예: 문의 응대, 세미나 감사">
      </div>
    </div>
    <div class="hint">
      표 오른쪽 <b>“부여…”</b> 를 고르면 위에서 정한 프로그램·메모로 들어갑니다.
      줄을 누르면 그 고객의 상세가 펼쳐집니다. <b>제목을 누르면 그 열로 정렬</b>됩니다(다시 누르면 반대 순서).
      <br>🕒 <b>모든 시각은 미국 서부 시간(PT)</b>입니다 — 이 화면을 어디서 열든 같은 숫자가 나옵니다.
    </div>
    <div id="top-msg" class="msg"></div>
  </div>

  <!-- ══════════════ 표 ══════════════ -->
  <div id="main" class="main hide">
    <table>
      <thead>
        <tr>
          <th style="width:34px;"><input type="checkbox" id="chk-all" onclick="toggleAll(this)"></th>
          <th class="sortable" data-sort="email">고객</th>
          <th class="sortable" data-sort="status">상태</th>
          <th>플랜</th>
          <th class="sortable" data-sort="until">이용 만료</th>
          <th class="sortable" data-sort="signed">가입</th>
          <th class="sortable" data-sort="login">마지막 로그인</th>
          <th class="sortable" data-sort="study">마지막 학습</th>
          <th class="sortable num" data-sort="volume">학습량 · Part별 정답률</th>
          <th style="width:130px;">작업</th>
        </tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
  </div>

  <!-- ══════════════ 여러 명 한꺼번에 ══════════════ -->
  <div id="bulk" class="bulk hide">
    <span class="cnt" id="bulk-n"></span>
    <select id="bulk-act"></select>
    <button class="btn primary" onclick="runBulk()">실행</button>
    <button class="btn" onclick="clearSel()">선택 해제</button>
    <span id="bulk-msg" class="hint"></span>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   PracExam 고객 관리 — /admin
   ───────────────────────────────────────────────────────────────────────
   2026-08-08: 검색해야만 사람이 나오던 화면을 **전 고객 표**로 바꿨다.
   예전 검색 화면은 /admin/search.html 에 그대로 남겨 두었다(문제 생길 때 대비).

   목표 = Claude 없이, SQL 없이, 이 화면 하나로 고객 관리를 끝낸다.
     · 전 고객이 표로 한눈에 · 치는 대로 검색 · 눌러서 정렬
     · 줄마다 기간 부여(1주·2주·1개월·3개월·6개월·1년) · 회수 · 체험 연장
     · 줄을 펼치면 결제·학습·메일·증정 이력, 데모 부여, 비밀번호 재설정 메일

   필요한 SQL 2개 (한 번만 실행)
     supabase/sql/admin_console.sql    ← 2026-08-06 실행 완료
     supabase/sql/admin_customers.sql  ← 이번에 새로 실행할 것
   아직 안 했으면 화면이 깨지지 않고 안내만 뜬다.

   ⚠️ 이 파일이 공개되어도 보안에는 영향이 없다. 담긴 것은 anon 키뿐이고
      모든 조회·부여는 서버 RPC 의 is_admin() 이 막는다.

   ?sample=1 을 붙이면 로그인·DB 없이 **가짜 자료로 화면만** 볼 수 있다(초안 검토용).
   ═══════════════════════════════════════════════════════════════════════ */

/* ── 시각 표기 = 미국 서부(PT) 고정 ────────────────────────────────────────
   2026-08-08 사용자 지시. 브라우저가 어느 시간대에 있든 **항상 PT 로 보여 준다.**
   (한국에서 열어도, 미국에서 열어도 같은 숫자가 나와야 고객과 말이 맞는다.)
   여름/겨울(PDT·PST)은 Intl 이 알아서 갈아 준다 — 우리가 계산하지 않는다. */
var TZ = 'America/Los_Angeles';
function _fmt(opts){
  try{ return new Intl.DateTimeFormat('en-US', Object.assign({ timeZone:TZ }, opts)); }
  catch(e){ return null; }
}
var F_DATE  = _fmt({ year:'2-digit', month:'2-digit', day:'2-digit' });          // 08/08/26
var F_TIME  = _fmt({ hour:'numeric', minute:'2-digit', hour12:true });           // 3:04 PM
// 🔴 dateStyle/timeStyle 과 timeZoneName 은 같이 못 쓴다(TypeError) — 항목을 하나씩 적는다.
//    처음에 같이 썼다가 상세 화면에 날것의 ISO 문자열이 나올 뻔했다.
var F_FULL  = _fmt({ year:'numeric', month:'short', day:'numeric',
                     hour:'numeric', minute:'2-digit', hour12:true, timeZoneName:'short' });
var F_DAY   = _fmt({ year:'numeric', month:'short', day:'numeric' });

function d(iso, withTime){                 // 상세 화면에서 쓰는 긴 표기
  if(!iso) return '—';
  var t = new Date(iso);
  if(isNaN(t)) return String(iso);
  var f = withTime ? F_FULL : F_DAY;
  try{ return f ? f.format(t) : t.toISOString(); }catch(e){ return String(iso); }
}
function short(iso){                       // 표 안에서 쓰는 짧은 날짜 (PT)
  if(!iso) return '—';
  var t = new Date(iso);
  if(isNaN(t) || !F_DATE) return '—';
  return F_DATE.format(t);
}
function clock(iso){                       // 표 안에서 쓰는 시각 (PT)
  if(!iso) return '';
  var t = new Date(iso);
  if(isNaN(t) || !F_TIME) return '';
  return F_TIME.format(t);
}
function dcsv(iso){                        // CSV 용 — 비었으면 '—' 대신 빈칸
  return iso ? d(iso, true) : '';
}
function days(iso){                        // 오늘로부터 며칠 (음수 = 지남)
  if(!iso) return null;
  var t = new Date(iso).getTime();
  if(isNaN(t)) return null;
  return Math.ceil((t - Date.now()) / 86400000);
}
function ddayTag(iso){
  var n = days(iso);
  if(n === null) return '';
  if(n < 0)  return '<span class="dday over">' + (-n) + '일 지남</span>';
  if(n <= 7) return '<span class="dday soon">D-' + n + '</span>';
  return '<span class="dday">D-' + n + '</span>';
}
function ts(iso){ var t = iso ? new Date(iso).getTime() : 0; return isNaN(t) ? 0 : t; }
function msg(id, text, ok){
  var el = $(id); if(!el) return;
  el.textContent = text || '';
  el.className = 'msg' + (text ? (ok ? ' ok' : ' err') : '');
}
function rpcErr(e){
  var m = String((e && (e.message || e.msg || e)) || '');
  if(/PGRST202|Could not find the function|does not exist/i.test(m))
    return '아직 SQL이 실행되지 않았습니다 — supabase/sql/admin_customers.sql';
  if(/NOT_AUTHORIZED/.test(m))  return '권한 없음 (관리자 전용)';

  return m || '알 수 없는 오류';
}

/* ── 상태 판정 ────────────────────────────────────────────────────── */
function isComp(r){ return String(r.plan_code || '').slice(0,5) === 'comp_'; }
function statusOf(r){
  if(r.is_paid && !isComp(r)) return 'paying';   // 돈 내는 고객
  if(r.is_paid)               return 'comp';     // 증정·데모·체험 부여
  var te = ts(r.trial_ends_at);
  if(te && te > Date.now())   return 'trial';    // 가입 30일 무료 체험 중
  return 'expired';                              // 체험 끝 — 새 학습 잠김
}
var STATUS_LABEL = { paying:'결제', comp:'증정', trial:'체험중', expired:'체험만료' };
var STATUS_RANK  = { paying:0, comp:1, trial:2, expired:3 };   // 상태로 정렬할 때의 차례
function untilOf(r){ return r.is_paid ? r.paid_until : r.trial_ends_at; }

/* ── Part별 학습 ──────────────────────────────────────────────────────────
   서버가 [{part,answered,attempts,correct}, …] 로 준다. part 0 = 문항이 지워져
   Part 를 알 수 없는 기록 — 합계가 어긋나 보이지 않게 '기타'로 따로 보여 준다. */
function pctOf(correct, attempts){
  return attempts > 0 ? Math.round(correct / attempts * 100) : null;
}
function partList(r){
  var a = r.parts;
  if(typeof a === 'string'){ try{ a = JSON.parse(a); }catch(e){ a = []; } }
  return Array.isArray(a) ? a.filter(function(x){ return x && x.answered > 0; }) : [];
}
function partLabel(n){ return (Number(n) === 0) ? '기타' : ('P' + n); }
// 표 안에 한 줄로: "P1 72% · P2 65%"
function partSummary(r){
  var list = partList(r);
  if(!list.length) return '';
  return list.map(function(x){
    var p = pctOf(x.correct, x.attempts);
    return partLabel(x.part) + ' ' + (p === null ? '—' : p + '%');
  }).join(' · ');
}
function mockList(r){
  var a = r.mock_parts;
  if(typeof a === 'string'){ try{ a = JSON.parse(a); }catch(e){ a = []; } }
  return Array.isArray(a) ? a : [];
}

function matches(r, q){
  if(!q) return true;
  var hay = (String(r.email||'') + ' ' + String(r.first_name||'') + ' ' +
             String(r.last_name||'') + ' ' + String(r.plan_code||'') + ' ' +
             String(r.comp_program||'')).toLowerCase();
  return hay.indexOf(q) >= 0;
}
/* ── 확인 메일이 실제로 나갔는지 ────────────────────────────────────────
   admin_list_customers 가 두 열을 돌려주기 전(구버전 SQL)에는 값이 아예 없다.
   그때 r.confirm_reminder_sent 는 undefined 라서 "안 보냄"으로 잘못 읽히므로,
   열이 있는지부터 보고 없으면 아무 판단도 하지 않는다. */
function hasMailCols(){
  return ROWS.length > 0 && ('confirmation_sent_at' in ROWS[0]);
}
// 가입 24시간이 지났는데 독촉 메일이 아직 안 나간 사람 = 자동발송이 멈췄다는 신호
function remindOverdue(r){
  if(!hasMailCols()) return false;
  if(r.confirmed_at || r.confirm_reminder_sent) return false;
  var t = ts(r.signed_up_at);
  return t > 0 && (Date.now() - t) >= 24 * 3600 * 1000;
}

function inBucket(r, b){
  if(b === 'all')      return true;
  if(b === 'unconf')   return !r.confirmed_at;
  if(b === 'noremind') return remindOverdue(r);
  if(b === 'soon'){
    var n = days(untilOf(r));
    return n !== null && n >= 0 && n <= 7;
  }
  return statusOf(r) === b;
}

/* ── 그리기 ───────────────────────────────────────────────────────── */
function visibleRows(){
  var q = ($('q').value || '').trim().toLowerCase();
  var out = ROWS.filter(function(r){ return matches(r, q) && inBucket(r, BUCKET); });
  var k = SORT.key, dir = SORT.dir;
  out.sort(function(a,b){
    var x, y;
    if(k === 'email'){
      x = String(a.email||'').toLowerCase(); y = String(b.email||'').toLowerCase();
      return x < y ? -dir : (x > y ? dir : 0);
    }
    if(k === 'status'){
      // 결제 → 증정 → 체험중 → 체험만료 차례. 같은 상태면 만료가 임박한 순서로.
      x = STATUS_RANK[statusOf(a)]; y = STATUS_RANK[statusOf(b)];
      if(x !== y) return (x - y) * -dir;
      return (ts(untilOf(a)) - ts(untilOf(b))) * dir;
    }
    if(k === 'until')       { x = ts(untilOf(a));        y = ts(untilOf(b)); }
    else if(k === 'login')  { x = ts(a.last_sign_in_at); y = ts(b.last_sign_in_at); }
    else if(k === 'study')  { x = ts(a.last_study);      y = ts(b.last_study); }
    else if(k === 'volume') { x = Number(a.answered||0); y = Number(b.answered||0); }
    else                    { x = ts(a.signed_up_at);    y = ts(b.signed_up_at); }
    return (x - y) * dir;
  });
  return out;
}

function renderTiles(){
  var c = { all:ROWS.length, paying:0, comp:0, trial:0, expired:0, unconf:0, noremind:0, soon:0 };
  ROWS.forEach(function(r){
    c[statusOf(r)]++;
    if(!r.confirmed_at) c.unconf++;
    if(remindOverdue(r)) c.noremind++;
    var n = days(untilOf(r));
    if(n !== null && n >= 0 && n <= 7) c.soon++;
  });
  var defs = [
    ['all','전체'], ['paying','결제 중'], ['comp','증정 중'], ['trial','체험 중'],
    ['expired','체험 만료'], ['unconf','메일 미확인'], ['soon','7일 내 만료']
  ];
  // 독촉 미발송은 평소엔 0이라 자리만 차지한다 — 실제로 밀린 사람이 있을 때만 띄운다.
  if(c.noremind > 0) defs.splice(6, 0, ['noremind','독촉 미발송']);
  $('tiles').innerHTML = '<span class="tiles-label">눌러서 거르기 →</span>' + defs.map(function(t){
    return '<button class="tile' + (BUCKET === t[0] ? ' on' : '') + '" data-bucket="' + t[0] + '">' +
      '<div class="n">' + c[t[0]] + '</div><div class="l">' + t[1] + '</div></button>';
  }).join('');
}

// 아직 안 고른 제목에도 흐린 ↕ 를 붙인다 — 안 그러면 누를 수 있는 줄 모른다(사용자 지적).
function sortArrow(k){
  if(SORT.key !== k) return ' <span class="arrow off">↕</span>';
  return ' <span class="arrow">' + (SORT.dir < 0 ? '▼' : '▲') + '</span>';
}
function paintHeaders(){
  var ths = document.querySelectorAll('thead th.sortable');
  for(var i = 0; i < ths.length; i++){
    var k = ths[i].getAttribute('data-sort');
    var base = ths[i].getAttribute('data-label');
    if(!base){ base = ths[i].textContent.replace(/[▼▲]\s*$/,'').trim(); ths[i].setAttribute('data-label', base); }
    ths[i].innerHTML = esc(base) + sortArrow(k);
  }
}

function render(){
  renderTiles();
  renderRefStats();
  paintHeaders();
  var rows = visibleRows();

  var html = rows.map(function(r){
    // 메뉴는 줄마다 다르다 — 메일을 확인한 고객에게는 「메일 확인 처리」가 없다.
    var actOpts = '<option value="">부여…</option>' + actionsFor(r).map(function(a){
      return '<option value="' + a.v + '">' + a.label + '</option>';
    }).join('');
    var st   = statusOf(r);
    var name = [r.first_name, r.last_name].filter(Boolean).join(' ');
    var un   = untilOf(r);
    var pct  = r.attempts > 0 ? Math.round(r.correct / r.attempts * 100) : null;

    var line =
      '<tr class="r' + (OPEN === r.user_id ? ' open' : '') + '" data-uid="' + esc(r.user_id) + '">' +
        '<td><input type="checkbox" class="cb" data-uid="' + esc(r.user_id) + '"' +
            (SEL[r.user_id] ? ' checked' : '') + '></td>' +
        '<td class="who"><div class="em">' + esc(r.email) + '</div>' +
          '<div class="nm">' + esc(name || '이름 없음') + ' · ' + esc(r.language || '?') +
          (r.confirmed_at ? '' : ' · <b style="color:var(--flag-color);">메일 미확인</b>') +
          (remindOverdue(r) ? ' <b style="color:var(--flag-color);">· 독촉 미발송</b>' : '') +
          '</div></td>' +
        '<td class="nowrap"><span class="badge ' + st + '">' + STATUS_LABEL[st] + '</span>' +
          (r.sub_canceled ? ' <span class="badge flagb">해지예약</span>' : '') + '</td>' +
        '<td class="nowrap">' + (r.plan_code ? '<code>' + esc(r.plan_code) + '</code>' : '—') +
          (r.comp_program ? '<div class="sub2">' + esc(r.comp_program) + '</div>' : '') + '</td>' +
        '<td class="nowrap">' + short(un) + ' ' + ddayTag(un) + '</td>' +
        '<td class="nowrap">' + short(r.signed_up_at) +
          '<div class="sub2">' + clock(r.signed_up_at) + '</div></td>' +
        '<td class="nowrap">' + short(r.last_sign_in_at) +
          '<div class="sub2">' + clock(r.last_sign_in_at) + '</div></td>' +
        '<td class="nowrap">' + short(r.last_study) +
          '<div class="sub2">' + clock(r.last_study) + '</div></td>' +
        '<td class="num">' + (r.answered || 0) + '문항' +
          (pct === null ? '' : ' · ' + pct + '%') +
          (partSummary(r) ? '<div class="sub2">' + partSummary(r) + '</div>' : '') + '</td>' +
        '<td><select class="rowact" data-uid="' + esc(r.user_id) + '">' + actOpts + '</select></td>' +
      '</tr>';

    if(OPEN === r.user_id){
      line += '<tr class="detail"><td colspan="10"><div class="detail-in" id="det-' +
              esc(r.user_id) + '">불러오는 중…</div></td></tr>';
    }
    return line;
  }).join('');

  $('tb').innerHTML = html || '<tr><td colspan="10" class="empty">해당하는 고객이 없습니다.</td></tr>';

  if(OPEN) renderDetail(OPEN);
  renderBulk();
}

/* ── 펼친 상세 ────────────────────────────────────────────────────── */
function renderDetail(uid){
  var box = $('det-' + uid);
  if(!box) return;
  var r = rowOf(uid);
  if(!r) return;

  var st     = statusOf(r);
  var paying = (st === 'paying');
  var name   = [r.first_name, r.last_name].filter(Boolean).join(' ');
  var pct    = r.attempts > 0 ? Math.round(r.correct / r.attempts * 100) : null;

  var h = '<div class="dgrid">';

  /* 계정 · 로그인 */
  h += '<div class="dcard"><h3>계정 · 로그인</h3><dl class="kv">' +
    '<dt>이름</dt><dd>' + esc(name || '이름 없음') + '</dd>' +
    '<dt>이메일</dt><dd>' + esc(r.email) + ' ' + copyBtn(r.email) + '</dd>' +
    '<dt>언어</dt><dd>' + esc(r.language || '?') + '</dd>' +
    '<dt>가입</dt><dd>' + d(r.signed_up_at, true) + '</dd>' +
    refRow(r) +
    '<dt>메일 확인</dt><dd>' + (r.confirmed_at
        ? '✓ ' + d(r.confirmed_at)
        : '<b style="color:var(--flag-color);">✗ 미확인</b>') + '</dd>' +
    mailRows(r) +
    '<dt>마지막 로그인</dt><dd>' + d(r.last_sign_in_at, true) + '</dd>' +
    '<dt>마케팅 수신</dt><dd>' + (r.marketing_consent ? '✓ 동의' : '✗ 미동의') + '</dd>' +
    popquizRow(r) +
  '</dl>' +
  '<div class="actrow">' +
    '<button class="btn small" data-act="pwreset" data-uid="' + esc(uid) + '">비밀번호 재설정 메일</button>' +
    (r.confirmed_at ? '' :
      '<button class="btn small" data-act="confirm" data-uid="' + esc(uid) + '">메일 확인 처리</button>') +
  '</div>' +
  '<div class="info-box">“마지막 로그인”은 비밀번호로 새로 들어온 시각입니다. ' +
    '로그인 상태가 유지되면 안 바뀌니 실제 활동은 <b>마지막 학습</b>으로 보세요.</div>' +
  (r.confirmed_at ? '' :
    '<div class="info-box">📧 위 두 줄은 <b>우리가 보냈는지</b>만 알려 줍니다 — ' +
    '고객 받은편지함에 도착했는지는 알 수 없습니다. ' +
    '“확인 메일”은 나갔는데 고객이 못 봤다면 대개 스팸함에 있습니다.</div>') +
  '<div class="info-box">📮 “팝퀴즈 메일”은 <b>마케팅 수신 동의</b>와 <b>이메일 확인</b>을 ' +
    '둘 다 마친 분에게만 나갑니다. 다만 메일 안의 수신거부 링크로 빠진 분은 ' +
    'Brevo 에만 기록이 남아, 여기서는 그대로 “대상”으로 보입니다.</div>' +
  '</div>';

  /* 결제 */
  h += '<div class="dcard"><h3>결제</h3><dl class="kv">' +
    '<dt>상태</dt><dd>' + STATUS_LABEL[st] + (r.sub_canceled ? ' · 해지 예약됨' : '') + '</dd>' +
    '<dt>플랜</dt><dd>' + (r.plan_code ? '<code>' + esc(r.plan_code) + '</code>' : '—') + '</dd>' +
    '<dt>이용 만료</dt><dd>' + d(r.paid_until, true) + '</dd>' +
    '<dt>체험 종료</dt><dd>' + d(r.trial_ends_at, true) + '</dd>' +
    '<dt>Paddle 고객</dt><dd>' + (r.customer_ref
      ? '<code>' + esc(r.customer_ref) + '</code> ' + copyBtn(r.customer_ref) : '—') + '</dd>' +
    '<dt>Paddle 구독</dt><dd>' + (r.subscription_ref
      ? '<code>' + esc(r.subscription_ref) + '</code> ' + copyBtn(r.subscription_ref) : '—') + '</dd>' +
  '</dl>';
  if(r.customer_ref || r.subscription_ref){
    h += '<div class="info-box">💳 환불·해지는 <a href="https://vendors.paddle.com/" target="_blank" ' +
      'rel="noopener" style="color:var(--teal);">Paddle</a> 에서 합니다. 위 ID를 복사해 검색하세요. ' +
      '환불하면 웹훅이 접근권을 자동으로 내립니다.</div>';
  }
  h += '</div>';

  /* 학습 · 증정 */
  var plist = partList(r), mlist = mockList(r);
  h += '<div class="dcard"><h3>학습</h3><dl class="kv">' +
    '<dt>푼 문제</dt><dd>' + (r.answered || 0) + '문항 · 총 ' + (r.attempts || 0) + '회 시도' +
      (pct === null ? '' : ' · 정답률 ' + pct + '%') + '</dd>' +
    '<dt>마지막 학습</dt><dd>' + d(r.last_study, true) + '</dd>' +
  '</dl>';

  // Part별 학습 — 어느 Part 가 약한지 한눈에
  if(plist.length){
    h += '<table class="mini"><tr><th>Part</th><th>푼 문항</th><th>시도</th><th>정답률</th></tr>' +
      plist.map(function(x){
        var p = pctOf(x.correct, x.attempts);
        return '<tr><td><b>' + partLabel(x.part) + '</b></td>' +
          '<td>' + x.answered + '</td><td>' + x.attempts + '</td>' +
          '<td>' + (p === null ? '—' : p + '%') + '</td></tr>';
      }).join('') + '</table>' +
      (plist.some(function(x){ return Number(x.part) === 0; })
        ? '<div class="sub2" style="margin-top:5px;">“기타” = 문항이 지워져 Part 를 알 수 없는 기록입니다.</div>'
        : '');
  } else {
    h += '<div class="sub2">아직 푼 문항이 없습니다.</div>';
  }

  // Part별 모의고사 — 점수는 가장 최근 회차
  h += '<h3 style="margin-top:14px;">모의고사</h3>';
  if(mlist.length){
    h += '<table class="mini"><tr><th>Part</th><th>완료</th><th>최근 점수</th><th>최근 응시</th></tr>' +
      mlist.map(function(x){
        var p = (x.total > 0) ? Math.round(x.correct / x.total * 100) : null;
        return '<tr><td><b>P' + x.part + '</b></td><td>' + x.done + '회</td>' +
          '<td>' + (x.correct == null ? '—' : x.correct + '/' + x.total +
            (p === null ? '' : ' (' + p + '%)')) + '</td>' +
          '<td>' + d(x.at) + '</td></tr>';
      }).join('') + '</table>';
  } else {
    h += '<div class="sub2">완료한 모의고사가 없습니다.</div>';
  }
  h += '<h3 style="margin-top:14px;">지금 살아 있는 증정</h3>' +
  (r.grant_program
    ? '<div class="tip-box">🎁 <b>' + esc(r.grant_program) + '</b> · 종료 ' + d(r.grant_expires_at, true) +
      (r.grant_note ? '<br>메모: ' + esc(r.grant_note) : '') + '</div>'
    : '<div class="sub2">없음</div>') +
  '</div>';

  h += '</div>'; /* dgrid 끝 */

  /* 부여 · 회수 */
  h += '<div class="dcard" style="margin-top:12px;"><h3>기간 부여 · 회수</h3>';
  if(paying){
    h += '<div class="tip-box" style="margin-top:0;">⚠️ <b>결제 중인 고객입니다 — 증정을 줄 수 없습니다.</b><br>' +
      '증정을 주면 플랜이 <code>comp_*</code>로 덮이고, 증정이 끝나는 순간 만료 처리가 이 고객을 잠급니다. ' +
      '기간만 더 주고 싶으면 아래 <b>무료 체험 연장</b>을 쓰세요 — 결제를 전혀 건드리지 않습니다.</div>';
  }
  h += '<div class="actrow">';
  ACTIONS.forEach(function(a){
    var off = (paying && a.kind !== 'trial') || (a.kind === 'revoke' && !r.grant_program);
    h += '<button class="btn small' + (a.kind === 'revoke' ? ' danger' : '') + '"' +
         ' data-act="one" data-v="' + a.v + '" data-uid="' + esc(uid) + '"' +
         (off ? ' disabled' : '') + '>' + a.label + '</button>';
  });
  h += '<button class="btn small" data-act="demo" data-uid="' + esc(uid) + '"' +
       (paying ? ' disabled' : '') + '>공용 데모 7일</button>';
  h += '</div>' +
  '<div class="info-box">🔴 <b>공용 데모</b>는 회사 시연용 계정 전용입니다 — 이 프로그램으로 준 계정은 ' +
    '데모가 끝나고 30일 뒤 <b>비밀번호가 자동으로 바뀝니다</b>. 진짜 고객에게는 쓰지 마세요.</div>' +
  '<div class="msg" id="dmsg-' + esc(uid) + '"></div></div>';

  /* 이력 */
  h += '<div class="dcard" style="margin-top:12px;" id="hist-' + esc(uid) + '">' +
       '<h3>이력</h3><div class="sub2">불러오는 중…</div></div>';

  box.innerHTML = h;
  loadHistory(uid);
}

/* 증정·결제·메일 이력은 기존 admin_get_customer 를 그대로 쓴다 */
async function loadHistory(uid){
  var box = $('hist-' + uid);
  if(!box) return;
  if(SAMPLE){ box.innerHTML = '<h3>이력</h3><div class="sub2">(표본 보기 — 이력 없음)</div>'; return; }

  var r = await sb.rpc('admin_get_customer', { p_user_id: uid });
  if(r.error){
    box.innerHTML = '<h3>이력</h3><div class="sub2">이력을 못 읽었습니다: ' + esc(rpcErr(r.error)) + '</div>';
    return;
  }
  var row = Array.isArray(r.data) ? r.data[0] : r.data;
  if(!row){ box.innerHTML = ''; return; }
  var g = row.grants || [], b = row.billing || [], a = row.account || {};
  var h = '<h3>이력</h3>';

  if(g.length){
    h += '<div class="sub2" style="margin-top:8px;font-weight:700;">증정</div><table class="mini">' +
      '<tr><th>프로그램</th><th>기간</th><th>종료</th><th>상태</th><th>메모</th></tr>' +
      g.map(function(x){
        return '<tr><td>' + esc(x.program) + '</td><td>' +
          (x.days ? x.days + '일' : x.months + '개월') + '</td><td>' + d(x.expires_at) +
          '</td><td>' + esc(x.status) + '</td><td>' + esc(x.note || '') + '</td></tr>';
      }).join('') + '</table>';
  }
  if(b.length){
    h += '<div class="sub2" style="margin-top:12px;font-weight:700;">결제 이벤트</div><table class="mini">' +
      '<tr><th>언제</th><th>종류</th></tr>' +
      b.map(function(x){
        return '<tr><td>' + d(x.at, true) + '</td><td><code>' + esc(x.type) + '</code></td></tr>';
      }).join('') + '</table>';
  }
  h += '<div class="sub2" style="margin-top:12px;font-weight:700;">보낸 메일</div>' +
    '<div class="sub2" style="margin-top:3px;">' +
      '가입 환영 ' + flag(a.signup_welcome_sent) + ' · 유료 환영 ' + flag(a.welcome_email_sent) +
      ' · 프로모 ' + flag(a.promo_email_sent) + ' · War Room ' + flag(a.warroom_email_sent) +
      ' · 확인 독촉 ' + flag(a.confirm_reminder_sent) +
      '<br>보냈다/안 보냈다만 남습니다 — 언제 보냈는지는 아직 기록이 없습니다.</div>';
  box.innerHTML = h;
}
function flag(v){ return v ? '✓' : '✗'; }

/* 상세 "계정 · 로그인" 칸에 들어가는 메일 두 줄.
   · 확인 메일 = 가입 직후 자동으로 나가는 메일 (auth.users.confirmation_sent_at)
   · 확인 독촉 = 가입 24시간 뒤 1회 나가는 스팸함 안내 (profiles.confirm_reminder_sent)
   미확인 고객이 문의해 왔을 때 "우리가 보내긴 했나"를 여기서 바로 본다.
   독촉 줄은 아직 확인 안 한 사람에게만 보인다 — 확인한 사람에겐 의미가 없다. */
function mailRows(r){
  if(!hasMailCols()){
    return '<dt>확인 메일</dt><dd class="sub2">' +
           '<code>admin_list_customers</code> 를 새로 배포하면 발송 시각이 여기 나옵니다.</dd>';
  }
  var h = '<dt>확인 메일</dt><dd>' + (r.confirmation_sent_at
    ? '✓ ' + d(r.confirmation_sent_at, true)
    : '<b style="color:var(--flag-color);">✗ 발송 기록 없음</b>') + '</dd>';
  if(!r.confirmed_at){
    var rem;
    if(r.confirm_reminder_sent)   rem = '✓ 보냄';
    else if(remindOverdue(r))     rem = '<b style="color:var(--flag-color);">✗ 미발송 — 가입 24시간이 지났습니다</b>';
    else                          rem = '아직 (가입 24시간 뒤 나갑니다)';
    h += '<dt>확인 독촉</dt><dd>' + rem + '</dd>';
  }
  return h;
}

/* ── 팝퀴즈 메일이 나가는 대상인지 ──────────────────────────────────────
   실제 발송 함수 get_daily_quiz_recipients() 의 조건을 그대로 옮긴 것이다.
   셋을 다 만족해야 발송된다:
     ⓐ profiles.marketing_consent = true   (설정에서 켠 마케팅 수신 동의)
     ⓑ auth.users.email_confirmed_at 존재  (확인 메일을 실제로 누른 사람)
     ⓒ 이메일 주소 존재
   ⓑ 를 빼면 안 된다 — 미확인 주소로 계속 보내면 반송률이 올라가고, 그게 곧
   도메인 평판 하락 → 전원 스팸함 직행으로 이어진다.

   🔴 조건을 화면에서 다시 계산하는 것이므로 SQL 을 고치면 여기도 같이 고칠 것.
      2026-08-11 라이브 대조 = 이 계산 72명 : RPC 실제 반환 72명, 어긋남 0건.
   ⚠️ 메일 안의 수신거부 링크로 빠진 사람은 Brevo 에만 기록이 남아 우리 DB 는
      모른다. 그래서 여기서 "대상"이어도 실제 발송 때는 빠질 수 있다.
   🔴 사유는 걸리는 것을 **전부** 모은다. 먼저 걸린 하나만 보이면, 두 가지가 함께
      막고 있는 사람(라이브 4명)에게 그 하나만 풀어 주고 "이제 나가겠지" 하게 된다. */
function popquizTarget(r){
  var why = [];
  if(!r.confirmed_at)               why.push('이메일 미확인');
  if(!r.marketing_consent)          why.push('마케팅 수신 미동의');
  if(!String(r.email || '').trim()) why.push('이메일 주소 없음');
  return { ok: why.length === 0, why: why.join(' · ') };
}
function popquizRow(r){
  var pq = popquizTarget(r);
  return '<dt>팝퀴즈 메일</dt><dd>' + (pq.ok
    ? '✓ 대상 <span class="sub2">— 새 팝퀴즈를 보내면 이분에게도 갑니다</span>'
    : '<b style="color:var(--flag-color);">✗ 비대상</b> ' +
      '<span class="sub2">— ' + pq.why + '</span>') + '</dd>';
}

/* ── 알게 된 경로 ────────────────────────────────────────────────────────
   가입 폼 맨 아래 "PracExam을 어디서 알고 오셨나요?" 에서 고른 값(2026-08-08 부터 쌓임).
   ※ 2026-08-12 이전 가입자는 "어디서 알고 오셨어요?" 로 물었다 — EA 시험을 어떻게
     알았는지로 읽혀 친구·강의 쪽 답이 부풀어 있다. 그 앞뒤를 섞어 보지 말 것.
   고르지 않아도 가입되므로 **비어 있는 것이 정상**이다. 그보다 앞서 가입한
   분들은 물어본 적이 없어 영영 비어 있다 — "안 골랐다"와 구별되지 않는다.
   그래서 화면에서는 둘을 합쳐 «기록 없음» 한 덩어리로만 말한다.

   🔴 본인 응답과 광고 클릭 기록(gclid)은 **다른 것**이라 따로 센다. 실측 사례:
      "강의"라고 답한 분에게 구글 광고 클릭 기록이 함께 남아 있었다. 본인 응답만
      세면 광고 성과가 실제보다 낮게 보인다. */
var REF_LABEL = {
  google:'Google', facebook:'Facebook', instagram:'Instagram',
  naver:'네이버', friend:'친구', class:'강의', other:'기타'
};
function hasRefCols(){
  return ROWS.length > 0 && ('referral_source' in ROWS[0]);
}
function refLabel(v){
  if(!v) return '';
  return REF_LABEL[v] || v;          // 모르는 값이면 원문 그대로 (선택지가 늘어도 안 사라진다)
}
function refRow(r){
  if(!hasRefCols()){
    return '<dt>알게 된 경로</dt><dd class="sub2">' +
           '<code>admin_list_customers</code> 를 새로 배포하면 여기 나옵니다.</dd>';
  }
  var parts = [];
  if(r.referral_source){
    var lab = esc(refLabel(r.referral_source));
    if(r.referral_source === 'other' && r.referral_note) lab += ' — “' + esc(r.referral_note) + '”';
    parts.push(lab);
  }
  if(r.ad_click)         parts.push('광고 클릭으로 들어옴');
  else if(r.utm_source)  parts.push('링크 표시 <code>' + esc(r.utm_source) + '</code>');
  if(!parts.length){
    return '<dt>알게 된 경로</dt><dd class="sub2">기록 없음 ' +
           '<span class="sub2">(안 고르셨거나, 묻기 전에 가입한 분입니다)</span></dd>';
  }
  return '<dt>알게 된 경로</dt><dd>' + parts.join(' · ') + '</dd>';
}

/* 조작줄 아래 한 줄 — 고른 사람만 모수로 잡아 경로별 인원을 센다.
   🔴 비율의 분모는 «응답한 사람»이다. 전체 가입자로 나누면 묻기 전에 가입한
      분들까지 분모에 들어가 모든 경로가 실제보다 작아 보인다. */
function renderRefStats(){
  var box = $('refstats');
  if(!box) return;
  if(!hasRefCols()){ box.innerHTML = ''; return; }

  var c = {}, answered = 0, ad = 0;
  ROWS.forEach(function(r){
    if(r.referral_source){ c[r.referral_source] = (c[r.referral_source] || 0) + 1; answered++; }
    if(r.ad_click) ad++;
  });

  if(answered === 0){
    box.innerHTML = '<span class="rlab">알게 된 경로</span>' +
      '<span class="rchip muted">아직 응답한 가입자가 없습니다</span>';
    return;
  }

  var keys = Object.keys(c).sort(function(a, b){
    if(c[b] !== c[a]) return c[b] - c[a];
    return a < b ? -1 : 1;                       // 같은 수면 이름순 — 새로고침해도 자리가 안 바뀐다
  });
  var h = '<span class="rlab">알게 된 경로</span>' +
    keys.map(function(k){
      return '<span class="rchip">' + esc(refLabel(k)) + ' <b>' + c[k] + '</b>' +
             '<span class="sub2"> · ' + Math.round(c[k] / answered * 100) + '%</span></span>';
    }).join('') +
    '<span class="rchip muted">응답 <b>' + answered + '</b>명 / 전체 ' + ROWS.length + '명</span>';
  // 🔴 "이 중"이라고 쓰지 않는다 — 이건 응답자의 부분집합이 아니라 따로 센 값이다.
  //    (본인은 "강의"라고 답했는데 광고 클릭 기록이 남은 분이 실제로 있다.)
  if(ad > 0){
    h += '<span class="rchip ad">광고 클릭 기록 <b>' + ad + '</b>명 <span class="sub2">· 응답과 별개</span></span>';
  }
  box.innerHTML = h;
}

function copyBtn(v){
  return '<button class="btn small" style="padding:2px 8px;font-weight:600;" ' +
    'data-copy="' + esc(v) + '">복사</button>';
}

/* ── 눌렀을 때 ────────────────────────────────────────────────────────────
   🔴 줄 전체가 눌리는 화면이라, 줄 안에 있는 조작 요소(부여 상자·체크박스·버튼)를
      누른 것까지 "줄을 눌렀다"로 치면 표를 다시 그려서 **열려던 메뉴가 사라진다.**
      그래서 조작 요소를 눌렀으면 줄 펼치기로 넘어가지 않고 여기서 끝낸다. */
document.addEventListener('click', function(ev){
  var t = ev.target;
  if(!t || !t.closest) return;

  // 복사 단추
  var copy = t.closest('[data-copy]');
  if(copy){
    navigator.clipboard.writeText(copy.getAttribute('data-copy') || '');
    var old = copy.textContent; copy.textContent = '복사됨';
    setTimeout(function(){ copy.textContent = old; }, 1200);
    return;
  }

  // 요약 타일 = 거르개
  var tile = t.closest('[data-bucket]');
  if(tile){ BUCKET = tile.getAttribute('data-bucket'); render(); return; }

  // 제목 눌러 정렬
  var th = t.closest('th.sortable');
  if(th){
    var k = th.getAttribute('data-sort');
    if(SORT.key === k) SORT.dir = -SORT.dir; else { SORT.key = k; SORT.dir = -1; }
    render(); return;
  }

  // 체크박스
  if(t.classList && t.classList.contains('cb')){
    var u = t.getAttribute('data-uid');
    if(t.checked) SEL[u] = true; else delete SEL[u];
    renderBulk(); return;
  }

  // 상세 안의 작업 단추
  var btn = t.closest('[data-act]');
  if(btn){
    var uid = btn.getAttribute('data-uid');
    var act = btn.getAttribute('data-act');
    if(act === 'one')          applyOne(uid, btn.getAttribute('data-v'));
    else if(act === 'demo')    grantDemo(uid);
    else if(act === 'pwreset') sendReset(uid);
    else if(act === 'confirm') confirmEmail(uid);
    return;
  }

  // ⬇︎ 여기가 핵심 — 조작 요소를 눌렀으면 줄을 펼치지 않는다(표를 다시 안 그린다)
  if(t.closest('select, input, button, a, label, .detail')) return;

  var tr = t.closest('tr.r');
  if(tr){
    var id = tr.getAttribute('data-uid');
    OPEN = (OPEN === id) ? null : id;
    render();
  }
});

document.addEventListener('change', function(ev){
  var s = ev.target;
  if(s.classList && s.classList.contains('rowact')){
    var v = s.value, uid = s.getAttribute('data-uid');

});

/* ── 실제 실행 ────────────────────────────────────────────────────── */
function rowOf(uid){
  for(var i = 0; i < ROWS.length; i++) if(String(ROWS[i].user_id) === String(uid)) return ROWS[i];
  return null;
}
function actionOf(v){
  for(var i = 0; i < ACTIONS.length; i++) if(ACTIONS[i].v === v) return ACTIONS[i];
  return null;
}
function say(uid, text, ok){
  var el = $('dmsg-' + uid);
  if(el){ el.textContent = text; el.className = 'msg' + (ok ? ' ok' : ' err'); }
  else msg('top-msg', text, ok);
}

async function applyOne(uid, v){
  var r = rowOf(uid), a = actionOf(v);
  if(!r || !a) return;

  // 메일 확인 처리는 부여가 아니다 — 프로그램·메모를 쓰지 않고, 경고 문구도 다르다.
  // 이미 있던 confirmEmail() 을 그대로 부른다(묻는 말이 두 자리에서 갈리지 않게).
  if(a.kind === 'confirm'){ await confirmEmail(uid); return; }

  var program = $('gp').value;
  var note    = ($('gn').value || '').trim();

  var what = a.kind === 'revoke' ? '증정을 회수'
           : a.kind === 'trial'  ? '무료 체험을 ' + a.n + '일 연장'
           : a.label + ' (프로그램: ' + program + ')';
  if(!confirm('아래 고객에게 실행합니다.\n\n  ' + r.email + '\n  ' + what +
              '\n  메모: ' + (note || '(없음)') + '\n\n진행할까요?')) return;

  if(SAMPLE){ say(uid, '표본 보기라 실행하지 않았습니다.', false); return; }
  say(uid, '처리 중…', true);
  var res = await callOne(uid, a, program, note);
  if(res.error){ say(uid, rpcErr(res.error), false); return; }
  say(uid, '✓ 완료', true);
  await loadAll();
}

function callOne(uid, a, program, note){
  if(a.kind === 'days')
    return sb.rpc('admin_grant_days',  { p_user_id:uid, p_program:program, p_days:a.n,   p_note:note || null });
  if(a.kind === 'comp')
    return sb.rpc('admin_grant_comp',  { p_user_id:uid, p_program:program, p_months:a.n, p_note:note || null });
  if(a.kind === 'trial')
    return sb.rpc('admin_extend_trial',{ p_user_id:uid, p_days:a.n });
  if(a.kind === 'revoke')
    return sb.rpc('admin_revoke_comp', { p_user_id:uid, p_reason:note || null });
  return Promise.resolve({ error:{ message:'알 수 없는 작업' } });
}

/* ── 여러 명 한꺼번에 ─────────────────────────────────────────────── */
function selIds(){ return Object.keys(SEL); }
function renderBulk(){
  var n = selIds().length;
  $('bulk').classList.toggle('hide', n === 0);
  $('bulk-n').textContent = n + '명 선택됨';
  var all = $('chk-all');
  if(all){
    var vis = visibleRows();
    all.checked = vis.length > 0 && vis.every(function(r){ return SEL[r.user_id]; });
  }
}
function toggleAll(box){
  var rows = visibleRows();
  if(box.checked) rows.forEach(function(r){ SEL[r.user_id] = true; });
  else            rows.forEach(function(r){ delete SEL[r.user_id]; });
  render();
}
function clearSel(){ SEL = {}; render(); }

async function runBulk(){
  var ids = selIds();
  var a   = actionOf($('bulk-act').value);
  if(!ids.length || !a){ $('bulk-msg').textContent = '고객과 작업을 먼저 고르세요.'; return; }
  // 메뉴에서 이미 뺐지만 여기서도 막는다 — 이 통로로 새는 순간 무더기 사고가 된다.
  if(a.rowOnly){
    $('bulk-msg').textContent = '“' + a.label + '”은 한 명씩만 할 수 있습니다 — 고객 줄의 부여 메뉴에서 하세요.';
    return;
  }
  var program = $('gp').value, note = ($('gn').value || '').trim();

  var names = ids.slice(0, 5).map(function(u){ var r = rowOf(u); return r ? r.email : u; });
  if(!confirm(ids.length + '명에게 “' + a.label + '”을 실행합니다.\n\n  ' +
      names.join('\n  ') + (ids.length > 5 ? '\n  … 외 ' + (ids.length - 5) + '명' : '') +
      '\n\n메모: ' + (note || '(없음)') + '\n\n진행할까요?')) return;
  if(SAMPLE){ $('bulk-msg').textContent = '표본 보기라 실행하지 않았습니다.'; return; }

  var ok = 0, fail = [];
  for(var i = 0; i < ids.length; i++){
    $('bulk-msg').textContent = (i + 1) + '/' + ids.length + ' 처리 중…';
    var res = await callOne(ids[i], a, program, note);
    if(res.error){
      var r = rowOf(ids[i]);
      fail.push((r ? r.email : ids[i]) + ' — ' + rpcErr(res.error));
    } else ok++;
  }
  $('bulk-msg').textContent = '완료 ' + ok + '명' + (fail.length ? ' · 실패 ' + fail.length + '명' : '');
  if(fail.length) alert('실패한 고객\n\n' + fail.join('\n'));
  SEL = {};
  await loadAll();
}

/* ── CSV ──────────────────────────────────────────────────────────── */
function exportCsv(){
  var rows = visibleRows();
  if(!rows.length){ return; }
  var head = ['이메일','이름','언어','상태','플랜','프로그램','이용만료','체험종료',
              '가입(PT)','메일확인(PT)','마지막로그인(PT)','마지막학습(PT)',
              '푼문항','시도','정답','정답률%',
              'P1문항','P1정답률%','P2문항','P2정답률%','P3문항','P3정답률%',
              '모의고사','마케팅동의'];
  var lines = [head.join(',')];
  rows.forEach(function(r){
    // Part 별 값을 1·2·3 자리에 맞춰 꺼낸다 (없으면 빈칸)
    var byPart = {};
    partList(r).forEach(function(x){ byPart[Number(x.part)] = x; });
    function pCell(n, what){
      var x = byPart[n];
      if(!x) return '';
      return (what === 'a') ? x.answered : (pctOf(x.correct, x.attempts));
    }
    lines.push([
      r.email, [r.first_name, r.last_name].filter(Boolean).join(' '), r.language,
      STATUS_LABEL[statusOf(r)], r.plan_code, r.comp_program,
      dcsv(r.paid_until), dcsv(r.trial_ends_at),
      dcsv(r.signed_up_at), dcsv(r.confirmed_at),
      dcsv(r.last_sign_in_at), dcsv(r.last_study),
      r.answered, r.attempts, r.correct, pctOf(r.correct, r.attempts),
      pCell(1,'a'), pCell(1,'p'), pCell(2,'a'), pCell(2,'p'), pCell(3,'a'), pCell(3,'p'),
      r.mock_done,
      r.marketing_consent ? 'Y' : 'N'
    ].map(function(v){
      var s = (v == null) ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(','));
  });
  // 엑셀이 한글을 깨뜨리지 않도록 BOM 을 앞에 붙인다
  var blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pracexam_customers.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ── 표본 자료 (화면 검토용 · 실제와 무관) ──────────────────────────── */
// 총계를 Part 1·2·3 으로 대충 갈라 놓는다 — 모양만 보려는 것이라 정확할 필요가 없다
function samParts(answered, attempts, correct, seed){
  if(!answered) return [];
  var w = [[.45,.35,.20],[.34,.33,.33],[.25,.30,.45]][seed % 3];
  var out = [];
  for(var i = 0; i < 3; i++){
    var a = Math.round(answered * w[i]);
    if(a <= 0) continue;
    var at = Math.max(a, Math.round(attempts * w[i]));
    var co = Math.round(correct * w[i] * (0.85 + 0.1 * i));
    out.push({ part:i + 1, answered:a, attempts:at, correct:Math.min(co, at) });
  }
  return out;
}
function samMock(done, iso){
  if(!done) return [];
  var out = [];
  for(var p = 1; p <= Math.min(done, 3); p++){
    out.push({ part:p, done:1, correct:50 + p * 7, total:85, at:iso(-(p * 6)) });
  }
  return out;
}

    var unconf = (m[0].indexOf('unconfirmed') === 0 || m[0].indexOf('typo') === 0);
    return {
      user_id:'sample-' + i, email:m[0], first_name:m[1], last_name:m[2], language:m[3],
      signed_up_at:    iso(m[4]),
      confirmed_at:    unconf ? null : iso(m[4]),
      // 표본에서도 새 두 열이 보이게 한다. typo.bounce = 가입 9일이 지나도록 독촉이
      // 안 나간 사람 — 자동발송이 멈췄을 때 화면이 어떻게 보이는지 그대로 보여 준다.
      confirmation_sent_at:  iso(m[4]),
      confirm_reminder_sent: unconf ? (m[0].indexOf('typo') !== 0) : false,
      // 표본에서도 "알게 된 경로" 줄과 집계가 보이게 한다.
      // 일부러 3명은 비워 둔다 — 안 고른 사람·묻기 전에 가입한 사람이 섞인
      // 실제 모습이 그렇고, 분모가 «응답자»라는 것이 표본에서도 드러난다.
      referral_source: SAMPLE_REF[i % SAMPLE_REF.length],
      referral_note:   (SAMPLE_REF[i % SAMPLE_REF.length] === 'other') ? '세미나에서 들었어요' : null,
      ad_click:        (i === 0 || i === 5),
      utm_source:      null,
      last_sign_in_at: iso(Math.max(m[4], -14)),
      is_paid:   m[5],
      plan_code: m[6],
      paid_until:    m[7] === null ? null : iso(m[7]),
      trial_ends_at: iso(m[4] + 30),
      comp_program: m[8],
      sub_canceled: (i === 1),
      marketing_consent: (i % 3 !== 0),
      customer_ref:     (m[5] && !m[8]) ? 'ctm_01hxsample' + i : null,
      subscription_ref: (m[5] && !m[8]) ? 'sub_01hxsample' + i : null,
      answered:m[10], attempts:m[11], correct:m[12],
      last_study: m[13] === null ? null : iso(m[13]),
      parts:      samParts(m[10], m[11], m[12], i),
      mock_done:  m[14],
      mock_parts: samMock(m[14], iso),
      grant_program:    m[8],
      grant_expires_at: m[8] ? iso(m[7]) : null,
      grant_note:       m[9]
    };
  });
}
</script>
