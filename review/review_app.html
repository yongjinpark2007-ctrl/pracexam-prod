<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#354649">
<title>PracExam Review · 문항 검증</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ==========================================================================
   PracExam Review — HARBOR DESIGN
   토큰은 Production Files/app.html 과 **동일**합니다. 나중에 app.html 로 흡수할 때
   색·타이포를 다시 맞출 필요가 없도록 값을 그대로 복사했습니다.
   ========================================================================== */
:root{
  --page-bg:      #E0E7E9;
  --card-bg:      #ffffff;
  --border-clr:   rgba(53,70,73,.14);
  --border-hover: rgba(53,70,73,.32);
  --sel-bg:       #d9ebe9;
  --sel-border:   #6FA39E;
  --card-shadow:  0 1px 4px rgba(53,70,73,.08);
  --text-main:    #232e30;
  --text-mid:     #4b5759;
  --text-muted:   #6C7A89;
  --navy:         #354649;
  --teal:         #354649;
  --success-color:#16a34a;
  --danger-color: #dc2626;
  --flag-color:   #d97706;
  --gold:         #6FA39E;
  --silver:       #6C7A89;
  --accent:       #DD8F75;
  --accent-tint:  #FBF1EC;
  --accent-border:#EFD0C1;

  /* 글자 크기 배율. 헤더의 A− / A+ 로 조절하며 localStorage 에 저장됩니다.
     본문뿐 아니라 메뉴·목록·버튼 등 UI 전반에 곱해집니다(노안 대응).
     2026-07-31: 전체 25% 축소 요청 → 기본 1.15 → 0.86 */
  --fs: 0.86;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%;
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--page-bg);color:var(--text-main);font-size:16px;
  -webkit-text-size-adjust:100%;
}
#app{display:flex;flex-direction:column;height:100%;overflow:hidden;}

/* ── HEADER ─────────────────────────────────────────────────────────────── */
.header{
  background:var(--navy);display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:8px 1rem;min-height:60px;flex-shrink:0;flex-wrap:wrap;
  box-shadow:0 2px 12px rgba(0,0,0,.18);z-index:100;
}
.header-brand{display:flex;align-items:baseline;gap:10px;min-width:0;}
.header-title{font-size:calc(17.5px * var(--fs));font-weight:700;color:#E0E7E9;letter-spacing:-.01em;white-space:nowrap;}
.header-sub{font-size:calc(11.5px * var(--fs));color:rgba(255,255,255,.6);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;}
.exam-seg{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:8px;overflow:hidden;}
.exam-seg button{
  font-family:inherit;font-weight:700;font-size:calc(14px * var(--fs));letter-spacing:.02em;
  padding:8px 13px;border:none;background:transparent;color:rgba(255,255,255,.72);
  cursor:pointer;transition:background .15s,color .15s;
}
.exam-seg button:hover{background:rgba(255,255,255,.12);color:#fff;}
.exam-seg button.active{background:rgba(255,255,255,.20);color:#fff;}
.hdr-stat{font-size:calc(14px * var(--fs));color:rgba(255,255,255,.72);font-weight:600;white-space:nowrap;}
.hdr-stat b{color:#fff;}
.icon-btn{
  background:none;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.8);
  border-radius:8px;padding:8px 12px;font-family:inherit;font-size:calc(14px * var(--fs));font-weight:600;cursor:pointer;
}
.icon-btn:hover{background:rgba(255,255,255,.12);color:#fff;}

/* ── PROGRESS STRIP ─────────────────────────────────────────────────────── */
.progress-strip{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--card-bg);border-bottom:1px solid var(--border-clr);
  padding:10px 1rem;flex-shrink:0;font-size:calc(15.5px * var(--fs));color:var(--text-muted);font-weight:600;
}
.pchip{display:inline-flex;align-items:center;gap:6px;}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.pdot.pass{background:var(--success-color);}
.pdot.hold{background:var(--flag-color);}
.pdot.reject{background:var(--danger-color);}
.pdot.todo{background:#c3cdd0;}
.pbar{flex:1;min-width:120px;height:6px;border-radius:3px;background:#dde5e7;overflow:hidden;}
.pbar span{display:block;height:100%;background:var(--gold);transition:width .3s;}

/* ── LAYOUT ─────────────────────────────────────────────────────────────── */
.main{flex:1;display:flex;min-height:0;overflow:hidden;}
.pane-list{
  width:430px;flex-shrink:0;border-right:1px solid var(--border-clr);
  background:var(--card-bg);display:flex;flex-direction:column;min-height:0;
}
/* 화면이 좁으면 목록 폭을 조금 양보한다 (모바일 전환 전 구간) */
@media (max-width:1100px){ .pane-list{width:360px;} }
.filters{padding:10px 12px;border-bottom:1px solid var(--border-clr);display:flex;flex-direction:column;gap:8px;}
.filter-row{display:flex;gap:6px;}
.filters select,.filters input{
  font-family:inherit;font-size:calc(16px * var(--fs));padding:10px 11px;border-radius:8px;
  border:1px solid var(--border-clr);background:#fff;color:var(--text-main);min-width:0;flex:1;
}
.filters input::placeholder{color:#a8b3b6;}
.qlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.qrow{
  display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:11px 12px;border:none;border-bottom:1px solid var(--border-clr);
  background:transparent;cursor:pointer;font-family:inherit;transition:background .12s;
}
.qrow:hover{background:rgba(53,70,73,.04);}
.qrow.active{background:var(--sel-bg);box-shadow:inset 3px 0 0 var(--sel-border);}
.qrow-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px;background:#c3cdd0;}
.qrow-dot.pass{background:var(--success-color);}
.qrow-dot.hold{background:var(--flag-color);}
.qrow-dot.reject{background:var(--danger-color);}
.qrow-main{min-width:0;flex:1;}
.qrow-id{font-size:calc(14px * var(--fs));font-weight:700;color:var(--text-muted);letter-spacing:.02em;}
.qrow-text{
  font-size:calc(16px * var(--fs));line-height:1.55;color:var(--text-mid);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.list-empty{padding:28px 16px;text-align:center;color:var(--text-muted);font-size:calc(16.5px * var(--fs));line-height:1.75;}

.pane-detail{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.25rem;min-width:0;}
.detail-inner{max-width:1040px;margin:0 auto;}

/* ── QUESTION CARD ──────────────────────────────────────────────────────── */
.question-card{
  background:var(--card-bg);border:1px solid var(--border-clr);
  border-radius:16px;padding:1.5rem;margin-bottom:1rem;
  box-shadow:0 1px 6px rgba(0,0,0,.08);
}
.question-meta{display:flex;align-items:center;gap:6px;margin-bottom:1rem;flex-wrap:wrap;}
.q-badge{
  background:rgba(53,70,73,.12);color:var(--teal);border:1px solid var(--border-clr);
  border-radius:6px;display:inline-flex;align-items:center;min-height:30px;padding:3px 11px;
  font-size:calc(14.5px * var(--fs));font-weight:700;white-space:nowrap;
}
.q-badge-gray{background:rgba(0,0,0,.03);color:var(--text-muted);}
.question-text{font-size:calc(21px * var(--fs));line-height:1.72;color:var(--text-main);font-weight:500;white-space:pre-wrap;}
.options-list{display:flex;flex-direction:column;gap:0;margin:1.1rem -1.5rem 0;border-top:1px solid var(--border-clr);}
.option-row{
  display:flex;align-items:baseline;gap:12px;padding:14px 1.5rem;
  border-bottom:1px solid var(--border-clr);position:relative;
}
.option-row:last-child{border-bottom:none;}
.option-row.correct{background:rgba(22,163,74,.06);}
.option-row.correct::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--success-color);}
.opt-letter{font-size:calc(18px * var(--fs));font-weight:700;color:var(--text-muted);flex-shrink:0;min-width:24px;}
.option-row.correct .opt-letter{color:var(--success-color);}
.opt-text{font-size:calc(18.5px * var(--fs));line-height:1.68;color:var(--text-mid);}
.opt-mark{margin-left:auto;font-size:calc(13.5px * var(--fs));font-weight:700;color:var(--success-color);letter-spacing:.06em;flex-shrink:0;}

/* ── EXPLANATION ────────────────────────────────────────────────────────── */
.explanation-card{
  background:var(--card-bg);border:1px solid var(--border-clr);border-radius:14px;
  padding:1.25rem;margin-bottom:1rem;box-shadow:var(--card-shadow);
}
.exp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.exp-label{font-size:calc(18px * var(--fs));color:var(--teal);font-weight:700;letter-spacing:-.01em;}
.exp-body{font-size:calc(18.5px * var(--fs));line-height:1.85;color:var(--text-mid);letter-spacing:-.01em;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;}
.tip-box{background:var(--accent-tint);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 16px;margin-top:14px;}
.tip-label{font-size:calc(18px * var(--fs));font-weight:700;color:#b85f3f;margin-bottom:8px;line-height:1.4;}
.tip-body{font-size:calc(18.5px * var(--fs));line-height:1.8;color:var(--text-mid);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;}
.lang-toggle{display:inline-flex;border:1px solid var(--border-clr);border-radius:8px;overflow:hidden;flex-shrink:0;}
.lang-toggle button{
  font-family:inherit;font-size:calc(13.5px * var(--fs));font-weight:700;letter-spacing:.04em;padding:7px 12px;
  border:none;background:transparent;color:var(--text-muted);cursor:pointer;
}
.lang-toggle button.active{background:var(--sel-bg);color:var(--teal);}

/* ── WAR ROOM BODY (치트시트 HTML 렌더) ─────────────────────────────────── */
.wr-body{font-size:calc(15.5px * var(--fs));line-height:1.78;color:var(--text-mid);}
.wr-body h3{color:var(--teal);margin:18px 0 8px;font-size:calc(16.5px * var(--fs));}
.wr-body h4{color:var(--text-main);margin:14px 0 6px;font-size:calc(15px * var(--fs));}
.wr-body table{border-collapse:collapse;width:100%;margin:10px 0;font-size:calc(14px * var(--fs));}
.wr-body th,.wr-body td{border:1px solid var(--border-clr);padding:7px 9px;text-align:left;vertical-align:top;}
.wr-body th{background:rgba(53,70,73,.06);font-weight:700;}
.wr-body ul,.wr-body ol{padding-left:1.3em;margin:8px 0;}
.wr-body li{margin:4px 0;}
.wr-body p{margin:8px 0;}
.wr-body b,.wr-body strong{color:var(--text-main);}

/* ── VERDICT BAR ────────────────────────────────────────────────────────── */
.verdict-card{
  background:var(--card-bg);border:1px solid var(--border-clr);border-radius:14px;
  padding:1.1rem 1.25rem 1.25rem;box-shadow:var(--card-shadow);
}
.verdict-btns{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.vbtn{
  flex:1;min-width:118px;font-family:inherit;font-size:calc(18px * var(--fs));font-weight:700;
  padding:15px 10px;border-radius:10px;cursor:pointer;transition:all .15s;
  border:1.5px solid var(--border-clr);background:#fff;color:var(--text-mid);
}
.vbtn:hover{border-color:var(--border-hover);}
.vbtn .k{font-size:calc(13.5px * var(--fs));font-weight:600;opacity:.55;margin-left:6px;}
.vbtn.pass.on{background:rgba(22,163,74,.10);border-color:var(--success-color);color:var(--success-color);}
.vbtn.hold.on{background:rgba(217,119,6,.10);border-color:var(--flag-color);color:var(--flag-color);}
.vbtn.reject.on{background:rgba(220,38,38,.08);border-color:var(--danger-color);color:var(--danger-color);}
.verdict-card textarea{
  width:100%;font-family:inherit;font-size:calc(16.5px * var(--fs));line-height:1.65;padding:12px 14px;
  border:1px solid var(--border-clr);border-radius:10px;resize:vertical;min-height:86px;
  color:var(--text-main);background:#fff;
}
.verdict-card textarea::placeholder{color:#a8b3b6;}
.verdict-foot{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
.btn{
  font-family:inherit;font-size:calc(17px * var(--fs));font-weight:700;padding:12px 19px;border-radius:10px;
  border:1px solid var(--border-clr);background:#fff;color:var(--text-mid);cursor:pointer;transition:all .15s;
}
.btn:hover{border-color:var(--border-hover);}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.primary:hover{background:#2a383a;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.save-state{font-size:calc(15.5px * var(--fs));font-weight:600;color:var(--text-muted);margin-left:auto;}
.save-state.ok{color:var(--success-color);}
.save-state.err{color:var(--danger-color);}
.hint{font-size:calc(15px * var(--fs));color:var(--text-muted);line-height:1.75;margin-top:12px;}
.hint kbd{
  display:inline-block;background:rgba(53,70,73,.07);border:1px solid var(--border-clr);
  border-radius:5px;padding:2px 7px;font-family:inherit;font-size:calc(14px * var(--fs));font-weight:700;color:var(--text-mid);
}

/* ── GATE / EMPTY ───────────────────────────────────────────────────────── */
.gate{
  flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem;overflow-y:auto;
}
.gate-card{
  background:var(--card-bg);border:1px solid var(--border-clr);border-radius:16px;
  padding:1.75rem;box-shadow:var(--card-shadow);width:100%;max-width:400px;
}
.gate-card h1{font-size:calc(22px * var(--fs));font-weight:700;margin-bottom:6px;}
.gate-card p{font-size:calc(15.5px * var(--fs));color:var(--text-muted);line-height:1.7;margin-bottom:16px;}
.gate-card label{display:block;font-size:calc(14.5px * var(--fs));font-weight:700;color:var(--text-mid);margin:12px 0 6px;}
.gate-card input{
  width:100%;font-family:inherit;font-size:calc(17px * var(--fs));padding:12px 13px;
  border:1px solid var(--border-clr);border-radius:10px;background:#fff;color:var(--text-main);
}
.gate-card .btn{width:100%;margin-top:16px;}
.msg{font-size:calc(15px * var(--fs));line-height:1.65;padding:11px 13px;border-radius:9px;margin-top:12px;display:none;}
.msg.show{display:block;}
.msg.err{background:rgba(220,38,38,.07);color:var(--danger-color);border:1px solid rgba(220,38,38,.2);}
.msg.info{background:rgba(53,70,73,.05);color:var(--text-mid);border:1px solid var(--border-clr);}
.empty-detail{
  display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--text-muted);font-size:calc(16px * var(--fs));text-align:center;line-height:1.8;padding:2rem;
}

/* ── MOBILE ─────────────────────────────────────────────────────────────── */
.back-btn{display:none;}
@media (max-width:820px){
  .pane-list{
    width:100%;position:absolute;inset:0;top:0;z-index:20;
    transform:translateX(0);transition:transform .22s ease;
  }
  .main.detail-open .pane-list{transform:translateX(-100%);}
  .main{position:relative;}
  .pane-detail{width:100%;}
  .back-btn{display:inline-flex;}
  /* 모바일에서도 배율은 유지한다 — 고정 px 로 덮으면 A+ 가 무효가 된다 */
  .question-text{font-size:calc(19px * var(--fs));}
  .header-sub{display:none;}
}
/* ── 승인 대기(Claude 제안 검토) 모드 ─────────────────────────────────────── */
.ap-bar{gap:6px;flex-wrap:wrap}
.ap-bar .btn{padding:7px 10px;font-size:12px}
/* 저장 폴더 안내(.ap-dir)는 그 아래 묶음 정보(.ap-info)와 같은 크기로 — 눈에 튀지 않게 */
.ap-info,.ap-dir{font-size:12px;color:#5b6b6e;line-height:1.5}
.ap-info b,.ap-dir b{color:#20343a}
/* 묶음 상태 — '이미 승인한 것을 또 승인하는' 사고를 막기 위해 눈에 띄게 */
.ap-done{color:#2f6b5c;font-weight:700}
.ap-redo{color:#a06a1e;font-weight:700}
.ap-todo{color:#5b6b6e}
.ap-warn{color:#a33}
/* ── 검토 이력 (묶음별 완료 여부) ───────────────────────────────────────────── */
.aph-back{position:fixed;inset:0;background:rgba(20,40,44,.45);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:20px}
.aph-box{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:82vh;
  display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.aph-h{padding:16px 18px;border-bottom:1px solid #e6edee;display:flex;align-items:center;gap:10px}
.aph-h b{font-size:15px;color:#20343a}
.aph-h .btn{margin-left:auto}
.aph-body{overflow:auto;padding:8px 18px 18px}
.aph-hint{font-size:12px;color:#5b6b6e;line-height:1.6;margin:10px 0 12px}
.aph-row{border:1px solid #e0e8e9;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.aph-row.cur{border-color:#A3C6C4;background:#f6fbfa}
.aph-name{font-size:13px;font-weight:700;color:#20343a;word-break:break-all}
.aph-meta{font-size:12px;color:#5b6b6e;margin-top:4px;line-height:1.6}
.aph-file{font-size:11px;color:#8a999c;margin-top:3px;word-break:break-all}
.aph-del{float:right;font-size:11px;color:#a33;background:none;border:0;cursor:pointer;padding:2px 4px}
.aph-empty{font-size:13px;color:#5b6b6e;padding:20px 0;text-align:center}
.q-badge.ap-applied{background:rgba(111,163,158,.18);border-color:#A3C6C4}
.q-badge.ap-pending{background:rgba(224,168,90,.20);border-color:#E0A85A}
/* 제안 위에 항상 붙는 '문항 원문' 카드 — 이게 없으면 검토 자체가 불가능하다 */
.ap-q{margin:12px 0;border:1px solid #cfdadb;border-radius:10px;background:#fff;padding:14px}
.ap-qtext{font-size:calc(15px * var(--fs));line-height:1.8;color:#20343a;white-space:pre-wrap;margin-bottom:10px}
/* 한 항목에 문항이 둘 이상일 때(중복 쌍) — 라벨이 붙은 카드는 왼쪽 띠로 구분한다 */
.ap-q-multi{border-left:4px solid #A3C6C4}
.ap-q-multi .ap-h{color:#2f6b5c;font-size:13px}
.ap-opt{display:flex;gap:9px;padding:7px 10px;border-radius:8px;margin-bottom:3px;
  font-size:calc(14px * var(--fs));line-height:1.65;color:#20343a}
.ap-opt b{color:#8a999c;min-width:15px;flex:none}
.ap-opt.key{background:#eef7f4;border:1px solid #A3C6C4}
.ap-opt.key b{color:#2f6b5c}
.ap-exp{margin-top:12px;border-top:1px solid #eef2f3;padding-top:8px}
.ap-exp summary{cursor:pointer;font-size:12px;font-weight:700;color:#5b6b6e;padding:5px 0;list-style:revert}
.ap-exp .ap-body{margin-top:6px;font-size:calc(13.5px * var(--fs))}
.ap-why{margin:12px 0;border:1px solid #dbe4e5;border-radius:10px;background:#fbfdfd;padding:12px 14px}
.ap-h{font-size:12px;font-weight:700;color:#5b6b6e;letter-spacing:.02em;margin-bottom:7px}
.ap-body{font-size:calc(14px * var(--fs));line-height:1.75;color:#20343a;white-space:pre-wrap}
.ap-diff{margin:12px 0}
.ap-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:900px){.ap-cols{grid-template-columns:1fr}}
/* ㉰ 2026-08-24 — 해설·팁처럼 긴 칸은 절반 너비에 넣으면 한 줄이 스무 자쯤에서 꺾여
   읽을 수가 없다. 길면(또는 기존 칸이 없으면) 위아래로 편다. */
.ap-cols.ap-stack{grid-template-columns:1fr}
.ap-col{border:1px solid #dbe4e5;border-radius:10px;overflow:hidden;min-width:0}
.ap-col-h{font-size:11px;font-weight:700;padding:6px 10px;border-bottom:1px solid #dbe4e5}
.ap-before .ap-col-h{background:#fdf1f1;color:#9a4b4b}
.ap-after  .ap-col-h{background:#eef7f4;color:#2f6b5c}
/* ㉯ 2026-08-24 — 13px 였다. 옛 글(.ap-qtext)이 15px 인데 «승인받을 새 글»이 더 작으면
   숨기는 것처럼 보인다(사용자 지적). 두 글을 같은 크기로 맞춘다. */
.ap-col pre{margin:0;padding:10px;font-size:calc(15px * var(--fs));line-height:1.65;
  white-space:pre-wrap;word-break:break-word;font-family:inherit;color:#20343a;overflow-x:auto}
.ap-card textarea{min-height:220px;font-size:calc(14px * var(--fs));line-height:1.7}
.ap-count{font-size:11px;color:#8a999c;text-align:right;margin-top:4px}
/* 지난 회신에서 넘어온 글 — 그대로 두면 새 회신에 다시 실린다 */
.ap-stale{margin-top:8px;padding:8px 10px;border:1px solid #E0A85A;border-radius:8px;
  background:rgba(224,168,90,.12);font-size:12px;color:#7a5518;line-height:1.6;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ap-stale .btn{padding:4px 10px;font-size:11px;margin-left:auto;flex:none}
/* ── 치트시트(War Room) 제안 검토 — kind:'sheet' ────────────────────────────
   본문이 HTML 이라 문항용(전부 escape)으로는 검토가 안 된다. 수정 반영본을 그대로 렌더하고
   바뀐 곳만 노란 표시(<mark class="ap-mk">)로 짚어 준다. */
.ap-sheet{margin:12px 0;border:1px solid #cfdadb;border-radius:10px;background:#fff;padding:14px}
.ap-sheet-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ap-sheet-title{font-size:calc(16px * var(--fs));font-weight:700;color:#20343a}
.ap-sheet .wr-body{max-height:none}
mark.ap-mk{background:#fff3c4;border-bottom:2px solid #e6c757;padding:1px 2px;border-radius:3px}
.ap-mk-legend{font-size:11.5px;color:#8a999c;margin-bottom:8px}
/* 구간 대조 — 실제 보이는 모습과 HTML 코드를 함께 본다 */
/* 조각이 균형화돼도 표·긴 코드가 넘칠 수 있다 — 카드 안에서만 스크롤되게 가둔다 */
.ap-col .ap-rendered{padding:10px;font-size:calc(13.5px * var(--fs));line-height:1.7;color:#20343a;overflow-x:auto;max-width:100%;min-width:0}
.ap-col .ap-rendered table{max-width:100%;border-collapse:collapse}
.ap-col .ap-rendered img{max-width:100%;height:auto}
.ap-col .ap-rendered strong,.ap-col .ap-rendered b{color:#20343a;font-weight:700}
.ap-code{border-top:1px dashed #dbe4e5}
.ap-code summary{cursor:pointer;font-size:11px;color:#8a999c;padding:5px 10px;list-style:revert}
.ap-note{font-size:12px;color:#8a6a2f;background:#fffbf0;border:1px solid #f0e2bd;
  border-radius:8px;padding:7px 10px;margin-top:8px;line-height:1.6}
.ap-reason{font-size:12.5px;color:#5b6b6e;line-height:1.7;margin-top:8px;white-space:pre-wrap}
.ap-paste{padding:16px}
.ap-paste textarea{width:100%;min-height:340px;font:inherit;font-size:13px;line-height:1.6;
  padding:12px;border:1px solid #cfdadb;border-radius:10px;resize:vertical}
/* ── ✏️ 직접 수정 (2026-08-30) ─────────────────────────────────────────────
   사장님이 오타·표현을 손수 고쳐 그 자리에서 라이브에 올리는 칸.
   판정 카드(.verdict-card)와 헷갈리지 않도록 «따뜻한 색»으로 갈라 둔다. */
.ed-card{background:#fff;border:2px solid #C9A227;border-radius:12px;
  padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.ed-h{font-size:calc(14px * var(--fs));color:#6b5a12;background:#FDF6DC;
  border-radius:8px;padding:9px 12px;margin-bottom:14px;line-height:1.6}
.ed-f{display:block;margin-bottom:13px}
.ed-l{display:block;font-size:calc(12.5px * var(--fs));font-weight:700;
  color:#5a6b6e;margin-bottom:5px}
.ed-in{width:100%;box-sizing:border-box;font-family:inherit;
  font-size:calc(15px * var(--fs));line-height:1.65;color:#1d2b2e;
  border:1px solid #cfd8da;border-radius:8px;padding:9px 11px;background:#fff;
  resize:vertical}
.ed-in:focus{outline:none;border-color:#C9A227;box-shadow:0 0 0 3px rgba(201,162,39,.15)}
.ed-opt{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.ed-key{display:flex;align-items:center;gap:5px;padding-top:9px;
  font-weight:800;color:#3d5a5e;cursor:pointer;white-space:nowrap}
.ed-key input{cursor:pointer}
.ed-optin{flex:1}
.ed-warn{margin:4px 0 12px}
.ed-w{background:#FFF4E5;border-left:3px solid #E8A33D;border-radius:6px;
  padding:8px 11px;margin-top:6px;font-size:calc(13px * var(--fs));
  color:#7a5310;line-height:1.6}
.ed-ok{font-size:calc(13px * var(--fs));color:#2f6b52}
.ed-none{font-size:calc(13px * var(--fs));color:#a8b3b6}
.ed-foot{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.ed-open{border-color:#C9A227;color:#6b5a12}
/* 수정 이력 모달 — 승인 이력(.aph-*) 상자를 그대로 빌려 쓴다 */
.edh-row{border-bottom:1px solid #edf1f2;padding:11px 2px}
.edh-top{font-size:calc(13px * var(--fs));color:#5a6b6e;margin-bottom:5px}
.edh-id{font-weight:800;color:#1d2b2e}
.edh-field{display:inline-block;background:#eef3f4;border-radius:5px;
  padding:1px 7px;margin-left:6px;font-size:calc(12px * var(--fs))}
.edh-b,.edh-a{font-size:calc(13px * var(--fs));line-height:1.6;
  white-space:pre-wrap;word-break:break-word;border-radius:6px;padding:7px 9px;margin-top:4px}
.edh-b{background:#fbecec;color:#7a2f2f}
.edh-a{background:#e9f5ee;color:#1f5a3d}
.ed-toast{margin-top:8px;font-size:calc(13px * var(--fs))}

/* ══ 🖥 실제 앱과 «같은» War Room 화면 (2026-08-30 사장님 지적) ══════════════
   > "review_app에서 보는 War Room은 실제 pracexam.com War Room에서 보는 화면과
   >  다릅니다."
   👉 아래는 **`app.html` 9849~9905행을 값 그대로** 옮긴 것이다.
   🔴 **여기 숫자를 «고치지 말 것».** 고치는 만큼 실제 화면과 어긋나고, 그러면
      미리보기가 거짓말을 한다. app.html 의 `.wr-body` 가 바뀌면 여기도 함께 옮긴다.
   🔴 실제와 «일부러» 다르게 둔 것 딱 둘 —
      ① `user-select` : 실제 화면은 복사를 막지만(.wr-protected) 여기는 검토용이라 연다
         (2026-07-31 부터의 규칙 — 드래그·복사 자유).
      ② `--fs`(글자 크기 버튼)를 **안 건다**. 실물 크기여야 미리보기가 맞다.
   폭 790px = 실제 앱의 `.wr-wrap`(1040) − TOC(230) − 간격(20). 줄바꿈까지 같아진다. */
.wr-real{max-width:790px;}
.wr-real .wr-sheet{position:relative;background:#fff;border:1px solid rgba(53,70,73,.12);
  border-radius:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);min-height:420px;
  display:flex;flex-direction:column;min-width:0;}
.wr-real .wr-protected{flex:1;padding:20px 26px 26px;min-width:0;
  -webkit-user-select:text;user-select:text;}   /* ← 실제와 다른 곳 ① */
.wr-real .wr-title{font-family:'Poppins',sans-serif;font-size:21px;font-weight:800;
  color:#232e30;margin-bottom:14px;letter-spacing:-.01em;}
.wr-real .wr-body{min-width:0;font-size:14.5px;color:#4b5759;
  word-break:normal;overflow-wrap:normal;line-height:1.75;}
.wr-real .wr-body h3{font-family:'Poppins',sans-serif;font-size:15.5px;font-weight:700;
  color:#354649;margin:20px 0 9px;padding-bottom:6px;border-bottom:1px solid rgba(53,70,73,.12);}
.wr-real .wr-body h3:first-child{margin-top:2px;}
.wr-real .wr-body p{font-size:14.5px;line-height:1.75;color:#4b5759;margin-bottom:11px;}
.wr-real .wr-body ul{margin:0 0 12px 20px;}
.wr-real .wr-body li{font-size:14.5px;line-height:1.7;color:#4b5759;margin-bottom:5px;}
.wr-real .wr-body strong{color:#232e30;}
.wr-real .wr-body p,.wr-real .wr-body li{word-break:keep-all;overflow-wrap:break-word;}
.wr-real .wr-tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:4px 0 14px;max-width:100%;}
.wr-real .wr-tblwrap>table{margin:0;}
.wr-real .wr-body table{width:100%;border-collapse:collapse;margin:4px 0 14px;font-size:13.5px;}
.wr-real .wr-body th,.wr-real .wr-body td{border:1px solid rgba(53,70,73,.12);padding:8px 11px;
  text-align:left;vertical-align:top;word-break:keep-all;overflow-wrap:normal;}
.wr-real .wr-body th{background:#EDF4F3;color:#354649;font-weight:700;font-size:12px;}
.wr-real .wr-body td{color:#4b5759;}
.wr-real .wr-body .tip{background:#FBF1EC;border-left:3px solid #DD8F75;border-radius:0 8px 8px 0;
  padding:11px 14px;margin:8px 0 15px;}
.wr-real .wr-body .tip-label{font-size:10.5px;font-weight:700;color:#b85f3f;letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:5px;}
.wr-real .wr-body .tip p{font-size:13.5px;line-height:1.7;margin:0;color:#4b5759;}
.wr-real .wr-body .ex{background:#D3E9E4;border:1px solid #9CC8C1;border-left:4px solid #3E837A;
  border-radius:0 8px 8px 0;padding:12px 15px;margin:10px 0 16px;}
.wr-real .wr-body .ex-label{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;
  background:#3E837A;border-radius:5px;padding:2px 8px;margin-bottom:8px;text-transform:uppercase;}
.wr-real .wr-body .ex p{font-size:13.5px;line-height:1.72;margin:0 0 6px;color:#4b5759;}
.wr-real .wr-body .ex .ans b{color:#1f5b54;}
.wr-note{font-size:calc(12.5px * var(--fs));color:#5b6b6e;background:#eef3f4;border-radius:8px;
  padding:8px 12px;margin-bottom:10px;line-height:1.6}
/* 미리보기 상자 — 실물 폭(790)이 들어가야 하므로 이력 모달보다 넓게 */
.aph-box.wide{max-width:900px}
.edp-warn{background:#FFF4E5;border-left:3px solid #E8A33D;border-radius:6px;padding:9px 12px;
  margin-bottom:8px;font-size:13px;color:#7a5310;line-height:1.6}
.edp-bad{background:#fbecec;border-left:3px solid #c0504d;color:#7a2f2f}
.edp-ok{background:#e9f5ee;border-left:3px solid #3E837A;border-radius:6px;padding:9px 12px;
  margin-bottom:8px;font-size:13px;color:#1f5a3d}
.edp-foot{display:flex;gap:9px;align-items:center;padding:12px 18px;border-top:1px solid #e6edee}
.ed-prev{margin-top:8px;border:1px dashed #cfd8da;border-radius:10px;padding:12px;background:#f7fafa}
.ed-prev-h{font-size:calc(12px * var(--fs));font-weight:700;color:#5a6b6e;margin-bottom:8px}

/* ══ 🖥 실제 앱과 «같은» 문항 화면 (2026-08-30 사장님 지시) ══════════════════
   > "연습문제, Mock도 미리보기 만들어 주세요"
   👉 `app.html` 의 `.question-card`·`.option-btn`·`.explanation-card` 값을 그대로 옮겼다.
   🔴 숫자를 고치지 말 것 — 고치는 만큼 실제 화면과 어긋나 미리보기가 거짓말을 한다.
   🔴 `--fs`(글자 크기 버튼)를 «안 건다». 실물 크기여야 미리보기가 맞다.
   폭 852px = 실제 앱 `.screen`(900) − 좌우 여백(1.5rem×2). 줄바꿈까지 같아진다.
   🔑 문항은 «평문»이다(활성 5,324건 전수 HTML 0건). 꼴을 만드는 것은 줄바꿈 하나뿐이라
      `white-space:pre-wrap` 이 이 미리보기의 핵심이다. */
.q-real{max-width:852px;color:#4b5759}
.q-real .qr-card{background:#fff;border:1px solid rgba(53,70,73,.14);border-radius:16px;
  padding:1.5rem 1.5rem 0;margin-bottom:1rem;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.q-real .qr-text{font-size:19px;line-height:1.75;color:#232e30;font-weight:500;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.q-real .qr-opts{margin:1.25rem -1.5rem 0}
.q-real .qr-opt{border-bottom:1px solid rgba(53,70,73,.14);padding:16px 1.5rem;
  display:flex;align-items:baseline;gap:12px;text-align:left;position:relative}
.q-real .qr-opt:last-child{border-bottom:none;padding-bottom:1.5rem}
.q-real .qr-opt::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.q-real .qr-l{font-size:16.5px;font-weight:600;color:#6C7A89;flex-shrink:0;min-width:22px}
.q-real .qr-t{font-size:16.5px;line-height:1.7;color:#4b5759;white-space:pre-wrap}
/* 정답 보기 = 고객이 답을 낸 «뒤» 보는 모습 */
.q-real .qr-opt.ok{background:rgba(74,222,128,.07)}
.q-real .qr-opt.ok::before{background:#16a34a}
.q-real .qr-opt.ok .qr-l{color:#16a34a;font-weight:700}
.q-real .qr-opt.ok .qr-t{color:#232e30}
.q-real .qr-exp{background:#fff;border:1px solid rgba(53,70,73,.14);border-radius:14px;
  padding:1.25rem;margin-top:1rem;box-shadow:0 1px 4px rgba(53,70,73,.08)}
.q-real .qr-lab{font-size:17px;color:#354649;font-weight:700;margin-bottom:8px;line-height:1.4}
.q-real .qr-body{font-size:17px;line-height:1.85;color:#4b5759;letter-spacing:-.01em;
  word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.q-real .qr-tip{background:#FBF1EC;border-left:3px solid #DD8F75;border-radius:0 8px 8px 0;
  padding:12px 14px;margin:10px 0}
.q-real .qr-tipl{font-size:17px;font-weight:700;color:#b85f3f;letter-spacing:-.01em;
  margin-bottom:8px;line-height:1.4}
.q-real .qr-tipb{font-size:17px;line-height:1.8;color:#4b5759;
  word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap}

</style>
</head>
<body>
<div id="app">

  <header class="header">
    <div class="header-brand">
      <span class="header-title">PracExam Review</span>
      <span class="header-sub">문항 검증</span>
    </div>
    <div class="header-right">
      <div class="exam-seg" id="examSeg"></div>
      <div class="exam-seg" id="poolSeg"></div>
      <div class="exam-seg" id="fsSeg">
        <button id="fsDown" title="글씨 작게">A−</button>
        <button id="fsUp"   title="글씨 크게">A+</button>
      </div>
      <span class="hdr-stat" id="hdrStat"></span>
      <button class="icon-btn" id="btnLogout" style="display:none">로그아웃</button>
    </div>
  </header>

  <!-- 로그인 게이트 -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <h1>문항 검증</h1>
      <p>questions 테이블은 관리자만 읽을 수 있습니다. PracExam 관리자 계정으로 로그인하세요.</p>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" placeholder="admin@example.com">
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="btn primary" id="btnLogin">로그인</button>
      <div class="msg err" id="gateMsg"></div>
    </div>
  </div>

  <!-- 진행률 -->
  <div class="progress-strip" id="strip" style="display:none">
    <span class="pchip"><span class="pdot pass"></span><span id="lPass">합격</span> <b id="cPass">0</b></span>
    <span class="pchip"><span class="pdot hold"></span><span id="lHold">보류</span> <b id="cHold">0</b></span>
    <span class="pchip"><span class="pdot reject"></span><span id="lReject">탈락</span> <b id="cReject">0</b></span>
    <span class="pchip"><span class="pdot todo"></span>미검토 <b id="cTodo">0</b></span>
    <span class="pbar"><span id="pbarFill" style="width:0%"></span></span>
    <span id="pctTxt">0%</span>
  </div>

  <!-- 본문 -->
  <div class="main" id="main" style="display:none">
    <aside class="pane-list" id="paneList">
      <div class="filters">
        <div class="filter-row">
          <select id="fPart"></select>
          <select id="fVerdict">
            <option value="">전체 상태</option>
            <option value="todo">미검토</option>
            <option value="pass">합격</option>
            <option value="hold">보류</option>
            <option value="reject">탈락</option>
          </select>
        </div>
        <div class="filter-row">
          <select id="fTopic"><option value="">전체 토픽</option></select>
        </div>
        <div class="filter-row">
          <input id="fSearch" type="search" placeholder="본문·해설·ID 검색">
        </div>
        <!-- 승인 대기 모드 전용 도구 -->
        <div class="filter-row ap-bar" id="apBar" style="display:none">
          <button class="btn" id="apImport">제안 파일 열기</button>
          <button class="btn" id="apPasteBtn">붙여넣기</button>
          <button class="btn primary" id="apExport">피드백 내보내기</button>
          <button class="btn" id="apHist" title="지금까지 검토한 묶음과 완료 여부를 봅니다">검토 이력</button>
          <button class="btn" id="apSetDir" title="'claude proposal' 폴더를 한 번만 지정해 두면 다음부터는 자동으로 그 폴더에 저장됩니다">저장 폴더</button>
          <input type="file" id="apFile" accept=".json,application/json" style="display:none">
        </div>
        <!-- ✏️ 직접 수정 이력 (2026-08-30) -->
        <div class="filter-row">
          <button class="btn" id="edHistBtn" title="review_app 에서 손으로 고친 기록을 봅니다. Claude 도 같은 기록을 읽습니다">✏️ 수정 이력</button>
        </div>
        <div class="filter-row ap-dir" id="apDirInfo" style="display:none"></div>
        <div class="filter-row ap-info" id="apInfo" style="display:none"></div>
      </div>
      <div class="qlist" id="qlist"></div>
    </aside>

    <section class="pane-detail" id="paneDetail">
      <div class="detail-inner" id="detail">
        <div class="empty-detail">왼쪽 목록에서 문항을 선택하세요.</div>

const FS_KEY = 'pracexam_review_fs_v2';
const FS_MIN = 0.6, FS_MAX = 2.0, FS_STEP = 0.1, FS_DEFAULT = 0.86;

function currentFs(){
  const v = parseFloat(localStorage.getItem(FS_KEY));
  return (isFinite(v) && v >= FS_MIN && v <= FS_MAX) ? v : FS_DEFAULT;
}
function applyFontScale(){
  document.documentElement.style.setProperty('--fs', String(currentFs()));
}
function nudgeFont(delta){
  const next = Math.min(FS_MAX, Math.max(FS_MIN, +(currentFs() + delta).toFixed(2)));
  localStorage.setItem(FS_KEY, String(next));
  applyFontScale();
}
$('fsUp').addEventListener('click',   () => nudgeFont(FS_STEP));

async function loadWarRoom(){
  $('qlist').innerHTML = '<div class="list-empty">불러오는 중…</div>';
  $('detail').innerHTML = '<div class="empty-detail">왼쪽 목록에서 항목을 선택하세요.</div>';

    renderStrip(); return;
  }
  const PAGE = 1000;
  let rows = [], from = 0;
  for(;;){
    const res = await sb.from('war_room_topics')
      .select('outline_code, part, domain, title_ko, title_en, body_ko, body_en, is_free, status')
      .order('part').order('sort_order')
      .range(from, from + PAGE - 1);
    if (res.error){
      $('qlist').innerHTML = `<div class="list-empty">치트시트를 불러오지 못했습니다.<br><br>${esc(res.error.message)}</div>`;
      return;
    }
    const batch = res.data || [];
    rows = rows.concat(batch);
    if (batch.length < PAGE) break;
    from += PAGE;
    if (from > 10000) break;
  }
  const strip = (h) => String(h || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  S.rows = rows.map(t => ({
    question_id: t.outline_code,          // 판정 키 = outline_code (예: C1004)
    part: t.part,
    topic: t.domain,                       // 토픽 필터 = 도메인
    title_ko: t.title_ko, title_en: t.title_en,
    body_ko: t.body_ko, body_en: t.body_en,
    is_free: t.is_free, wr_status: t.status,
    text: (t.title_en || t.title_ko || ''),
    _search: strip(t.body_ko) + ' ' + strip(t.body_en) + ' ' + (t.title_ko || '') + ' ' + (t.title_en || ''),
    is_wr: true
  }));
  await loadVerdicts();
  buildFilters();
  renderList();
  renderStrip();
}

/* ── 승인 대기(Claude 제안 검토) ──────────────────────────────────────────────
   제안 JSON 형식:
   { "batch":"2026-08-01-calcqc", "created":"2026-08-01",
     "items":[ { "id":"C1081-014", "title":"오답 2개 결함 수정",
                 "part":1, "topic":"C1081",
                 "status":"applied" | "proposed",
                 "why":"제안 이유(평문)",
                 "changes":[ {"field":"options","before":[...],"after":[...]} ],
                 "note":"참고" } ] }
   판정·피드백은 localStorage 에 묶음(batch)별로 저장되므로, 다른 묶음을 열었다가
   돌아와도 그대로 남아 있습니다. */

/* 판정·이력 보관소를 읽는다. 옛 형식이면 새 형식으로 옮긴 뒤 돌려준다. */
function apLoadStore(){
  let o;
  try { o = JSON.parse(localStorage.getItem(AP_LS) || '{}') || {}; }
  catch(e){ o = {}; }
  if (!o.batches || typeof o.batches !== 'object') o.batches = {};

  let moved = false;
  // ① 옛 형식(묶음 하나만 담던 feedback)을 묶음별 보관소로 옮긴다
  if (o.feedback && Object.keys(o.feedback).length){
    const nm = (o.proposal && o.proposal.batch) || o.current || '(이전 묶음)';
    const b  = o.batches[nm] || (o.batches[nm] = { feedback:{} });
    b.feedback = b.feedback || {};
    Object.keys(o.feedback).forEach(k => { if (!b.feedback[k]) b.feedback[k] = o.feedback[k]; });
    if (o.proposal){
      b.total   = (o.proposal.items || []).length;
      b.created = o.proposal.created || b.created || '';
    }
    if (!o.current) o.current = nm;
    moved = true;
  }
  if (o.feedback){ delete o.feedback; moved = true; }
  // ② 제안 원문은 별도 키로 뺀다 (한 덩어리로 두면 용량 초과 시 판정까지 날아간다)
  if (o.proposal){
    apSaveProposal(o.proposal);
    delete o.proposal;
    moved = true;
  }
  if (moved) apSaveStore(o);
  return o;
}
function apSaveStore(o){
  try { localStorage.setItem(AP_LS, JSON.stringify(o)); return true; }
  catch(e){ console.warn('판정 저장 실패:', e); return false; }
}
/* 제안 원문 — 크기가 커서 저장에 실패할 수 있다. 실패해도 판정은 위 보관소에 남는다. */
function apLoadProposal(){
  try { return JSON.parse(localStorage.getItem(AP_LS_PROP) || 'null'); }
  catch(e){ return null; }
}
function apSaveProposal(p){
  try { localStorage.setItem(AP_LS_PROP, JSON.stringify(p)); return true; }
  catch(e){
    try { localStorage.removeItem(AP_LS_PROP); } catch(_){}
    console.warn('제안 원문 저장 실패(용량):', e);
    return false;
  }
}

/* 지금 열려 있는 묶음의 기록 / 판정 */
function apCurBatch(store){
  const s = store || apLoadStore();
  if (!s.current) return null;
  return s.batches[s.current] || null;
}
function apFb(){
  const b = apCurBatch();
  return (b && b.feedback) || {};
}
function apDoneCount(b){
  const f = (b && b.feedback) || {};
  return Object.keys(f).filter(id => f[id].decision).length;
}
/* 2026-08-07T05:13:35Z → 8/7 14:13 (읽는 사람 시간대) */
function apWhen(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* 제안 묶음을 받아 화면에 올린다.
   같은 묶음이면 지난번 판정을 그대로 이어받고, 이미 내보낸 묶음이면 먼저 알려 준다. */
function apSetProposal(obj, quiet, fileName){
  if (!obj || !Array.isArray(obj.items) || !obj.items.length){
    if (!quiet) alert('제안 항목(items)이 없는 파일입니다.');
    return false;
  }
  const batch = String(obj.batch || '(이름 없음)');
  const store = apLoadStore();
  const b = store.batches[batch] || (store.batches[batch] = { feedback:{} });
  b.feedback = b.feedback || {};

  // 이미 검토를 마친 묶음을 또 여는 것을 막는다 (같은 건을 두 번 승인하는 사고 방지)
  if (!quiet && b.exportedAt){
    const ok = confirm(
      '이 묶음은 이미 검토를 마쳤습니다.\n\n' +
      `묶음: ${batch}\n` +
      `판정: ${apDoneCount(b)}건 / 총 ${b.total || obj.items.length}건\n` +
      `내보내기: ${apWhen(b.exportedAt)}\n` +
      (b.file ? `파일: ${b.file}\n` : '') +
      '\n그때 남긴 판정은 그대로 남아 있습니다. 그래도 다시 여시겠습니까?');
    if (!ok) return false;
  }

  b.total    = obj.items.length;
  b.created  = obj.created || b.created || '';
  b.openedAt = new Date().toISOString();
  if (fileName) b.file = fileName;
  store.current = batch;

  if (!apSaveStore(store)) alert('⚠ 브라우저 저장에 실패했습니다. 판정을 남긴 뒤 반드시 [피드백 내보내기] 를 눌러 주세요.');
  S.proposal    = obj;
  S.proposalBig = !apSaveProposal(obj);   // 원문이 커서 못 담았으면 새로고침 시 다시 열어야 한다
  return true;
}

/* 값 표시 — 보기 배열은 A. B. C. 로 풀어서 보여준다 */
function apVal(v){
  if (Array.isArray(v)) return v.map((x, i) => `${'ABCDEF'[i] || (i + 1)}. ${x}`).join('\n');
  if (v && typeof v === 'object') return JSON.stringify(v, null, 1);
  return String(v == null ? '' : v);
}
function apFieldName(f){
  const M = { text:'지문', options:'보기', correct:'정답키',
              explanation:'해설 (국문)', explanation_en:'해설 (영문)',
              examtip:'시험 팁 (국문)', examtip_en:'시험 팁 (영문)',
              taxupdate2025:'세법개정 메모 (2025)', wrongreasons:'오답 사유',
              title_ko:'제목 (국문)', title_en:'제목 (영문)',
              body_ko:'본문 (국문)', body_en:'본문 (영문)' };
  return M[f] || f || '변경';
}

/* 문항 원문 카드 — 지문·보기(정답 표시)·해설. 변경 여부와 무관하게 항상 보여준다.

/* 🔴 2026-08-06 — 치트시트 제안의 before/after 는 본문에서 잘라낸 **조각**이라 태그가
   짝이 안 맞는 경우가 흔하다(예: '<div class="ex"><div class="ex-label">Example</div><p>Gabriela').
   그대로 주입하면 열린 <div> 가 카드 밖까지 삼켜 화면 전체가 무너진다
   (사용자 신고: "화면이 망가져서 잘 안보이고"). 떼어 놓은 노드에 한 번 넣었다 빼면
   브라우저 파서가 열린 태그를 닫고 고아 닫힘태그를 버려 **균형 잡힌 HTML** 이 된다. */
function apBalance(v){
  const d = document.createElement('div');
  d.innerHTML = (v == null ? '' : String(v));
  return d.innerHTML;
}
function apDiff(c){
  const hasBefore = Object.prototype.hasOwnProperty.call(c, 'before');
  /* 칸 이름을 우리말로. 2026-08-22 — taxupdate2025 가 제안서에 담기게 되면서 붙였다.
     그 전에는 DB 열 이름이 그대로 떠서 무슨 칸인지 알기 어려웠다. */
  /* c.html === true 면 값이 HTML 조각이다(치트시트). 보이는 모습 + 코드를 함께 보여준다.
     코드 보기에는 원본 그대로를 쓴다 — 무엇을 치환할지 확인해야 하므로 균형화하면 안 된다. */
  const cell = (v) => c.html
    ? `<div class="ap-rendered">${apBalance(v)}</div>
       <details class="ap-code"><summary>HTML 코드 보기</summary><pre>${esc(v)}</pre></details>`
    : `<pre>${esc(apVal(v))}</pre>`;
  /* 🔴 2026-08-24 — 카드 «안»에서도 새 글이 먼저다. 밖의 차례만 뒤집고 안을 그대로 두면
     여전히 「제안」이 오른쪽·아래에 온다. 칸 이름도 무엇인지 말하도록 고쳤다. */
  const long = c.html || !hasBefore
            || apVal(c.after).length  > 160
            || (hasBefore && apVal(c.before).length > 160);
  return `<div class="ap-diff">
    <div class="ap-h">${esc(apFieldName(c.field))}</div>
    <div class="ap-cols${long ? ' ap-stack' : ''}">
      <div class="ap-col ap-after"><div class="ap-col-h">✅ 반영하면 이렇게 됩니다 (제안)</div>
        ${cell(c.after)}</div>
      ${hasBefore ? `<div class="ap-col ap-before"><div class="ap-col-h">지금 라이브 모습 (기존)</div>
        ${cell(c.before)}</div>` : ''}
    </div>
    ${c.note   ? `<div class="ap-note">${esc(c.note)}</div>` : ''}
    ${c.reason ? `<div class="ap-reason">${esc(c.reason)}</div>` : ''}
  </div>`;
}

/* ── 저장 폴더 기억 (File System Access API) ────────────────────────────────
   사용자 지정 2026-08-03: 피드백 내보내기는 제안 파일과 같은 폴더로 간다.
     C:\Users\Yongj\OneDrive\1_DXD Computer\0_PracExam\Production Files\claude proposal
   폴더를 한 번 지정하면 핸들을 IndexedDB 에 보관해 다음부터 자동 저장한다.
   브라우저가 이 API 를 지원하지 않으면 기존 다운로드 방식으로 물러난다. */
const AP_DIR_DB = 'reviewAppDir', AP_DIR_KEY = 'feedbackDir';
const AP_DIR_LABEL = 'Production Files\\claude proposal';

function apIdb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(AP_DIR_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function apDirGet(){
  try {
    const db = await apIdb();
    return await new Promise((res) => {
      const rq = db.transaction('h').objectStore('h').get(AP_DIR_KEY);
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => res(null);
    });
  } catch(e){ return null; }
}
async function apDirPut(h){
  try {
    const db = await apIdb();
    await new Promise((res) => {
      const rq = db.transaction('h', 'readwrite').objectStore('h').put(h, AP_DIR_KEY);
      rq.onsuccess = rq.onerror = () => res();
    });
  } catch(e){ console.warn('폴더 핸들 저장 실패:', e); }
}
function apDirSupported(){ return typeof window.showDirectoryPicker === 'function'; }

async function apDirEnsure(interactive){
  if (!apDirSupported()) return null;
  let h = await apDirGet();
  if (h){
    let perm = await h.queryPermission({ mode:'readwrite' });
    if (perm !== 'granted' && interactive) perm = await h.requestPermission({ mode:'readwrite' });
    if (perm === 'granted') return h;
    if (!interactive) return null;
  }
  if (!interactive) return null;
  try {
    h = await window.showDirectoryPicker({ id:'claudeProposal', mode:'readwrite' });
  } catch(e){ return null; }               // 사용자가 취소
  await apDirPut(h);
  return h;
}
async function apDirShow(){
  const el = $('apDirInfo');
  if (!el) return;
  if (!apDirSupported()){
    el.style.display = '';
    el.innerHTML = '<span style="color:#a33">이 브라우저는 폴더 지정을 지원하지 않습니다 — 내보내기는 다운로드 폴더로 갑니다. ' +
                   'Chrome 또는 Edge 로 열면 <b>' + esc(AP_DIR_LABEL) + '</b> 에 바로 저장됩니다.</span>';
    return;
  }
  const h = await apDirGet();
  el.style.display = '';
  el.innerHTML = h
    ? '저장 폴더: <b>' + esc(h.name) + '</b> — 내보내기가 이 폴더에 바로 저장됩니다.'
    : '<span style="color:#a33">저장 폴더가 아직 지정되지 않았습니다.</span> [저장 폴더] 를 눌러 <b>' +
      esc(AP_DIR_LABEL) + '</b> 을 선택해 주세요.';
}

/* 내보내기가 끝나면 그 묶음을 '검토 완료'로 표시한다 */
function apMarkExported(batch, n){
  const store = apLoadStore();
  const b = store.batches[batch] || (store.batches[batch] = { feedback:{} });
  b.exportedAt = new Date().toISOString();
  b.exportedCount = n;
  b.dirtySinceExport = false;
  apSaveStore(store);
  loadApprovalsInfo();
}

async function apExport(){
  const fb = apFb();
  const items = (S.proposal && S.proposal.items ? S.proposal.items : [])
    .map(it => ({
      id: String(it.id),
      decision: fb[it.id] ? (fb[it.id].decision || null) : null,
      feedback: fb[it.id] ? (fb[it.id].feedback || '') : '',
      at:       fb[it.id] ? (fb[it.id].at || null) : null
    }))
    .filter(x => x.decision || x.feedback);

  if (!items.length){ alert('내보낼 판정·피드백이 아직 없습니다.'); return; }

  const batch = (S.proposal && S.proposal.batch) || 'batch';
  const name  = `review_feedback_${batch}.json`;
  const out   = { batch, exported_at: new Date().toISOString(), count: items.length, items };
  const text  = JSON.stringify(out, null, 1);

  // ① 지정된 폴더에 바로 저장 (없으면 이때 한 번 물어본다)
  const dir = await apDirEnsure(true);
  if (dir){
    try {
      /* 🔴 2026-08-07 — 남의 회신을 덮어쓰지 않는다.
         파일명은 묶음 이름으로 정해지므로, 예전 세션에서 같은 묶음을 검토해 둔 회신이 있으면
         그대로 덮어써서 **지난 검토 기록이 사라진다**(실제로 review_feedback_2026-08-01-calcqc-r2
         가 이렇게 지워졌다). 이 브라우저가 만든 기록이 있을 때만 덮어쓰고, 아니면 새 이름으로 쓴다.
         같은 자리에서 다시 내보내는 정상 흐름은 그대로 덮어쓰므로 파일이 늘지 않는다. */
      const mine = !!(apLoadStore().batches[batch] || {}).exportedAt;
      let fname = name;
      if (!mine){
        let taken = true;
        try { await dir.getFileHandle(name); } catch(e){ taken = false; }
        if (taken){
          const d = new Date(), p = (n) => String(n).padStart(2, '0');
          fname = `review_feedback_${batch}__${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}` +
                  `-${p(d.getHours())}${p(d.getMinutes())}.json`;
        }
      }
      const fh = await dir.getFileHandle(fname, { create:true });
      const w  = await fh.createWritable();
      await w.write(text); await w.close();
      await apDirShow();
      apMarkExported(batch, items.length);
      alert(`저장했습니다 — ${dir.name} 폴더의 ${fname}\n(${items.length}건)\n\n` +
            (fname !== name
              ? `※ 예전에 같은 묶음을 검토한 회신이 이미 있어서, 그것을 지우지 않으려고\n` +
                `   새 이름으로 저장했습니다.\n\n`
              : '') +
            `이 묶음은 이제 '✅ 검토 완료' 로 표시됩니다.\n` +
            `다시 열면 "이미 검토를 마쳤습니다" 라고 먼저 알려 드립니다.`);
      return;
    } catch(e){
      console.warn('폴더 저장 실패, 다운로드로 대체:', e);
    }
  }

  // ② 폴백 — 기존 다운로드
  const blob = new Blob([text], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  apMarkExported(batch, items.length);
  alert(`다운로드 폴더에 저장했습니다 — ${name}\n\n` +
        `${AP_DIR_LABEL} 로 옮겨 주시거나, ea_generator 에서\n  py collect_feedback.py\n를 실행하면 자동으로 옮겨집니다.`);
}

/* ── 검토 이력 ──────────────────────────────────────────────────────────────
   "이 묶음은 검토했던가?" 를 폴더의 파일 더미가 아니라 여기서 확인한다.
   제안 원문은 담지 않는다(용량) — 판정 요약만 보관하므로 가볍다. */
function apHistRows(){
  const store = apLoadStore();
  return Object.keys(store.batches).map(nm => {
    const b = store.batches[nm] || {};
    const f = b.feedback || {};
    let pass = 0, hold = 0, reject = 0;
    Object.keys(f).forEach(k => {
      const d = f[k].decision;
      if (d === 'pass') pass++; else if (d === 'hold') hold++; else if (d === 'reject') reject++;
    });
    return { name:nm, b, pass, hold, reject,
             done: pass + hold + reject,
             total: b.total || 0,
             when: b.exportedAt || b.openedAt || '',
             cur: store.current === nm };
  }).sort((x, y) => String(y.when).localeCompare(String(x.when)));
}

function apShowHist(){
  const rows = apHistRows();
  const back = document.createElement('div');
  back.className = 'aph-back';
  back.innerHTML = `

              ${r.b.dirtySinceExport ? ' · <span class="ap-redo">내보낸 뒤 수정함</span>' : ''}
              <br>판정 <b>${r.done}</b>${r.total ? ' / ' + r.total : ''}건

$('apHist').addEventListener('click', apShowHist);

/* ── 데이터 로드 ─────────────────────────────────────────────────────────── */
async function loadExam(){
  if (S.pool === 'approve') return loadApprovals();
  if (S.pool === 'warroom') return loadWarRoom();
  $('qlist').innerHTML = '<div class="list-empty">불러오는 중…</div>';
  $('detail').innerHTML = '<div class="empty-detail">왼쪽 목록에서 문항을 선택하세요.</div>';

  // ★ exam + pool 스코프 — 이 두 필터가 빠지면 다른 시험 문항까지 딸려옵니다.
  //
  // ⚠️ PostgREST 는 한 번에 최대 1000행만 돌려줍니다. EA study 만 4,000행이 넘어
  //    .range() 로 나눠 받지 않으면 question_id 순서상 앞쪽(Part 1)만 실려옵니다.
  const PAGE = 1000;
  const COLS = 'question_id, source_qid, part, topic, outline_code, difficulty, text, options, correct, ' +
               'explanation, examtip, explanation_en, examtip_en, is_active';
  const virt = EXAMS[S.exam].virtual || null;   // NA 가상 시험이면 실제로 읽을 exam 이 따로 있음
  let rows = [], from = 0, error = null;

  for(;;){
    let q = sb
      .from('questions')
      .select(COLS)
      .eq('exam', virt ? virt.readExam : S.exam)
      .eq('pool', S.pool);
    if (virt) q = q.like('question_id', virt.idPrefix + '%');   // 그 주의 national 문항만

    const res = await q.order('question_id').range(from, from + PAGE - 1);

    if (res.error){ error = res.error; break; }
    const batch = res.data || [];
    rows = rows.concat(batch);
    $('qlist').innerHTML = `<div class="list-empty">불러오는 중… ${rows.length}문항</div>`;
    if (batch.length < PAGE) break;      // 마지막 페이지
    from += PAGE;
    if (from > 100000) break;            // 안전장치 (무한루프 방지)
  }

  if (error){
    // 42501 = permission denied. questions 는 관리자 계정만 읽을 수 있습니다.
    const denied = error.code === '42501' || /permission denied/i.test(error.message || '');
    $('qlist').innerHTML = denied
      ? `<div class="list-empty"><b>문항을 읽을 권한이 없습니다.</b><br><br>
           <code>questions</code> 는 관리자 계정만 조회할 수 있습니다.<br>
           현재 로그인: <b>${esc(S.user.email || '-')}</b><br><br>
           관리자 계정으로 다시 로그인하세요.</div>`
      : `<div class="list-empty">문항을 불러오지 못했습니다.<br><br>${esc(error.message)}</div>`;
    return;
  }

  // NA 모드: 판정 키를 원본 national id(source_qid)로 정규화한다.
  // 이렇게 해두면 이후 모든 로직(목록·판정·집계)이 그대로 동작하고,
  // 판정 1건이 4개 주 복제본 전부를 대표하게 된다.
  if (virt){
    rows.forEach(r => {
      r.state_qid   = r.question_id;                    // 실제 DB 행 id (참고용)
      r.question_id = r.source_qid || r.question_id;    // 판정 키 = RE-N-####
    });
  }

  S.rows = rows;
  await loadVerdicts();
  buildFilters();
  renderList();
  renderStrip();
}

async function loadVerdicts(){
  S.verdicts = {};
  // questions 와 같은 이유로 페이지 분할 — 판정이 1000건을 넘으면 잘립니다.
  const PAGE = 1000;
  let from = 0;

  for(;;){
    const { data, error } = await sb
      .from('review_verdicts')
      .select('question_id, verdict, note')
      .eq('exam', vScope())
      .eq('reviewer_id', S.user.id)
      .order('question_id')
      .range(from, from + PAGE - 1);

    if (error){
      // 테이블 미생성 등 — 판정만 비활성화하고 열람은 계속 가능하게 둡니다.
      console.warn('review_verdicts 읽기 실패:', error.message);
      S.verdictsError = error.message;
      return;
    }
    const batch = data || [];
    batch.forEach(v => { S.verdicts[v.question_id] = { verdict:v.verdict, note:v.note || '' }; });
    if (batch.length < PAGE) break;
    from += PAGE;
    if (from > 100000) break;
  }
  S.verdictsError = null;
}

/* ── 필터 ────────────────────────────────────────────────────────────────── */
function buildFilters(){
  const parts = EXAMS[S.exam].parts;
  const usedParts = [...new Set(S.rows.map(r => r.part).filter(p => p != null))].sort();
  $('fPart').innerHTML = '<option value="">전체 파트</option>' +
    usedParts.map(p => `<option value="${p}">${esc(parts[p] || ('Part ' + p))}</option>`).join('');

  const topics = [...new Set(S.rows.map(r => r.topic).filter(Boolean))].sort();
  $('fTopic').innerHTML = '<option value="">전체 토픽</option>' +
    topics.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
}

['fPart','fVerdict','fTopic'].forEach(id => $(id).addEventListener('change', renderList));
let searchTimer = null;
$('fSearch').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderList, 180);
});

function filteredRows(){
  const part = $('fPart').value;
  const vf   = $('fVerdict').value;
  const tp   = $('fTopic').value;
  const q    = $('fSearch').value.trim().toLowerCase();

  return S.rows.filter(r => {
    if (part && String(r.part) !== part) return false;
    if (tp && r.topic !== tp) return false;
    if (vf){
      const v = S.verdicts[r.question_id];
      if (vf === 'todo'){ if (v) return false; }
      else if (!v || v.verdict !== vf) return false;
    }
    if (q){
      const hay = [r.question_id, r.text, r.explanation, r.topic, r.outline_code, r._search]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ── 목록 ────────────────────────────────────────────────────────────────── */
function renderList(){
  const rows = filteredRows();
  const list = $('qlist');

  if (!rows.length){
    list.innerHTML = S.rows.length
      ? '<div class="list-empty">조건에 맞는 문항이 없습니다.</div>'
      : `<div class="list-empty"><b>${esc(EXAMS[S.exam].label)} · ${esc(POOLS[S.pool])}</b> 문항이 아직 없습니다.` +
        (S.pool === 'mock'
          ? '<br><br>이 시험에는 모의고사 풀(pool=mock)이 적재되지 않았습니다.'
          : (EXAMS[S.exam].virtual
              ? '<br><br>national 문항을 <code>--fanout all</code> 로 업로드하면 여기에 표시됩니다.'
              : '<br><br>Supabase 업로드 후 다시 확인하세요.')) + '</div>';
    return;
  }

  list.innerHTML = rows.map(r => {
    const v = S.verdicts[r.question_id];
    const cls = v ? v.verdict : '';
    return `<button class="qrow ${r.question_id === S.currentId ? 'active' : ''}" data-id="${esc(r.question_id)}">
      <span class="qrow-dot ${cls}"></span>
      <span class="qrow-main">
        <span class="qrow-id">${esc(r.question_id)}${r.topic ? ' · ' + esc(r.topic) : ''}</span>
        <span class="qrow-text">${esc(r.text || '')}</span>
      </span>
    </button>`;
  }).join('');

  list.querySelectorAll('.qrow').forEach(b => {
    b.addEventListener('click', () => selectQuestion(b.dataset.id));
  });
}

function renderStrip(){
  let pass = 0, hold = 0, reject = 0;
  S.rows.forEach(r => {
    const v = S.verdicts[r.question_id];
    if (!v) return;
    if (v.verdict === 'pass') pass++;
    else if (v.verdict === 'hold') hold++;
    else if (v.verdict === 'reject') reject++;
  });
  const total = S.rows.length;
  const done  = pass + hold + reject;
  const pct   = total ? Math.round(done / total * 100) : 0;

  $('lPass').textContent   = vlab('pass');
  $('lHold').textContent   = vlab('hold');
  $('lReject').textContent = vlab('reject');
  $('cPass').textContent   = pass;
  $('cHold').textContent   = hold;
  $('cReject').textContent = reject;
  $('cTodo').textContent   = total - done;
  $('pbarFill').style.width = pct + '%';
  $('pctTxt').textContent   = pct + '%';
  $('hdrStat').innerHTML    = `<b>${done}</b> / ${total}`;
}

/* ── 상세 ────────────────────────────────────────────────────────────────── */
async function selectQuestion(id){
  if (id !== S.currentId && !await confirmDiscard()) return;
  /* 🔴 수정 칸은 문항마다 새로 연다 — 열어 둔 채 옮기면 «앞 문항의 글»이 남는다 */
  if (id !== S.currentId){ S.editing = false; S.edDirty = false; }
  S.currentId = id;
  document.getElementById('main').classList.add('detail-open');
  renderList();
  renderDetail();
  $('paneDetail').scrollTop = 0;
}

function renderDetail(){
  const r = S.rows.find(x => x.question_id === S.currentId);
  if (!r){ $('detail').innerHTML = '<div class="empty-detail">문항을 찾을 수 없습니다.</div>'; return; }

  const v = S.verdicts[r.question_id] || { verdict:null, note:'' };
  let mainHtml;

  if (r.is_ap){
    /* Claude 제안 — 승인·피드백을 받는다.
       🔴 2026-08-24 사용자 지시 — 그리는 차례는 «새 글이 먼저»다.
          "제일 위에 보여주는 문제는 옛날 원문이 아니라 «새롭게 변경될 문제»를 보여 주어야
           보고 승인을 하지요? 승인해달라는 문제는 작은글씨로 밑에다가 넣으면 승인을
           해달라는 의미인지, 숨기고자 하는 의미인지?"
          ① 반영본(apDiff) → ② 제안 이유 → ③ 지금 라이브 모습(apContext).
          이 차례를 되돌리지 말 것. 치트시트 쪽(apSheet)은 처음부터 이 차례였다. */

      <div class="question-meta">
        <span class="q-badge">${esc(it.id)}</span>
        ${it.part  ? `<span class="q-badge q-badge-gray">Part ${esc(it.part)}</span>` : ''}
        ${it.topic ? `<span class="q-badge q-badge-gray">${esc(it.topic)}</span>` : ''}
        <span class="q-badge ${applied ? 'ap-applied' : 'ap-pending'}">${
          applied ? '적용 완료 · 사후 검토' : '적용 전 · 승인 필요'}</span>
        <button class="btn back-btn" id="btnBack" style="margin-left:auto;padding:7px 13px;">← 목록</button>
      </div>
      <div class="question-text" style="font-size:calc(18px * var(--fs));margin-bottom:10px;">${esc(it.title || '')}</div>
      ${it.kind === 'sheet' ? apSheet(it.sheet) : ''}
      ${(it.changes || []).map(apDiff).join('')}
      ${it.why ? `<div class="ap-why"><div class="ap-h">제안 이유</div>
        <div class="ap-body">${esc(it.why)}</div></div>` : ''}
      ${apContext(it.context)}
      ${(it.contexts || []).map(apContext).join('')}
      ${it.note ? `<div class="ap-why"><div class="ap-h">참고</div>
        <div class="ap-body">${esc(it.note)}</div></div>` : ''}
    </div>`;
  } else if (r.is_wr){
    /* War Room 치트시트 — 🖥 **실제 pracexam.com 화면과 같은 꼴**로 그린다.
       🔴 2026-08-30 사장님 지적 = "review_app에서 보는 War Room은 실제 화면과 다릅니다."
          까닭 = 여기 CSS 가 «따로» 있었다(15.5px·teal 제목·표 테두리가 달랐다).
          이제 `wrRealHtml()` 이 app.html 의 겉모습을 그대로 쓴다.

    const body  = S.lang === 'en' ? (r.body_en || '') : (r.body_ko || '');
    mainHtml = `
    <div class="question-card">

    ${wrRealHtml(title, body)}`;
  } else {
    const opts = Array.isArray(r.options) ? r.options : [];

        ? '피드백을 자유롭게 적으세요. 길이 제한 없습니다 — 다른 AI(Gemini 등)에게 받은 답변을 통째로 붙여넣어도 그대로 전달됩니다.'
        : '문제점·수정 지시를 적어두세요. 생성 파이프라인에서 이 메모를 보고 재작업합니다.'}">${esc(v.note)}</textarea>
      ${ap && staleNote ? `<div class="ap-stale" id="apStale">
        지난 회신에 적으신 글이 그대로 남아 있습니다 — 두면 이번 회신에도 함께 나갑니다.
        <button class="btn" id="apClearNote">비우기</button></div>` : ''}
      ${ap ? '<div class="ap-count" id="apCount"></div>' : ''}
      <div class="verdict-foot">
        <button class="btn" id="btnPrev">← 이전</button>
        <button class="btn" id="btnNext">다음 →</button>
        <button class="btn primary" id="btnSave">저장</button>
        <span class="save-state" id="saveState"></span>
      </div>
      ${S.verdictsError
        ? `<div class="msg err show" style="margin-top:10px">판정을 저장할 수 없습니다: ${esc(S.verdictsError)}<br>
             <code>migration_review_verdicts.sql</code> 을 먼저 실행하세요.</div>`
        : ''}
      <div class="hint">
        <kbd>1</kbd> 합격 · <kbd>2</kbd> 보류 · <kbd>3</kbd> 탈락 ·
        <kbd>Q</kbd>/<kbd>W</kbd> 이전/다음 · <kbd>Ctrl+S</kbd> 저장
        <br>판정 버튼을 누르면 메모와 함께 바로 저장되고 다음 문항으로 넘어갑니다.
      </div>
    </div>`;

  // ✏️ 직접 수정 — 열고 닫기·저장·경고
  const edb = $('btnEdit');
  if (edb) edb.addEventListener('click', () => {
    if (S.editing && S.edDirty &&
        !confirm('고쳐 놓고 저장하지 않은 것이 있습니다. 버리고 닫을까요?')) return;
    S.editing = !S.editing;
    S.edDirty = false;
    renderDetail();
    const card = $('edCard');
    if (card) card.scrollIntoView({ behavior:'smooth', block:'start' });
  });
  if (S.editing && $('edCard')){
    $('edCancel').addEventListener('click', () => {
      if (S.edDirty && !confirm('고쳐 놓고 저장하지 않은 것이 있습니다. 버릴까요?')) return;
      S.editing = false; S.edDirty = false; renderDetail();
    });
    $('edSaveBtn').addEventListener('click', edSave);
    const pv = $('edPrevBtn');
    if (pv) pv.addEventListener('click', () => (r.is_wr ? edShowPreview : qShowPreview)(r, 'check'));
    $('edCard').querySelectorAll('.ed-in, input[name="edCorrect"]').forEach(el => {
      el.addEventListener('input',  () => edWarnCheck(r));
      el.addEventListener('change', () => edWarnCheck(r));
    });
    edWarnCheck(r);
  }

  /* 🔴 실제 화면과 같아지려면 «표 감싸기»까지 해야 한다(app.html _wrPostProcess).
     이것을 빼면 넓은 표가 카드 밖으로 삐져나온다 — 실제 화면에서는 안 그런다. */
  wrPost($('detail'));

  // 이벤트 바인딩
  const back = $('btnBack');
  if (back) back.addEventListener('click', () => document.getElementById('main').classList.remove('detail-open'));

  $('detail').querySelectorAll('.lang-toggle button').forEach(b => {
    b.addEventListener('click', () => { S.lang = b.dataset.lang; renderDetail(); });
  });
  $('detail').querySelectorAll('.vbtn').forEach(b => {
    b.addEventListener('click', () => saveVerdict(b.dataset.v, true));
  });
  $('btnSave').addEventListener('click', () => saveVerdict(null, false));
  $('btnPrev').addEventListener('click', () => step(-1));
  $('btnNext').addEventListener('click', () => step(1));
  // 긴 피드백을 편하게 — 입력에 따라 높이를 늘리고 글자 수를 보여준다
  const grow = () => {
    const t = $('vnote');
    if (!t) return;
    if (isAp()){
      t.style.height = 'auto';
      t.style.height = Math.min(Math.max(t.scrollHeight, 220), 900) + 'px';
      const c = $('apCount');
      if (c) c.textContent = t.value.length ? t.value.length.toLocaleString() + '자' : '';
    }
  };
  $('vnote').addEventListener('input', () => { S.dirty = true; setSaveState('', ''); grow(); });
  const clr = $('apClearNote');
  if (clr) clr.addEventListener('click', () => {
    const t = $('vnote');
    if (t) t.value = '';
    S.dirty = true;
    const hint = $('apStale');
    if (hint) hint.remove();
    setSaveState('글을 비웠습니다 · 판정을 누르면 저장됩니다', '');
    grow();
    if (t) t.focus();
  });
  grow();
}

/* ══════════════════════════════════════════════════════════════════════════
   ✏️ 직접 수정 — 사장님이 손수 고쳐 그 자리에서 라이브에 올린다
   2026-08-30 사장님 지시:
     "일부 오타나 내가 수정할 수 있는 것은 review_app에서 내가 직접 수정하고
      업데이트 하는 기능을 만들어 주세요. 업데이트 되면 그 내용은 로그에 남아서
      나중에 Claude code가 작업할때 매뉴얼 수정이 된 부분이라는 것을 공유할 수
      있도록 해주세요"

   ▸ 저장은 RPC 로만 간다 — 표에 직접 쓰지 않는다(위 머리 주석 참조).
   ▸ 고친 칸마다 manual_edits 에 한 줄이 남고, Claude 는 `py manual_edits.py` 로
     그것을 읽는다. 창을 열 때 px_start.py 가 「손으로 고쳐진 자리」를 보여 준다.
   🔴 아래 칸 목록은 SQL 함수 안의 «흰 목록»과 같아야 한다. 한쪽만 늘리면
      화면에는 칸이 생기는데 저장에서 FIELD_NOT_EDITABLE 로 떨어진다.
   ══════════════════════════════════════════════════════════════════════════ */

/* [칸이름, 라벨, 꼴, 줄수] */
const ED_Q_TEXT = [
  ['explanation',    '해설 (국문)',   10],
  ['examtip',        '시험 팁 (국문)', 5],
  ['explanation_en', '해설 (영문)',   10],
  ['examtip_en',     '시험 팁 (영문)', 5]
];
const ED_W_FIELDS = [
  ['title_ko', '제목 (국문)',        'line',  0],
  ['title_en', '제목 (영문)',        'line',  0],
  ['body_ko',  '본문 (국문 · HTML)', 'area', 18],
  ['body_en',  '본문 (영문 · HTML)', 'area', 18]
];

/* 승인 대기 모드는 «파일»을 보는 자리라 고칠 표가 없다 */
const edCanEdit = () => !isAp() && !!S.currentId;

function edBtn(){
  if (!edCanEdit()) return '';
  return '<button class="btn ed-open" id="btnEdit">' +
         (S.editing ? '✕ 수정 닫기' : '✏️ 직접 수정') + '</button>';
}

function edArea(f, label, val, rows){
  return '<label class="ed-f"><span class="ed-l">' + esc(label) + '</span>' +
    '<textarea class="ed-in" id="ed_' + f + '" data-f="' + f + '" rows="' + rows + '">' +
    esc(val || '') + '</textarea></label>';
}
function edLine(f, label, val){
  return '<label class="ed-f"><span class="ed-l">' + esc(label) + '</span>' +
    '<input class="ed-in" id="ed_' + f + '" data-f="' + f + '" value="' + esc(val || '') + '"></label>';
}

function edForm(r){
  if (!S.editing) return '';
  const L = ['A','B','C','D','E','F'];
  let body;

  if (r.is_wr){
    body = ED_W_FIELDS.map(x => x[2] === 'area'
      ? edArea(x[0], x[1], r[x[0]], x[3])
      : edLine(x[0], x[1], r[x[0]])).join('');
  } else {
    const opts = Array.isArray(r.options) ? r.options : [];
    body = edArea('text', '지문', r.text, 6)
      + '<div class="ed-f"><span class="ed-l">보기 · 왼쪽 동그라미가 «정답»입니다</span><div id="edOpts">'
      + opts.map((o, i) =>
          '<div class="ed-opt"><label class="ed-key">' +
          '<input type="radio" name="edCorrect" value="' + i + '"' + (i === r.correct ? ' checked' : '') + '>' +
          '<span>' + (L[i] || (i + 1)) + '</span></label>' +
          '<textarea class="ed-in ed-optin" data-oi="' + i + '" rows="2">' + esc(o) + '</textarea></div>').join('')
      + '</div></div>'
      + edLine('topic', '토픽(이름표)', r.topic)
      + ED_Q_TEXT.map(x => edArea(x[0], x[1], r[x[0]], x[2])).join('');
  }

  return '<div class="ed-card" id="edCard">' +
    '<div class="ed-h">고치고 <b>저장</b>을 누르면 <b>라이브에 바로 반영</b>됩니다. ' +
    '승인 절차를 거치지 않으니 오타·표현처럼 <b>확실한 것</b>만 손보십시오.<br>' +
    '고친 칸은 <b>수정 이력</b>에 남아 다음에 Claude 가 그대로 읽습니다.</div>' +
    body +
    '<div class="ed-h" style="background:#EDF4F3;color:#2b4a4e">' +
      '🖥 <b>저장하기 전에 미리보기가 한 번 뜹니다.</b> 실제 고객 화면과 같은 꼴로 보여 드리고, ' +
      (r.is_wr ? 'HTML 태그가 어긋났는지도' : '문단이 붙어 있는지·세미콜론이 남았는지도') +
      ' 함께 알려 드립니다. 보시고 <b>[이대로 저장]</b> 을 누르셔야 올라갑니다.</div>' +
    '<label class="ed-f"><span class="ed-l">메모 — 왜 고쳤는지 (안 적으셔도 됩니다)</span>' +
    '<input class="ed-in" id="ed_note" placeholder="예: 오타 · 금액 오기 · 표현 다듬음"></label>' +
    '<div class="ed-warn" id="edWarn"></div>' +
    '<div class="ed-foot">' +
    '<button class="btn" id="edCancel">취소</button>' +
    '<button class="btn" id="edPrevBtn">👁 미리보기</button>' +
    '<button class="btn primary" id="edSaveBtn">미리보기 → 저장</button>' +
    '<span class="save-state" id="edState"></span></div></div>';
}

/* 칸에 적힌 것을 그대로 걷는다 */
function edCollect(r){
  const out = {};
  const card = $('edCard');
  if (!card) return out;
  card.querySelectorAll('[data-f]').forEach(el => { out[el.dataset.f] = el.value; });
  if (!r.is_wr){
    const ta = card.querySelectorAll('.ed-optin');
    if (ta.length) out.options = Array.prototype.map.call(ta, t => t.value);
    const rd = card.querySelector('input[name="edCorrect"]:checked');
    if (rd) out.correct = Number(rd.value);
  }
  return out;
}

/* «진짜 바뀐 것»만 남긴다 — 안 바꾼 칸까지 보내면 이력이 헛것으로 찬다 */
function edDiff(r, all){
  const f = {};
  const norm = (v) => Array.isArray(v) ? JSON.stringify(v) : String(v == null ? '' : v);
  Object.keys(all).forEach(k => { if (norm(all[k]) !== norm(r[k])) f[k] = all[k]; });
  return f;
}

/* 저장 «전»에 눈에 띄게 알린다 — 막지는 않는다 */
function edWarnCheck(r){
  const box = $('edWarn');
  if (!box) return;
  const ch = edDiff(r, edCollect(r));
  const keys = Object.keys(ch);
  S.edDirty = keys.length > 0;
  const msgs = [];

  /* 세미콜론 전면 금지 (2026-08-27 사장님 지시) */
  const semi = keys.filter(k => {
    const v = ch[k];
    return (Array.isArray(v) ? v.join(' ') : String(v || '')).indexOf(';') >= 0;
  });
  if (semi.length) msgs.push('세미콜론(;) 이 들어 있습니다 — 집 규칙은 전면 금지입니다. ' +
    '쉼표나 - 로 바꿔 주십시오. (' + semi.join(', ') + ')');

  /* 한쪽 언어만 고치면 국문·영문이 어긋난다 — 실제로 여러 번 났다 */
  const KO = ['explanation','examtip','title_ko','body_ko'];
  const EN = ['explanation_en','examtip_en','title_en','body_en'];
  const hasKo = KO.some(k => keys.indexOf(k) >= 0);
  const hasEn = EN.some(k => keys.indexOf(k) >= 0);
  if (hasKo && !hasEn) msgs.push('국문만 고치셨습니다 — 같은 자리의 영문도 보십시오.');
  if (hasEn && !hasKo) msgs.push('영문만 고치셨습니다 — 같은 자리의 국문도 보십시오.');

  /* 정답키를 옮기면 해설의 「정답은 X입니다」가 옛 답을 가리킨다 */
  if (keys.indexOf('correct') >= 0) msgs.push('정답키를 옮기셨습니다 — 해설 첫 줄의 ' +
    '「정답은 X입니다 / The correct answer is X」도 함께 고치셔야 합니다.');

  box.innerHTML =
    (keys.length
      ? '<div class="ed-ok">바뀐 칸 <b>' + keys.length + '</b>개 — ' + esc(keys.join(', ')) + '</div>'
      : '<div class="ed-none">아직 바뀐 것이 없습니다.</div>') +
    msgs.map(m => '<div class="ed-w">⚠️ ' + esc(m) + '</div>').join('');
}

function edState(text, cls){
  const el = $('edState');
  if (el){ el.textContent = text; el.className = 'save-state ' + (cls || ''); }
}

/* 저장이 막혔을 때 «무엇을 하면 되는지»까지 적는다 */
function edErrMsg(err){
  const m = (err && (err.message || err.hint)) || '알 수 없는 오류';
  if (/NOT_AUTHORIZED/.test(m))
    return '권한이 없습니다 — 관리자 계정으로 로그인하셨는지 보십시오.';
  if (/FIELD_NOT_EDITABLE/.test(m))
    return '이 칸은 고칠 수 없게 막아 둔 칸입니다: ' + m;
  if (/NOT_FOUND/.test(m))
    return '그 번호를 표에서 찾지 못했습니다: ' + m;
  if (err && (err.code === 'PGRST202' || /Could not find the function/i.test(m)))
    return 'DB 함수가 아직 없습니다 — supabase\\sql\\manual_edits.sql 을 SQL Editor 에서 한 번 실행하십시오.';
  return '저장하지 못했습니다: ' + m;
}

/* 🔴 2026-08-30 사장님 지시 — «미리보기를 보고 확인한 뒤» 저장한다.
      "저장 전에 미리 보기를 보고 확인을 하고 저장하는 것이 필요합니다."
      "연습문제, Mock도 미리보기 만들어 주세요"
   치트시트와 문항은 «보는 것»이 다르다 —
     치트시트  HTML 이라 태그 하나가 어긋나면 고객 화면이 무너진다  → 태그 짝을 센다
     문항      평문이라 태그 위험이 없다(전수 0건)                 → 줄바꿈·문단을 본다
   그래서 미리보기도 둘로 갈라 두었다. 하나로 합치지 말 것. */
async function edSave(){
  const r = S.rows.find(x => x.question_id === S.currentId);
  if (!r) return;
  if (!Object.keys(edDiff(r, edCollect(r))).length){ edState('바뀐 것이 없습니다.', ''); return; }
  const show = r.is_wr ? edShowPreview : qShowPreview;
  show(r, 'save', (close) => edDoSave(r, close));
}

async function edDoSave(r, close){
  const ch = edDiff(r, edCollect(r));
  const keys = Object.keys(ch);
  if (!keys.length){ edState('바뀐 것이 없습니다.', ''); if (close) close(); return; }

  const noteEl = $('ed_note');
  const note = noteEl && noteEl.value.trim() ? noteEl.value.trim() : null;

  edState('저장 중…', '');
  const fn   = r.is_wr ? 'admin_save_sheet' : 'admin_save_question';
  const args = r.is_wr
    ? { p_outline_code: r.question_id, p_fields: ch, p_note: note }
    : { p_question_id:  r.question_id, p_fields: ch, p_note: note };

  const { data, error } = await sb.rpc(fn, args);
  if (error){
    edState(edErrMsg(error), 'err');
    /* 🔴 미리보기 창을 «닫지 않는다» — 닫으면 오류 글이 뒤에 가려 안 보인다 */
    const st = $('edpState');
    if (st){ st.textContent = edErrMsg(error); st.className = 'save-state err'; }
    return;
  }
  if (close) close();

  /* 화면의 자료도 함께 고쳐 둔다 — 다시 불러올 것 없이 그 자리에서 맞는다 */
  keys.forEach(k => { r[k] = ch[k]; });
  if (r.is_wr) r.text = r.title_en || r.title_ko || '';

  const n = (data && typeof data.changed === 'number') ? data.changed : keys.length;
  S.editing  = false;
  S.edDirty  = false;
  renderList();
  renderDetail();
  setSaveState('✅ ' + n + '개 칸을 저장했습니다 · 라이브에 반영되었습니다', 'ok');
}

/* ── 수정 이력 ─────────────────────────────────────────────────────────────
   Claude 가 `py manual_edits.py` 로 읽는 것과 «같은 표»를 봅니다. */
async function edShowHist(){
  const back = document.createElement('div');
  back.className = 'aph-back';
  back.innerHTML = '<div class="aph-box"><div class="aph-h"><b>✏️ 수정 이력</b>' +
    '<button class="btn" id="edhClose">닫기</button></div>' +
    '<div class="aph-body" id="edhBody">불러오는 중…</div></div>';
  document.body.appendChild(back);
  const close = () => back.remove();
  back.querySelector('#edhClose').addEventListener('click', close);
  back.addEventListener('click', (e) => { if (e.target === back) close(); });

  const { data, error } = await sb.rpc('admin_manual_edits', { p_limit: 200 });
  const body = back.querySelector('#edhBody');
  if (error){
    body.innerHTML = '<div class="aph-empty">' + esc(edErrMsg(error)) + '</div>';
    return;
  }
  const rows = data || [];
  if (!rows.length){
    body.innerHTML = '<div class="aph-empty">아직 손으로 고치신 것이 없습니다.</div>';
    return;
  }
  const cut = (t) => { const s = String(t == null ? '' : t); return s.length > 400 ? s.slice(0, 400) + ' …' : s; };
  body.innerHTML =
    '<div class="aph-hint">여기 기록은 <b>Supabase 에 남습니다</b> — 이 브라우저만의 것이 아닙니다.<br>' +
    'Claude 는 창을 열 때 이것을 읽고 「사장님이 손으로 고치신 자리」로 압니다.</div>' +
    rows.map(m =>
      '<div class="edh-row"><div class="edh-top">' +
      '<span class="edh-id">' + esc(m.target_id) + '</span>' +
      '<span class="edh-field">' + esc(m.field) + '</span> · ' +
      esc(apWhen(m.edited_at)) + (m.note ? ' · ' + esc(m.note) : '') +
      '</div>' +
      '<div class="edh-b">' + esc(cut(m.before_val)) + '</div>' +
      '<div class="edh-a">' + esc(cut(m.after_val)) + '</div></div>').join('');
}
$('edHistBtn').addEventListener('click', edShowHist);


/* ══════════════════════════════════════════════════════════════════════════
   🖥 실제 앱과 «같은» War Room 렌더 (2026-08-30 사장님 지적)
   실제 화면(`app.html` wrShow)이 하는 일은 셋이다. 셋을 다 해야 같아진다 —
     ① _wrNbspJoin  「Form §1031」처럼 붙는 자리의 공백을 줄바꿈 안 되는 공백으로
     ② <div class="wr-body"> 안에 넣는다
     ③ _wrPostProcess  표를 .wr-tblwrap 으로 감싼다(넓은 표가 가로 스크롤된다)
   하나라도 빠뜨리면 «비슷한데 다른» 화면이 된다.
   ══════════════════════════════════════════════════════════════════════════ */

/* app.html `_wrNbspJoin` 과 같은 것 — 조문 표기가 줄 끝에서 갈라지지 않게 한다 */
function wrNbsp(html){
  return String(html == null ? '' : html).replace(
    /\b(Treas\. Reg\.|Rev\. Proc\.|IRC|Form|Pub\.|Reg\.|Letter|Notice|Schedule|Circular|Title) (?=§|\d|CP)/g,
    function(_m, p1){ return p1 + '\u00a0'; });
}

/* app.html `_wrSafeHtml` 과 같은 것 — 실제 화면이 지우는 것을 여기서도 지운다.
   🔴 미리보기에서 이것을 안 하면 «실제로는 안 나올 것»이 나와 보인다. */
function wrSafe(html){
  try{
    var doc = new DOMParser().parseFromString('<div id="wrp">' + String(html || '') + '</div>', 'text/html');
    var box = doc.getElementById('wrp');
    if (!box) return '';
    box.querySelectorAll('script,style,iframe,object,embed,link').forEach(function(n){ n.remove(); });
    return box.innerHTML;
  }catch(e){ return ''; }
}

/* app.html `_wrPostProcess` 와 같은 것 — 표를 가로 스크롤 상자에 넣는다 */
function wrPost(root){
  if (!root) return;
  root.querySelectorAll('.wr-real .wr-body table').forEach(function(t){
    if (t.parentElement && t.parentElement.classList.contains('wr-tblwrap')) return;
    var w = document.createElement('div');
    w.className = 'wr-tblwrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
}

/* 실제 앱과 같은 겉모습 한 벌 */
function wrRealHtml(title, body){
  return '<div class="wr-real"><div class="wr-sheet"><div class="wr-protected">' +
    '<div class="wr-title">' + esc(title || '') + '</div>' +
    '<div class="wr-body">' + (body ? wrNbsp(wrSafe(body))
      : '<span style="color:#a8b3b6">(본문 없음)</span>') + '</div>' +
    '</div></div></div>';
}

/* ── HTML 이 성한지 본다 — 막지 않고 «알린다» ───────────────────────────────
   🔴 사장님 지적의 뒷부분 = "HTML로 되어 있어 수정을 하다가 오류가 나올수 있는데".
      브라우저는 깨진 태그를 «조용히 고쳐서» 그려 준다. 그래서 화면만 보면 멀쩡한데
      실제로는 태그가 어긋나 있는 일이 생긴다. 세 가지를 세어 알린다. */
var ED_PAIR = ('div p h1 h2 h3 h4 h5 h6 ul ol li table thead tbody tfoot tr th td ' +
  'strong b em i span mark small sub sup a code pre blockquote caption section article').split(' ');

function edHtmlCheck(html){
  var h = String(html || ''), out = [];

  /* ① 실제 화면이 «지워 버리는» 태그 */
  var killed = [];
  ['script','style','iframe','object','embed','link'].forEach(function(t){
    if (new RegExp('<' + t + '\\b', 'i').test(h)) killed.push(t);
  });
  /* 🔴 경고글은 innerHTML 로 들어간다 — 태그 이름을 «날것»으로 넣으면 그 경고가
     스스로 태그가 되어 뒷글을 삼킨다(2026-08-30 실측으로 잡았다). 반드시 &lt; 로. */
  if (killed.length) out.push(['bad',
    '&lt;' + killed.join('&gt;, &lt;') + '&gt; 는 실제 화면에서 «지워집니다» — 미리보기에도 안 나옵니다.']);

  /* ② 여는 태그와 닫는 태그의 «수»가 다른 것 */
  var un = [];
  ED_PAIR.forEach(function(t){
    var o = (h.match(new RegExp('<' + t + '(?=[\\s>/])', 'gi')) || []).length;
    var c = (h.match(new RegExp('</' + t + '(?=[\\s>])', 'gi')) || []).length;
    if (o !== c) un.push('&lt;' + t + '&gt; 여는 것 ' + o + ' · 닫는 것 ' + c);
  });
  if (un.length) out.push(['bad',
    '태그 짝이 안 맞습니다 — ' + un.join(' / ') +
    '. 브라우저가 «알아서 고쳐» 그리므로 미리보기는 멀쩡해 보일 수 있습니다.']);

  /* ③ 글자로 쓴 부등호 — 화면은 멀쩡한데 도구들이 뒷문장을 통째로 삼킨다
       (2026-08-04 에 실제로 겪었다 · 원시 `<` 다섯 곳) */
  if (/<(?=[\s\d])/.test(h)) out.push(['warn',
    '태그가 아닌 «&lt;» 가 있습니다(뒤에 공백이나 숫자). 화면은 멀쩡하지만 검사 도구들이 ' +
    '뒷문장을 통째로 삼킵니다. &lt; 로 적어 주십시오.']);

  return out;
}

/* ── 🖥 실제 앱과 «같은» 문항 화면 ─────────────────────────────────────────
   🔑 사장님 물음 — *"연습문제는 html 코드가 안보이는데 War Room 과 환경이 다른 건가요?"*
      **다릅니다.** 활성 EA 5,324건 «전수»에 HTML 태그가 **0건**입니다. 문항은 평문이고,
      꼴을 만드는 것은 «줄바꿈» 하나뿐입니다(해설에 줄바꿈이 있는 것 4,256건).
      실제 앱도 `esc()` 로 글자 그대로 그리고 `white-space:pre-wrap` 으로 줄바꿈만 살립니다.
      그래서 문항에는 「태그가 깨질」 위험이 없고, 미리보기의 값은 **문단이 제대로 나뉘는가**입니다.
   🔴 그러니 여기서 `esc()` 를 «빼지 말 것». 빼면 실제 화면과 달라질 뿐 아니라,
      고객 글에 든 `<` 가 태그로 읽혀 화면이 무너진다. */
function qRealHtml(o){
  const L = ['A','B','C','D','E','F'];
  const opts = Array.isArray(o.options) ? o.options : [];
  const expl = o.lang === 'en' ? o.explanation_en : o.explanation;
  const tip  = o.lang === 'en' ? o.examtip_en     : o.examtip;
  const none = (w) => '<span style="color:#a8b3b6">(' + w + ' 없음)</span>';
  return '<div class="q-real">' +
    '<div class="qr-card"><div class="qr-text">' + esc(o.text || '') + '</div>' +
    '<div class="qr-opts">' + opts.map((t, i) =>
      '<div class="qr-opt' + (i === o.correct ? ' ok' : '') + '">' +
      '<span class="qr-l">' + (L[i] || (i + 1)) + '</span>' +
      '<span class="qr-t">' + esc(t) + '</span></div>').join('') +
    '</div></div>' +
    '<div class="qr-exp"><div class="qr-lab">해설</div>' +
    '<div class="qr-body">' + (expl ? esc(expl) : none(o.lang === 'en' ? '영문 해설' : '국문 해설')) + '</div>' +
    (tip ? '<div class="qr-tip"><div class="qr-tipl">시험 팁</div>' +
           '<div class="qr-tipb">' + esc(tip) + '</div></div>' : '') +
    '</div></div>';
}

/* 문항 글이 «문단으로 나뉘어» 있는지 본다 — 막지 않고 알린다.
   🔴 2026-08-27 사장님 지시 = *"해설에 문장 줄 바꿈 적용. 다 붙어 있어서 보기어렵습니다."*
      라이브 Part 1 실측 = 해설 줄바꿈 중앙값 8 · 빈 줄 중앙값 3.
      한 덩어리인 것은 10.8% 뿐이다. 그래서 «한 덩어리»를 신호로 본다. */
function qTextCheck(f){
  const out = [];
  [['explanation','국문 해설'], ['explanation_en','영문 해설']].forEach(([k, lab]) => {
    const v = String(f[k] == null ? '' : f[k]);
    if (!v) return;
    if (v.length > 220 && v.indexOf('\n') < 0)
      out.push(['warn', lab + '이 <b>한 덩어리</b>입니다(' + v.length + '자 · 줄바꿈 0). ' +
        '집 표준은 「정답은 A입니다」 → 빈 줄 → 규칙 → 빈 줄 → 적용 → 빈 줄 → ' +
        '「다른 보기가 틀린 이유:」 입니다.']);
  });
  ['text','explanation','examtip','explanation_en','examtip_en'].forEach(k => {
    if (k in f && String(f[k] || '').indexOf(';') >= 0)
      out.push(['warn', '<b>' + k + '</b> 에 세미콜론(;) 이 있습니다 — 집 규칙은 전면 금지입니다.']);
  });
  if ('options' in f && (f.options || []).some(t => String(t || '').indexOf(';') >= 0))
    out.push(['warn', '<b>보기</b>에 세미콜론(;) 이 있습니다 — 집 규칙은 전면 금지입니다.']);
  return out;
}
