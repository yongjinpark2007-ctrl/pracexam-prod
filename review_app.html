<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#354649">
<title>PracExam Review · 문항 검증</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ==========================================================================
   PracExam Review — HARBOR DESIGN
   토큰은 Production Files/app.html 과 **동일**합니다. 나중에 app.html 로 흡수할 때
   색·타이포를 다시 맞출 필요가 없도록 값을 그대로 복사했습니다.
   ========================================================================== */
:root{
  --page-bg:      #E0E7E9;
  --card-bg:      #ffffff;
  --border-clr:   rgba(53,70,73,.14);
  --border-hover: rgba(53,70,73,.32);
  --sel-bg:       #d9ebe9;
  --sel-border:   #6FA39E;
  --card-shadow:  0 1px 4px rgba(53,70,73,.08);
  --text-main:    #232e30;
  --text-mid:     #4b5759;
  --text-muted:   #6C7A89;
  --navy:         #354649;
  --teal:         #354649;
  --success-color:#16a34a;
  --danger-color: #dc2626;
  --flag-color:   #d97706;
  --gold:         #6FA39E;
  --silver:       #6C7A89;
  --accent:       #DD8F75;
  --accent-tint:  #FBF1EC;
  --accent-border:#EFD0C1;

  /* 글자 크기 배율. 헤더의 A− / A+ 로 조절하며 localStorage 에 저장됩니다.
     본문뿐 아니라 메뉴·목록·버튼 등 UI 전반에 곱해집니다(노안 대응).
     2026-07-31: 전체 25% 축소 요청 → 기본 1.15 → 0.86 */
  --fs: 0.86;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%;
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--page-bg);color:var(--text-main);font-size:16px;
  -webkit-text-size-adjust:100%;
}
#app{display:flex;flex-direction:column;height:100%;overflow:hidden;}

/* ── HEADER ─────────────────────────────────────────────────────────────── */
.header{
  background:var(--navy);display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:8px 1rem;min-height:60px;flex-shrink:0;flex-wrap:wrap;
  box-shadow:0 2px 12px rgba(0,0,0,.18);z-index:100;
}
.header-brand{display:flex;align-items:baseline;gap:10px;min-width:0;}
.header-title{font-size:calc(17.5px * var(--fs));font-weight:700;color:#E0E7E9;letter-spacing:-.01em;white-space:nowrap;}
.header-sub{font-size:calc(11.5px * var(--fs));color:rgba(255,255,255,.6);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;}
.exam-seg{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:8px;overflow:hidden;}
.exam-seg button{
  font-family:inherit;font-weight:700;font-size:calc(14px * var(--fs));letter-spacing:.02em;
  padding:8px 13px;border:none;background:transparent;color:rgba(255,255,255,.72);
  cursor:pointer;transition:background .15s,color .15s;
}
.exam-seg button:hover{background:rgba(255,255,255,.12);color:#fff;}
.exam-seg button.active{background:rgba(255,255,255,.20);color:#fff;}
.hdr-stat{font-size:calc(14px * var(--fs));color:rgba(255,255,255,.72);font-weight:600;white-space:nowrap;}
.hdr-stat b{color:#fff;}
.icon-btn{
  background:none;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.8);
  border-radius:8px;padding:8px 12px;font-family:inherit;font-size:calc(14px * var(--fs));font-weight:600;cursor:pointer;
}
.icon-btn:hover{background:rgba(255,255,255,.12);color:#fff;}

/* ── PROGRESS STRIP ─────────────────────────────────────────────────────── */
.progress-strip{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--card-bg);border-bottom:1px solid var(--border-clr);
  padding:10px 1rem;flex-shrink:0;font-size:calc(15.5px * var(--fs));color:var(--text-muted);font-weight:600;
}
.pchip{display:inline-flex;align-items:center;gap:6px;}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.pdot.pass{background:var(--success-color);}
.pdot.hold{background:var(--flag-color);}
.pdot.reject{background:var(--danger-color);}
.pdot.todo{background:#c3cdd0;}
.pbar{flex:1;min-width:120px;height:6px;border-radius:3px;background:#dde5e7;overflow:hidden;}
.pbar span{display:block;height:100%;background:var(--gold);transition:width .3s;}

/* ── LAYOUT ─────────────────────────────────────────────────────────────── */
.main{flex:1;display:flex;min-height:0;overflow:hidden;}
.pane-list{
  width:430px;flex-shrink:0;border-right:1px solid var(--border-clr);
  background:var(--card-bg);display:flex;flex-direction:column;min-height:0;
}
/* 화면이 좁으면 목록 폭을 조금 양보한다 (모바일 전환 전 구간) */
@media (max-width:1100px){ .pane-list{width:360px;} }
.filters{padding:10px 12px;border-bottom:1px solid var(--border-clr);display:flex;flex-direction:column;gap:8px;}
.filter-row{display:flex;gap:6px;}
.filters select,.filters input{
  font-family:inherit;font-size:calc(16px * var(--fs));padding:10px 11px;border-radius:8px;
  border:1px solid var(--border-clr);background:#fff;color:var(--text-main);min-width:0;flex:1;
}
.filters input::placeholder{color:#a8b3b6;}
.qlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.qrow{
  display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:11px 12px;border:none;border-bottom:1px solid var(--border-clr);
  background:transparent;cursor:pointer;font-family:inherit;transition:background .12s;
}
.qrow:hover{background:rgba(53,70,73,.04);}
.qrow.active{background:var(--sel-bg);box-shadow:inset 3px 0 0 var(--sel-border);}
.qrow-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px;background:#c3cdd0;}
.qrow-dot.pass{background:var(--success-color);}
.qrow-dot.hold{background:var(--flag-color);}
.qrow-dot.reject{background:var(--danger-color);}
.qrow-main{min-width:0;flex:1;}
.qrow-id{font-size:calc(14px * var(--fs));font-weight:700;color:var(--text-muted);letter-spacing:.02em;}
.qrow-text{
  font-size:calc(16px * var(--fs));line-height:1.55;color:var(--text-mid);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.list-empty{padding:28px 16px;text-align:center;color:var(--text-muted);font-size:calc(16.5px * var(--fs));line-height:1.75;}

.pane-detail{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.25rem;min-width:0;}
.detail-inner{max-width:1040px;margin:0 auto;}

/* ── QUESTION CARD ──────────────────────────────────────────────────────── */
.question-card{
  background:var(--card-bg);border:1px solid var(--border-clr);
  border-radius:16px;padding:1.5rem;margin-bottom:1rem;
  box-shadow:0 1px 6px rgba(0,0,0,.08);
}
.question-meta{display:flex;align-items:center;gap:6px;margin-bottom:1rem;flex-wrap:wrap;}
.q-badge{
  background:rgba(53,70,73,.12);color:var(--teal);border:1px solid var(--border-clr);
  border-radius:6px;display:inline-flex;align-items:center;min-height:30px;padding:3px 11px;
  font-size:calc(14.5px * var(--fs));font-weight:700;white-space:nowrap;
}
.q-badge-gray{background:rgba(0,0,0,.03);color:var(--text-muted);}
.question-text{font-size:calc(21px * var(--fs));line-height:1.72;color:var(--text-main);font-weight:500;white-space:pre-wrap;}
.options-list{display:flex;flex-direction:column;gap:0;margin:1.1rem -1.5rem 0;border-top:1px solid var(--border-clr);}
.option-row{
  display:flex;align-items:baseline;gap:12px;padding:14px 1.5rem;
  border-bottom:1px solid var(--border-clr);position:relative;
}
.option-row:last-child{border-bottom:none;}
.option-row.correct{background:rgba(22,163,74,.06);}
.option-row.correct::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--success-color);}
.opt-letter{font-size:calc(18px * var(--fs));font-weight:700;color:var(--text-muted);flex-shrink:0;min-width:24px;}
.option-row.correct .opt-letter{color:var(--success-color);}
.opt-text{font-size:calc(18.5px * var(--fs));line-height:1.68;color:var(--text-mid);}
.opt-mark{margin-left:auto;font-size:calc(13.5px * var(--fs));font-weight:700;color:var(--success-color);letter-spacing:.06em;flex-shrink:0;}

/* ── EXPLANATION ────────────────────────────────────────────────────────── */
.explanation-card{
  background:var(--card-bg);border:1px solid var(--border-clr);border-radius:14px;
  padding:1.25rem;margin-bottom:1rem;box-shadow:var(--card-shadow);
}
.exp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.exp-label{font-size:calc(18px * var(--fs));color:var(--teal);font-weight:700;letter-spacing:-.01em;}
.exp-body{font-size:calc(18.5px * var(--fs));line-height:1.85;color:var(--text-mid);letter-spacing:-.01em;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;}
.tip-box{background:var(--accent-tint);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 16px;margin-top:14px;}
.tip-label{font-size:calc(18px * var(--fs));font-weight:700;color:#b85f3f;margin-bottom:8px;line-height:1.4;}
.tip-body{font-size:calc(18.5px * var(--fs));line-height:1.8;color:var(--text-mid);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;}
.lang-toggle{display:inline-flex;border:1px solid var(--border-clr);border-radius:8px;overflow:hidden;flex-shrink:0;}
.lang-toggle button{
  font-family:inherit;font-size:calc(13.5px * var(--fs));font-weight:700;letter-spacing:.04em;padding:7px 12px;
  border:none;background:transparent;color:var(--text-muted);cursor:pointer;
}
.lang-toggle button.active{background:var(--sel-bg);color:var(--teal);}

/* ── WAR ROOM BODY (치트시트 HTML 렌더) ─────────────────────────────────── */
.wr-body{font-size:calc(15.5px * var(--fs));line-height:1.78;color:var(--text-mid);}
.wr-body h3{color:var(--teal);margin:18px 0 8px;font-size:calc(16.5px * var(--fs));}
.wr-body h4{color:var(--text-main);margin:14px 0 6px;font-size:calc(15px * var(--fs));}
.wr-body table{border-collapse:collapse;width:100%;margin:10px 0;font-size:calc(14px * var(--fs));}
.wr-body th,.wr-body td{border:1px solid var(--border-clr);padding:7px 9px;text-align:left;vertical-align:top;}
.wr-body th{background:rgba(53,70,73,.06);font-weight:700;}
.wr-body ul,.wr-body ol{padding-left:1.3em;margin:8px 0;}
.wr-body li{margin:4px 0;}
.wr-body p{margin:8px 0;}
.wr-body b,.wr-body strong{color:var(--text-main);}

/* ── VERDICT BAR ────────────────────────────────────────────────────────── */
.verdict-card{
  background:var(--card-bg);border:1px solid var(--border-clr);border-radius:14px;
  padding:1.1rem 1.25rem 1.25rem;box-shadow:var(--card-shadow);
}
.verdict-btns{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.vbtn{
  flex:1;min-width:118px;font-family:inherit;font-size:calc(18px * var(--fs));font-weight:700;
  padding:15px 10px;border-radius:10px;cursor:pointer;transition:all .15s;
  border:1.5px solid var(--border-clr);background:#fff;color:var(--text-mid);
}
.vbtn:hover{border-color:var(--border-hover);}
.vbtn .k{font-size:calc(13.5px * var(--fs));font-weight:600;opacity:.55;margin-left:6px;}
.vbtn.pass.on{background:rgba(22,163,74,.10);border-color:var(--success-color);color:var(--success-color);}
.vbtn.hold.on{background:rgba(217,119,6,.10);border-color:var(--flag-color);color:var(--flag-color);}
.vbtn.reject.on{background:rgba(220,38,38,.08);border-color:var(--danger-color);color:var(--danger-color);}
.verdict-card textarea{
  width:100%;font-family:inherit;font-size:calc(16.5px * var(--fs));line-height:1.65;padding:12px 14px;
  border:1px solid var(--border-clr);border-radius:10px;resize:vertical;min-height:86px;
  color:var(--text-main);background:#fff;
}
.verdict-card textarea::placeholder{color:#a8b3b6;}
.verdict-foot{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
.btn{
  font-family:inherit;font-size:calc(17px * var(--fs));font-weight:700;padding:12px 19px;border-radius:10px;
  border:1px solid var(--border-clr);background:#fff;color:var(--text-mid);cursor:pointer;transition:all .15s;
}
.btn:hover{border-color:var(--border-hover);}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.primary:hover{background:#2a383a;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.save-state{font-size:calc(15.5px * var(--fs));font-weight:600;color:var(--text-muted);margin-left:auto;}
.save-state.ok{color:var(--success-color);}
.save-state.err{color:var(--danger-color);}
.hint{font-size:calc(15px * var(--fs));color:var(--text-muted);line-height:1.75;margin-top:12px;}
.hint kbd{
  display:inline-block;background:rgba(53,70,73,.07);border:1px solid var(--border-clr);
  border-radius:5px;padding:2px 7px;font-family:inherit;font-size:calc(14px * var(--fs));font-weight:700;color:var(--text-mid);
}

/* ── GATE / EMPTY ───────────────────────────────────────────────────────── */
.gate{
  flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem;overflow-y:auto;
}
.gate-card{
  background:var(--card-bg);border:1px solid var(--border-clr);border-radius:16px;
  padding:1.75rem;box-shadow:var(--card-shadow);width:100%;max-width:400px;
}
.gate-card h1{font-size:calc(22px * var(--fs));font-weight:700;margin-bottom:6px;}
.gate-card p{font-size:calc(15.5px * var(--fs));color:var(--text-muted);line-height:1.7;margin-bottom:16px;}
.gate-card label{display:block;font-size:calc(14.5px * var(--fs));font-weight:700;color:var(--text-mid);margin:12px 0 6px;}
.gate-card input{
  width:100%;font-family:inherit;font-size:calc(17px * var(--fs));padding:12px 13px;
  border:1px solid var(--border-clr);border-radius:10px;background:#fff;color:var(--text-main);
}
.gate-card .btn{width:100%;margin-top:16px;}
.msg{font-size:calc(15px * var(--fs));line-height:1.65;padding:11px 13px;border-radius:9px;margin-top:12px;display:none;}
.msg.show{display:block;}
.msg.err{background:rgba(220,38,38,.07);color:var(--danger-color);border:1px solid rgba(220,38,38,.2);}
.msg.info{background:rgba(53,70,73,.05);color:var(--text-mid);border:1px solid var(--border-clr);}
.empty-detail{
  display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--text-muted);font-size:calc(16px * var(--fs));text-align:center;line-height:1.8;padding:2rem;
}

/* ── MOBILE ─────────────────────────────────────────────────────────────── */
.back-btn{display:none;}
@media (max-width:820px){
  .pane-list{
    width:100%;position:absolute;inset:0;top:0;z-index:20;
    transform:translateX(0);transition:transform .22s ease;
  }
  .main.detail-open .pane-list{transform:translateX(-100%);}
  .main{position:relative;}
  .pane-detail{width:100%;}
  .back-btn{display:inline-flex;}
  /* 모바일에서도 배율은 유지한다 — 고정 px 로 덮으면 A+ 가 무효가 된다 */
  .question-text{font-size:calc(19px * var(--fs));}
  .header-sub{display:none;}
}
/* ── 승인 대기(Claude 제안 검토) 모드 ─────────────────────────────────────── */
.ap-bar{gap:6px;flex-wrap:wrap}
.ap-bar .btn{padding:7px 10px;font-size:12px}
/* 저장 폴더 안내(.ap-dir)는 그 아래 묶음 정보(.ap-info)와 같은 크기로 — 눈에 튀지 않게 */
.ap-info,.ap-dir{font-size:12px;color:#5b6b6e;line-height:1.5}
.ap-info b,.ap-dir b{color:#20343a}
.q-badge.ap-applied{background:rgba(111,163,158,.18);border-color:#A3C6C4}
.q-badge.ap-pending{background:rgba(224,168,90,.20);border-color:#E0A85A}
/* 제안 위에 항상 붙는 '문항 원문' 카드 — 이게 없으면 검토 자체가 불가능하다 */
.ap-q{margin:12px 0;border:1px solid #cfdadb;border-radius:10px;background:#fff;padding:14px}
.ap-qtext{font-size:calc(15px * var(--fs));line-height:1.8;color:#20343a;white-space:pre-wrap;margin-bottom:10px}
/* 한 항목에 문항이 둘 이상일 때(중복 쌍) — 라벨이 붙은 카드는 왼쪽 띠로 구분한다 */
.ap-q-multi{border-left:4px solid #A3C6C4}
.ap-q-multi .ap-h{color:#2f6b5c;font-size:13px}
.ap-opt{display:flex;gap:9px;padding:7px 10px;border-radius:8px;margin-bottom:3px;
  font-size:calc(14px * var(--fs));line-height:1.65;color:#20343a}
.ap-opt b{color:#8a999c;min-width:15px;flex:none}
.ap-opt.key{background:#eef7f4;border:1px solid #A3C6C4}
.ap-opt.key b{color:#2f6b5c}
.ap-exp{margin-top:12px;border-top:1px solid #eef2f3;padding-top:8px}
.ap-exp summary{cursor:pointer;font-size:12px;font-weight:700;color:#5b6b6e;padding:5px 0;list-style:revert}
.ap-exp .ap-body{margin-top:6px;font-size:calc(13.5px * var(--fs))}
.ap-why{margin:12px 0;border:1px solid #dbe4e5;border-radius:10px;background:#fbfdfd;padding:12px 14px}
.ap-h{font-size:12px;font-weight:700;color:#5b6b6e;letter-spacing:.02em;margin-bottom:7px}
.ap-body{font-size:calc(14px * var(--fs));line-height:1.75;color:#20343a;white-space:pre-wrap}
.ap-diff{margin:12px 0}
.ap-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:900px){.ap-cols{grid-template-columns:1fr}}
.ap-col{border:1px solid #dbe4e5;border-radius:10px;overflow:hidden;min-width:0}
.ap-col-h{font-size:11px;font-weight:700;padding:6px 10px;border-bottom:1px solid #dbe4e5}
.ap-before .ap-col-h{background:#fdf1f1;color:#9a4b4b}
.ap-after  .ap-col-h{background:#eef7f4;color:#2f6b5c}
.ap-col pre{margin:0;padding:10px;font-size:calc(13px * var(--fs));line-height:1.65;
  white-space:pre-wrap;word-break:break-word;font-family:inherit;color:#20343a;overflow-x:auto}
.ap-card textarea{min-height:220px;font-size:calc(14px * var(--fs));line-height:1.7}
.ap-count{font-size:11px;color:#8a999c;text-align:right;margin-top:4px}
.ap-paste{padding:16px}
.ap-paste textarea{width:100%;min-height:340px;font:inherit;font-size:13px;line-height:1.6;
  padding:12px;border:1px solid #cfdadb;border-radius:10px;resize:vertical}
</style>
</head>
<body>
<div id="app">

  <header class="header">
    <div class="header-brand">
      <span class="header-title">PracExam Review</span>
      <span class="header-sub">문항 검증</span>
    </div>
    <div class="header-right">
      <div class="exam-seg" id="examSeg"></div>
      <div class="exam-seg" id="poolSeg"></div>
      <div class="exam-seg" id="fsSeg">
        <button id="fsDown" title="글씨 작게">A−</button>
        <button id="fsUp"   title="글씨 크게">A+</button>
      </div>
      <span class="hdr-stat" id="hdrStat"></span>
      <button class="icon-btn" id="btnLogout" style="display:none">로그아웃</button>
    </div>
  </header>

  <!-- 로그인 게이트 -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <h1>문항 검증</h1>
      <p>questions 테이블은 관리자만 읽을 수 있습니다. PracExam 관리자 계정으로 로그인하세요.</p>
      <label for="email">이메일</label>

/* ── EXAMS 레지스트리 ──────────────────────────────────────────────────────

/* questions 테이블은 관리자 계정 하나만 읽을 수 있습니다.

/* ── 전역 상태 ───────────────────────────────────────────────────────────── */
const S = {

};

/* 문항 풀. study/mock 은 questions.pool 값과 1:1 대응.
   warroom = war_room_topics 테이블(치트시트) 리뷰 모드 — 드래그·복사 가능, outline_code 표시. */
const POOLS = { study:'학습', mock:'Mock', warroom:'War Room', approve:'승인 대기' };

/* 승인 대기 = Claude 가 만든 '제안 묶음(JSON)'을 읽어 승인/피드백하는 모드.
   DB 를 쓰지 않습니다 — 제안은 파일(또는 붙여넣기)로 들어오고, 판정·피드백은
   localStorage 에 즉시 저장된 뒤 '피드백 내보내기'로 JSON 파일이 됩니다.
   (새 테이블이 필요 없으므로 Jay 의 SQL 작업 없이 바로 씁니다) */
const AP_LS = 'pracexam_review_approvals_v1';

/* 판정 저장 스코프 — War Room 판정은 문항 판정과 섞이지 않게 exam 값을 분리한다.
   (review_verdicts.exam = 'ea-wr', question_id = outline_code 예: C1004) */
const vScope = () => S.pool === 'warroom' ? S.exam + '-wr' : S.exam;

const VERDICT_LABEL    = { pass:'합격', hold:'보류', reject:'탈락' };
const VERDICT_LABEL_AP = { pass:'승인', hold:'보류', reject:'수정요청' };
const isAp  = () => S.pool === 'approve';
const vlab  = (v) => (isAp() ? VERDICT_LABEL_AP : VERDICT_LABEL)[v] || v;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ── 인증 ────────────────────────────────────────────────────────────────── */
async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session && session.user) { S.user = session.user; await enterApp(); }
}

$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

async function doLogin(){
  const msg = $('gateMsg');
  msg.className = 'msg err';
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) { msg.textContent = '이메일과 비밀번호를 입력하세요.'; msg.classList.add('show'); return; }

  $('btnLogin').disabled = true;
  $('btnLogin').textContent = '로그인 중…';

  $('btnLogin').disabled = false;
  $('btnLogin').textContent = '로그인';

  if (error) { msg.textContent = '로그인 실패: ' + error.message; msg.classList.add('show'); return; }
  S.user = data.user;
  await enterApp();
}

$('btnLogout').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

async function enterApp(){
  $('gate').style.display  = 'none';
  $('strip').style.display = 'flex';
  $('main').style.display  = 'flex';
  $('btnLogout').style.display = 'inline-flex';

  renderPoolSeg();

/* ── 글자 크기 ───────────────────────────────────────────────────────────── */
// 키를 _v2 로 올림 — 예전 키에 저장된 큰 배율(1.15)이 새 기본값(0.86)을 덮지 않게.
const FS_KEY = 'pracexam_review_fs_v2';
const FS_MIN = 0.6, FS_MAX = 2.0, FS_STEP = 0.1, FS_DEFAULT = 0.86;

function currentFs(){
  const v = parseFloat(localStorage.getItem(FS_KEY));
  return (isFinite(v) && v >= FS_MIN && v <= FS_MAX) ? v : FS_DEFAULT;
}
function applyFontScale(){
  document.documentElement.style.setProperty('--fs', String(currentFs()));
}
function nudgeFont(delta){
  const next = Math.min(FS_MAX, Math.max(FS_MIN, +(currentFs() + delta).toFixed(2)));
  localStorage.setItem(FS_KEY, String(next));
  applyFontScale();
}
$('fsUp').addEventListener('click',   () => nudgeFont(FS_STEP));
$('fsDown').addEventListener('click', () => nudgeFont(-FS_STEP));

/* ── 시험 스위처 ─────────────────────────────────────────────────────────── */
function renderExamSeg(){
  $('examSeg').innerHTML = REVIEW_EXAMS
    .map(e => `<button data-exam="${e}" class="${e === S.exam ? 'active' : ''}">${esc(EXAMS[e].label)}</button>`)
    .join('');
  $('examSeg').querySelectorAll('button').forEach(b => {
    b.addEventListener('click', async () => {
      if (b.dataset.exam === S.exam) return;
      if (!await confirmDiscard()) return;
      S.exam = b.dataset.exam;
      S.currentId = null;
      renderExamSeg();
      await loadExam();
    });
  });
}

/* ── 풀 스위처 (학습 / Mock) ──────────────────────────────────────────────── */
function renderPoolSeg(){
  $('poolSeg').innerHTML = Object.keys(POOLS)
    .map(p => `<button data-pool="${p}" class="${p === S.pool ? 'active' : ''}">${esc(POOLS[p])}</button>`)
    .join('');
  // 승인 대기 모드에서만 제안 불러오기/내보내기 도구를 띄운다
  $('apBar').style.display = isAp() ? 'flex' : 'none';
  if (!isAp()){ $('apInfo').style.display = 'none'; $('apDirInfo').style.display = 'none'; }
  else apDirShow();          // 저장 폴더가 지정돼 있는지 항상 보여 준다
  $('poolSeg').querySelectorAll('button').forEach(b => {
    b.addEventListener('click', async () => {
      if (b.dataset.pool === S.pool) return;
      if (!await confirmDiscard()) return;
      S.pool = b.dataset.pool;
      S.currentId = null;
      renderPoolSeg();
      await loadExam();
    });
  });
}

/* ── War Room(치트시트) 로드 ─────────────────────────────────────────────── */
async function loadWarRoom(){
  $('qlist').innerHTML = '<div class="list-empty">불러오는 중…</div>';
  $('detail').innerHTML = '<div class="empty-detail">왼쪽 목록에서 항목을 선택하세요.</div>';
  if (S.exam !== 'ea'){
    S.rows = [];
    $('qlist').innerHTML = '<div class="list-empty">War Room은 <b>EA</b> 전용입니다.<br><br>헤더에서 EA를 선택하세요.</div>';
    renderStrip(); return;
  }
  const PAGE = 1000;
  let rows = [], from = 0;
  for(;;){
    const res = await sb.from('war_room_topics')
      .select('outline_code, part, domain, title_ko, title_en, body_ko, body_en, is_free, status')
      .order('part').order('sort_order')
      .range(from, from + PAGE - 1);
    if (res.error){
      $('qlist').innerHTML = `<div class="list-empty">치트시트를 불러오지 못했습니다.<br><br>${esc(res.error.message)}</div>`;
      return;
    }
    const batch = res.data || [];
    rows = rows.concat(batch);
    if (batch.length < PAGE) break;
    from += PAGE;
    if (from > 10000) break;
  }
  const strip = (h) => String(h || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  S.rows = rows.map(t => ({
    question_id: t.outline_code,          // 판정 키 = outline_code (예: C1004)
    part: t.part,
    topic: t.domain,                       // 토픽 필터 = 도메인
    title_ko: t.title_ko, title_en: t.title_en,
    body_ko: t.body_ko, body_en: t.body_en,
    is_free: t.is_free, wr_status: t.status,
    text: (t.title_en || t.title_ko || ''),
    _search: strip(t.body_ko) + ' ' + strip(t.body_en) + ' ' + (t.title_ko || '') + ' ' + (t.title_en || ''),
    is_wr: true
  }));
  await loadVerdicts();
  buildFilters();
  renderList();
  renderStrip();
}

/* ── 승인 대기(Claude 제안 검토) ──────────────────────────────────────────────
   제안 JSON 형식:
   { "batch":"2026-08-01-calcqc", "created":"2026-08-01",
     "items":[ { "id":"C1081-014", "title":"오답 2개 결함 수정",
                 "part":1, "topic":"C1081",
                 "status":"applied" | "proposed",
                 "why":"제안 이유(평문)",
                 "changes":[ {"field":"options","before":[...],"after":[...]} ],
                 "note":"참고" } ] }
   판정·피드백은 localStorage 에 즉시 저장되므로 새로고침해도 남습니다. */
function apLoadStore(){
  try { return JSON.parse(localStorage.getItem(AP_LS) || '{}') || {}; }
  catch(e){ return {}; }
}
function apSaveStore(o){
  try { localStorage.setItem(AP_LS, JSON.stringify(o)); }
  catch(e){ console.warn('localStorage 저장 실패:', e); }
}

/* 제안 묶음을 받아 화면에 올린다. 기존 피드백은 batch 가 같을 때만 이어붙인다. */
function apSetProposal(obj, quiet){
  if (!obj || !Array.isArray(obj.items) || !obj.items.length){
    if (!quiet) alert('제안 항목(items)이 없는 파일입니다.');
    return false;
  }
  const store = apLoadStore();
  if (store.proposal && store.proposal.batch !== obj.batch) store.feedback = {};  // 다른 묶음이면 초기화
  store.proposal = obj;
  apSaveStore(store);
  S.proposal = obj;
  return true;
}

async function loadApprovals(){
  $('detail').innerHTML = '<div class="empty-detail">왼쪽 목록에서 항목을 선택하세요.</div>';
  const store = apLoadStore();
  if (!S.proposal && store.proposal) S.proposal = store.proposal;

  if (!S.proposal){
    S.rows = []; S.verdicts = {};
    $('qlist').innerHTML =
      '<div class="list-empty">검토할 제안이 아직 없습니다.<br><br>' +
      'Claude 가 만들어 준 <b>제안 JSON</b> 을 위의 <b>제안 파일 열기</b> 로 불러오거나,<br>' +
      '<b>붙여넣기</b> 로 내용을 그대로 붙여 넣으세요.</div>';
    $('apInfo').style.display = 'none';
    renderStrip();
    return;
  }

  const fb = store.feedback || {};
  S.rows = S.proposal.items.map(it => ({
    question_id: String(it.id),
    part:  it.part != null ? it.part : null,
    topic: it.topic || '',
    text:  it.title || '',
    _search: [it.id, it.title, it.why, it.note,
              JSON.stringify(it.changes || []),
              JSON.stringify(it.contexts || [])].filter(Boolean).join(' '),
    is_ap: true,
    ap: it
  }));
  S.verdicts = {};
  Object.keys(fb).forEach(id => {
    S.verdicts[id] = { verdict: fb[id].decision, note: fb[id].feedback || '' };
  });
  S.verdictsError = null;

  const done = Object.keys(fb).filter(id => fb[id].decision).length;
  $('apInfo').style.display = 'block';
  $('apInfo').innerHTML =
    `묶음 <b>${esc(S.proposal.batch || '(이름 없음)')}</b> · ` +
    `${S.proposal.created ? esc(S.proposal.created) + ' · ' : ''}` +
    `총 <b>${S.rows.length}</b>건 · 판정 <b>${done}</b>건`;

  buildFilters();
  renderList();
  renderStrip();
}

/* 값 표시 — 보기 배열은 A. B. C. 로 풀어서 보여준다 */
function apVal(v){
  if (Array.isArray(v)) return v.map((x, i) => `${'ABCDEF'[i] || (i + 1)}. ${x}`).join('\n');
  if (v && typeof v === 'object') return JSON.stringify(v, null, 1);
  return String(v == null ? '' : v);
}
/* 문항 원문 카드 — 지문·보기(정답 표시)·해설. 변경 여부와 무관하게 항상 보여준다.
   (2026-08-01 사용자 피드백: "문제도 함께 보여주어야 검토가 가능합니다") */
function apContext(cx){
  if (!cx || (!cx.text && !(cx.options || []).length)) return '';
  const L = 'ABCDEF';
  const opts = (cx.options || []).map((o, i) =>
    `<div class="ap-opt${L[i] === cx.correct ? ' key' : ''}"><b>${L[i]}</b><span>${esc(o)}</span></div>`
  ).join('');
  const exp = (lbl, body) => body
    ? `<details class="ap-exp"><summary>${lbl}</summary><div class="ap-body">${esc(body)}</div></details>`
    : '';
  return `<div class="ap-q${cx.label ? ' ap-q-multi' : ''}">
    <div class="ap-h">${esc(cx.label || '문항 원문')}${cx.is_active === false ? ' · 현재 비활성' : ''}</div>
    ${cx.text ? `<div class="ap-qtext">${esc(cx.text)}</div>` : ''}

/* ── 저장 폴더 기억 (File System Access API) ────────────────────────────────
   사용자 지정 2026-08-03: 피드백 내보내기는 제안 파일과 같은 폴더로 간다.
     C:\Users\Yongj\OneDrive\1_DXD Computer\0_PracExam\Production Files\claude proposal
   폴더를 한 번 지정하면 핸들을 IndexedDB 에 보관해 다음부터 자동 저장한다.
   브라우저가 이 API 를 지원하지 않으면 기존 다운로드 방식으로 물러난다. */
const AP_DIR_DB = 'reviewAppDir', AP_DIR_KEY = 'feedbackDir';
const AP_DIR_LABEL = 'Production Files\\claude proposal';

function apIdb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(AP_DIR_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function apDirGet(){
  try {
    const db = await apIdb();
    return await new Promise((res) => {
      const rq = db.transaction('h').objectStore('h').get(AP_DIR_KEY);
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => res(null);
    });
  } catch(e){ return null; }
}
async function apDirPut(h){
  try {
    const db = await apIdb();
    await new Promise((res) => {
      const rq = db.transaction('h', 'readwrite').objectStore('h').put(h, AP_DIR_KEY);
      rq.onsuccess = rq.onerror = () => res();
    });
  } catch(e){ console.warn('폴더 핸들 저장 실패:', e); }
}
function apDirSupported(){ return typeof window.showDirectoryPicker === 'function'; }

async function apDirEnsure(interactive){
  if (!apDirSupported()) return null;
  let h = await apDirGet();
  if (h){
    let perm = await h.queryPermission({ mode:'readwrite' });
    if (perm !== 'granted' && interactive) perm = await h.requestPermission({ mode:'readwrite' });
    if (perm === 'granted') return h;
    if (!interactive) return null;
  }
  if (!interactive) return null;
  try {
    h = await window.showDirectoryPicker({ id:'claudeProposal', mode:'readwrite' });
  } catch(e){ return null; }               // 사용자가 취소
  await apDirPut(h);
  return h;
}
async function apDirShow(){
  const el = $('apDirInfo');
  if (!el) return;
  if (!apDirSupported()){
    el.style.display = '';
    el.innerHTML = '<span style="color:#a33">이 브라우저는 폴더 지정을 지원하지 않습니다 — 내보내기는 다운로드 폴더로 갑니다. ' +
                   'Chrome 또는 Edge 로 열면 <b>' + esc(AP_DIR_LABEL) + '</b> 에 바로 저장됩니다.</span>';
    return;
  }
  const h = await apDirGet();
  el.style.display = '';
  el.innerHTML = h
    ? '저장 폴더: <b>' + esc(h.name) + '</b> — 내보내기가 이 폴더에 바로 저장됩니다.'
    : '<span style="color:#a33">저장 폴더가 아직 지정되지 않았습니다.</span> [저장 폴더] 를 눌러 <b>' +
      esc(AP_DIR_LABEL) + '</b> 을 선택해 주세요.';
}

async function apExport(){
  const store = apLoadStore();
  const fb = store.feedback || {};
  const items = (S.proposal && S.proposal.items ? S.proposal.items : [])
    .map(it => ({
      id: String(it.id),
      decision: fb[it.id] ? (fb[it.id].decision || null) : null,
      feedback: fb[it.id] ? (fb[it.id].feedback || '') : '',
      at:       fb[it.id] ? (fb[it.id].at || null) : null
    }))
    .filter(x => x.decision || x.feedback);

  if (!items.length){ alert('내보낼 판정·피드백이 아직 없습니다.'); return; }

  const batch = (S.proposal && S.proposal.batch) || 'batch';
  const name  = `review_feedback_${batch}.json`;
  const out   = { batch, exported_at: new Date().toISOString(), count: items.length, items };
  const text  = JSON.stringify(out, null, 1);

  // ① 지정된 폴더에 바로 저장 (없으면 이때 한 번 물어본다)
  const dir = await apDirEnsure(true);
  if (dir){
    try {
      const fh = await dir.getFileHandle(name, { create:true });
      const w  = await fh.createWritable();
      await w.write(text); await w.close();
      await apDirShow();
      alert(`저장했습니다 — ${dir.name} 폴더의 ${name}\n(${items.length}건)`);
      return;
    } catch(e){
      console.warn('폴더 저장 실패, 다운로드로 대체:', e);
    }
  }

  // ② 폴백 — 기존 다운로드
  const blob = new Blob([text], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  alert(`다운로드 폴더에 저장했습니다 — ${name}\n\n` +
        `${AP_DIR_LABEL} 로 옮겨 주시거나, ea_generator 에서\n  py collect_feedback.py\n를 실행하면 자동으로 옮겨집니다.`);
}

async function loadExam(){
  if (S.pool === 'approve') return loadApprovals();
  if (S.pool === 'warroom') return loadWarRoom();
  $('qlist').innerHTML = '<div class="list-empty">불러오는 중…</div>';
  $('detail').innerHTML = '<div class="empty-detail">왼쪽 목록에서 문항을 선택하세요.</div>';

  // ★ exam + pool 스코프 — 이 두 필터가 빠지면 다른 시험 문항까지 딸려옵니다.
  //
  // ⚠️ PostgREST 는 한 번에 최대 1000행만 돌려줍니다. EA study 만 4,000행이 넘어
  //    .range() 로 나눠 받지 않으면 question_id 순서상 앞쪽(Part 1)만 실려옵니다.
  const PAGE = 1000;
  const COLS = 'question_id, source_qid, part, topic, outline_code, difficulty, text, options, correct, ' +
               'explanation, examtip, explanation_en, examtip_en, is_active';
  const virt = EXAMS[S.exam].virtual || null;   // NA 가상 시험이면 실제로 읽을 exam 이 따로 있음
  let rows = [], from = 0, error = null;

  for(;;){
    let q = sb
      .from('questions')
      .select(COLS)
      .eq('exam', virt ? virt.readExam : S.exam)
      .eq('pool', S.pool);
    if (virt) q = q.like('question_id', virt.idPrefix + '%');   // 그 주의 national 문항만

    const res = await q.order('question_id').range(from, from + PAGE - 1);

    if (res.error){ error = res.error; break; }
    const batch = res.data || [];
    rows = rows.concat(batch);
    $('qlist').innerHTML = `<div class="list-empty">불러오는 중… ${rows.length}문항</div>`;
    if (batch.length < PAGE) break;      // 마지막 페이지
    from += PAGE;
    if (from > 100000) break;            // 안전장치 (무한루프 방지)
  }

  if (error){
    // 42501 = permission denied. questions 는 관리자 계정만 읽을 수 있습니다.
    const denied = error.code === '42501' || /permission denied/i.test(error.message || '');
    $('qlist').innerHTML = denied
      ? `<div class="list-empty"><b>문항을 읽을 권한이 없습니다.</b><br><br>
           <code>questions</code> 는 관리자 계정만 조회할 수 있습니다.<br>
           현재 로그인: <b>${esc(S.user.email || '-')}</b><br><br>
           관리자 계정으로 다시 로그인하세요.</div>`
      : `<div class="list-empty">문항을 불러오지 못했습니다.<br><br>${esc(error.message)}</div>`;
    return;
  }

  // NA 모드: 판정 키를 원본 national id(source_qid)로 정규화한다.
  // 이렇게 해두면 이후 모든 로직(목록·판정·집계)이 그대로 동작하고,
  // 판정 1건이 4개 주 복제본 전부를 대표하게 된다.
  if (virt){
    rows.forEach(r => {
      r.state_qid   = r.question_id;                    // 실제 DB 행 id (참고용)
      r.question_id = r.source_qid || r.question_id;    // 판정 키 = RE-N-####
    });
  }

  S.rows = rows;
  await loadVerdicts();
  buildFilters();
  renderList();
  renderStrip();
}

async function loadVerdicts(){
  S.verdicts = {};
  // questions 와 같은 이유로 페이지 분할 — 판정이 1000건을 넘으면 잘립니다.
  const PAGE = 1000;
  let from = 0;

  for(;;){
    const { data, error } = await sb
      .from('review_verdicts')
      .select('question_id, verdict, note')
      .eq('exam', vScope())
      .eq('reviewer_id', S.user.id)
      .order('question_id')
      .range(from, from + PAGE - 1);

    if (error){
      // 테이블 미생성 등 — 판정만 비활성화하고 열람은 계속 가능하게 둡니다.
      console.warn('review_verdicts 읽기 실패:', error.message);
      S.verdictsError = error.message;
      return;
    }
    const batch = data || [];
    batch.forEach(v => { S.verdicts[v.question_id] = { verdict:v.verdict, note:v.note || '' }; });
    if (batch.length < PAGE) break;
    from += PAGE;
    if (from > 100000) break;
  }
  S.verdictsError = null;
}

function filteredRows(){
  const part = $('fPart').value;
  const vf   = $('fVerdict').value;
  const tp   = $('fTopic').value;
  const q    = $('fSearch').value.trim().toLowerCase();

  return S.rows.filter(r => {
    if (part && String(r.part) !== part) return false;
    if (tp && r.topic !== tp) return false;
    if (vf){
      const v = S.verdicts[r.question_id];
      if (vf === 'todo'){ if (v) return false; }
      else if (!v || v.verdict !== vf) return false;
    }
    if (q){
      const hay = [r.question_id, r.text, r.explanation, r.topic, r.outline_code, r._search]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderStrip(){
  let pass = 0, hold = 0, reject = 0;
  S.rows.forEach(r => {
    const v = S.verdicts[r.question_id];
    if (!v) return;
    if (v.verdict === 'pass') pass++;
    else if (v.verdict === 'hold') hold++;
    else if (v.verdict === 'reject') reject++;
  });
  const total = S.rows.length;
  const done  = pass + hold + reject;
  const pct   = total ? Math.round(done / total * 100) : 0;

  $('lPass').textContent   = vlab('pass');
  $('lHold').textContent   = vlab('hold');
  $('lReject').textContent = vlab('reject');
  $('cPass').textContent   = pass;
  $('cHold').textContent   = hold;
  $('cReject').textContent = reject;
  $('cTodo').textContent   = total - done;
  $('pbarFill').style.width = pct + '%';
  $('pctTxt').textContent   = pct + '%';
  $('hdrStat').innerHTML    = `<b>${done}</b> / ${total}`;
}

        ${r.difficulty ? `<span class="q-badge q-badge-gray">${esc(r.difficulty)}</span>` : ''}
        ${r.is_active === false ? '<span class="q-badge q-badge-gray">비활성</span>' : ''}
        ${r.state_qid ? '<span class="q-badge" style="background:rgba(111,163,158,.18);border-color:#A3C6C4;">NA · CA/TX/NJ/NY 공통</span>' : ''}
        <button class="btn back-btn" id="btnBack" style="margin-left:auto;padding:7px 13px;">← 목록</button>
      </div>
      <div class="question-text">${esc(r.text || '')}</div>
      <div class="options-list">
        ${opts.map((o, i) => `
          <div class="option-row ${i === r.correct ? 'correct' : ''}">
            <span class="opt-letter">${letters[i] || (i+1)}</span>
            <span class="opt-text">${esc(o)}</span>
            ${i === r.correct ? '<span class="opt-mark">정답</span>' : ''}
          </div>`).join('')}
      </div>
    </div>

    <div class="explanation-card">
      <div class="exp-head">
        <span class="exp-label">해설</span>
        <span class="lang-toggle">
          <button data-lang="ko" class="${S.lang === 'ko' ? 'active' : ''}">KO</button>
          <button data-lang="en" class="${S.lang === 'en' ? 'active' : ''}">EN</button>
        </span>
      </div>
      <div class="exp-body">${explMissing
        ? '<span style="color:#a8b3b6">(' + (S.lang === 'en' ? '영문' : '국문') + ' 해설 없음)</span>'
        : esc(expl)}</div>
      ${tip ? `<div class="tip-box"><div class="tip-label">시험 팁</div><div class="tip-body">${esc(tip)}</div></div>` : ''}
    </div>`;
  }

  const ap = isAp();
  $('detail').innerHTML = mainHtml + `
    <div class="verdict-card${ap ? ' ap-card' : ''}">
      <div class="verdict-btns">
        <button class="vbtn pass   ${v.verdict === 'pass'   ? 'on' : ''}" data-v="pass">${vlab('pass')}<span class="k">1</span></button>
        <button class="vbtn hold   ${v.verdict === 'hold'   ? 'on' : ''}" data-v="hold">${vlab('hold')}<span class="k">2</span></button>
        <button class="vbtn reject ${v.verdict === 'reject' ? 'on' : ''}" data-v="reject">${vlab('reject')}<span class="k">3</span></button>
      </div>
      <textarea id="vnote" placeholder="${ap
        ? '피드백을 자유롭게 적으세요. 길이 제한 없습니다 — 다른 AI(Gemini 등)에게 받은 답변을 통째로 붙여넣어도 그대로 전달됩니다.'
        : '문제점·수정 지시를 적어두세요. 생성 파이프라인에서 이 메모를 보고 재작업합니다.'}">${esc(v.note)}</textarea>
      ${ap ? '<div class="ap-count" id="apCount"></div>' : ''}
      <div class="verdict-foot">
        <button class="btn" id="btnPrev">← 이전</button>
        <button class="btn" id="btnNext">다음 →</button>
        <button class="btn primary" id="btnSave">저장</button>
        <span class="save-state" id="saveState"></span>
      </div>
      ${S.verdictsError
        ? `<div class="msg err show" style="margin-top:10px">판정을 저장할 수 없습니다: ${esc(S.verdictsError)}<br>
             <code>migration_review_verdicts.sql</code> 을 먼저 실행하세요.</div>`
        : ''}
      <div class="hint">
        <kbd>1</kbd> 합격 · <kbd>2</kbd> 보류 · <kbd>3</kbd> 탈락 ·
        <kbd>Q</kbd>/<kbd>W</kbd> 이전/다음 · <kbd>Ctrl+S</kbd> 저장
        <br>판정 버튼을 누르면 메모와 함께 바로 저장되고 다음 문항으로 넘어갑니다.
      </div>
    </div>`;

  // 이벤트 바인딩
  const back = $('btnBack');
  if (back) back.addEventListener('click', () => document.getElementById('main').classList.remove('detail-open'));

  $('detail').querySelectorAll('.lang-toggle button').forEach(b => {
    b.addEventListener('click', () => { S.lang = b.dataset.lang; renderDetail(); });
  });
  $('detail').querySelectorAll('.vbtn').forEach(b => {
    b.addEventListener('click', () => saveVerdict(b.dataset.v, true));
  });
  $('btnSave').addEventListener('click', () => saveVerdict(null, false));
  $('btnPrev').addEventListener('click', () => step(-1));
  $('btnNext').addEventListener('click', () => step(1));
  // 긴 피드백을 편하게 — 입력에 따라 높이를 늘리고 글자 수를 보여준다
  const grow = () => {
    const t = $('vnote');
    if (!t) return;
    if (isAp()){
      t.style.height = 'auto';
      t.style.height = Math.min(Math.max(t.scrollHeight, 220), 900) + 'px';
      const c = $('apCount');
      if (c) c.textContent = t.value.length ? t.value.length.toLocaleString() + '자' : '';
    }
  };
  $('vnote').addEventListener('input', () => { S.dirty = true; setSaveState('', ''); grow(); });
  grow();
}

/* 승인 대기 저장 — 판정 없이 피드백만 적어두는 것도 허용한다 */
function saveApproval(r, verdict, advance){
  const el = $('vnote');
  const fbText = el ? el.value.replace(/\s+$/, '') : '';
  const existing = S.verdicts[r.question_id];
  const v = verdict || (existing && existing.verdict) || null;

  if (!v && !fbText){ setSaveState('승인·보류·수정요청 중 하나를 고르거나 피드백을 적어주세요', 'err'); return; }

  let nextId = null;
  if (advance){
    const rowsNow = filteredRows();
    const i = rowsNow.findIndex(x => x.question_id === S.currentId);
    if (i !== -1 && rowsNow[i + 1]) nextId = rowsNow[i + 1].question_id;
  }

  const store = apLoadStore();
  store.feedback = store.feedback || {};
  store.feedback[r.question_id] = { decision: v, feedback: fbText, at: new Date().toISOString() };
  apSaveStore(store);

  S.verdicts[r.question_id] = { verdict: v, note: fbText };
  S.dirty = false;
  const msg = v ? '저장됨 · ' + vlab(v) : '피드백 저장됨';
  setSaveState(msg, 'ok');
  renderList();
  renderStrip();
  loadApprovalsInfo();

  if (advance && nextId){ setTimeout(() => selectQuestion(nextId), 220); }
  else { renderDetail(); setSaveState(advance ? '마지막 항목입니다 · ' + msg : msg, 'ok'); }
}

/* 목록 위 요약줄만 갱신 */
function loadApprovalsInfo(){
  if (!isAp() || !S.proposal) return;
  const fb = (apLoadStore().feedback) || {};
  const done = Object.keys(fb).filter(id => fb[id].decision).length;
  $('apInfo').innerHTML =
    `묶음 <b>${esc(S.proposal.batch || '(이름 없음)')}</b> · ` +
    `${S.proposal.created ? esc(S.proposal.created) + ' · ' : ''}` +
    `총 <b>${S.rows.length}</b>건 · 판정 <b>${done}</b>건`;
}

function setSaveState(text, cls){
  const el = $('saveState');
  if (!el) return;
  el.textContent = text;
  el.className = 'save-state' + (cls ? ' ' + cls : '');
}

/* ── 저장 ────────────────────────────────────────────────────────────────── */
async function saveVerdict(verdict, advance){
  const r = S.rows.find(x => x.question_id === S.currentId);
  if (!r) return;

  // 승인 대기 모드는 DB 대신 localStorage 에 저장한다 (review_verdicts 와 섞지 않음)
  if (isAp()) return saveApproval(r, verdict, advance);

  const noteEl = $('vnote');
  const note = noteEl ? noteEl.value.trim() : '';
  const existing = S.verdicts[r.question_id];
  const v = verdict || (existing && existing.verdict);

  if (!v){ setSaveState('판정을 먼저 선택하세요', 'err'); return; }

  // ★ 다음 문항은 저장 **전에** 확정한다.
  // '미검토' 필터로 작업할 때 저장 직후 현재 문항이 목록에서 빠지면서
  // 인덱스를 잃어 다음으로 넘어가지 못하는 문제를 막기 위함.
  let nextId = null;
  if (advance){
    const rowsNow = filteredRows();
    const i = rowsNow.findIndex(x => x.question_id === S.currentId);
    if (i !== -1 && rowsNow[i + 1]) nextId = rowsNow[i + 1].question_id;
  }

  setSaveState('저장 중…', '');
  const { error } = await sb.from('review_verdicts').upsert({
    question_id: r.question_id,
    exam:        vScope(),
    reviewer_id: S.user.id,
    verdict:     v,
    note:        note || null
  }, { onConflict: 'question_id,reviewer_id' });

  if (error){ setSaveState('저장 실패: ' + error.message, 'err'); return; }

  S.verdicts[r.question_id] = { verdict:v, note:note };
  S.dirty = false;
  setSaveState('저장됨 · ' + VERDICT_LABEL[v], 'ok');
  renderList();
  renderStrip();

  if (advance && nextId){ setTimeout(() => selectQuestion(nextId), 220); }
  else if (advance){ setSaveState('마지막 문항입니다 · ' + VERDICT_LABEL[v], 'ok'); renderDetail(); setSaveState('마지막 문항입니다 · ' + VERDICT_LABEL[v], 'ok'); }
  else { renderDetail(); setSaveState('저장됨 · ' + VERDICT_LABEL[v], 'ok'); }
}

/* ── 이동 ────────────────────────────────────────────────────────────────── */
async function step(delta){
  const rows = filteredRows();
  const idx = rows.findIndex(r => r.question_id === S.currentId);
  if (idx === -1) return;
  const next = rows[idx + delta];
  if (!next){ setSaveState(delta > 0 ? '마지막 문항입니다' : '첫 문항입니다', ''); return; }
  await selectQuestion(next.question_id);
}

/** 저장 안 한 메모가 있으면 확인 */
async function confirmDiscard(){
  if (!S.dirty) return true;
  const ok = confirm('저장하지 않은 메모가 있습니다. 버리고 이동할까요?');
  if (ok) S.dirty = false;
  return ok;
}

/* ── 키보드 ──────────────────────────────────────────────────────────────── */
document.addEventListener('keydown', (e) => {
  if (!S.user || !S.currentId) return;
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'textarea' || tag === 'input' || tag === 'select';

  if (e.key === 's' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); saveVerdict(null, false); return; }
  if (typing) return;   // 메모 입력 중에는 단축키 비활성

  if (e.key === '1'){ e.preventDefault(); saveVerdict('pass', true); }
  else if (e.key === '2'){ e.preventDefault(); saveVerdict('hold', true); }
  else if (e.key === '3'){ e.preventDefault(); saveVerdict('reject', true); }
  else if (e.key === 'q' || e.key === 'Q' || e.key === 'ArrowUp'){ e.preventDefault(); step(-1); }   // 이전
  else if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowDown'){ e.preventDefault(); step(1); }   // 다음
});

window.addEventListener('beforeunload', (e) => {
  if (S.dirty){ e.preventDefault(); e.returnValue = ''; }
});

applyFontScale();   // 로그인 화면부터 배율 적용
initAuth();
</script>
